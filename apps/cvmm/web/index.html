<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CVMM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="sidebar">
    <div class="logo">CVMM</div>
    <div id="hostname" class="hostname">codex-vm</div>
    <hr class="sep">
    <div id="nav-items"></div>
    <div class="sidebar-bottom">
      <span id="notif-badge" class="badge">0 notifications</span>
    </div>
  </nav>
  <main id="main">
    <header id="header">
      <button id="toggle-sidebar" class="icon-btn">&lt;&lt;</button>
      <button id="nav-back" class="icon-btn" style="display:none">&larr;</button>
      <h2 id="view-title">Dashboard</h2>
      <div class="spacer"></div>
      <div class="sys-gauges">
        <div class="mini-gauge" title="CPU">
          <span class="gauge-label">CPU</span>
          <progress id="sys-cpu" max="100" value="0"></progress>
          <span id="sys-cpu-pct">0%</span>
        </div>
        <div class="mini-gauge" title="Memory">
          <span class="gauge-label">MEM</span>
          <progress id="sys-mem" max="100" value="0"></progress>
          <span id="sys-mem-pct">0%</span>
        </div>
      </div>
      <span id="sys-status" class="status-dot online"></span>
    </header>
    <div id="content"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
