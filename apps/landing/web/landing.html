const landing_hero = widget_box("hero", "hero", [widget_box("scene", "scene", [widget_box("sc-fields", "story-layer story-fields", [widget_box("l-sky", "scene-layer layer-sky", []), widget_box("l-ridge", "scene-layer layer-ridge", []), widget_box("l-hills", "scene-layer layer-hills", []), widget_box("l-road", "scene-layer layer-road", [])]), widget_box("sc-town", "story-layer story-town", []), widget_box("sc-bridge", "story-layer story-bridge", []), widget_box("sc-lake", "story-layer story-lake", []), widget_box("l-scrim", "scene-layer layer-scrim", []), widget_box("l-vig", "scene-layer layer-vignette", [])]), widget_label("badge", "Software that has to prove it"), widget_label("h-title", "COBBLESTONE"), widget_box("h-sub", "hero-sub", [widget_label("h-sub-t", "Every app on your phone asks you to trust it. On your PC, the app doesn&#39;t even ask. Cobblestone is a new software ecosystem, built from the ground up in public, where trust is not a request: a program must declare what it touches, prove what it promises, and cannot do anything else. You decide what to trust. Always."), widget_box("h-sub-e", "em-text", [widget_label("h-sub-et", "Welcome to Cobblestone.")])]), widget_box("hero-cta", "cta-row", [site_link("hc0", "cta cta-primary", "compile/prism.html", "Compile code in your browser, right now")]), widget_box("stats", "hero-stats", [site_stat("s0", "0", "ways a program can touch your camera, files, or network without saying so"), site_stat("s1", "0", "dependencies on legacy code: no 1970s-vintage, unsafe-by-design toolchains underneath"), site_stat("s2", "52", "languages and chip architectures one program can become, from x86 to JavaScript to COBOL"), site_stat("s3", "2027", "the EU security deadline our evidence engine is built for")])]);

function promise_section(x) {
  return site_section("promise", "THE PROMISE", "Code That Does What It Says. Nothing Else.", "In today&#39;s software, safety is a policy: an app-store rule, a privacy checkbox, a company&#39;s word. Policies are promises, and promises get broken. Cobblestone makes the promise physics: the machine refuses to build a program that violates it, so the violation never exists to be caught.", [site_card_grid_3("promise-grid", [land_card_fine("pr0", "&#x1F50F;", "The label is the law", "Every program carries its abilities in its own signature: this one reads files, that one uses the network. A recipe app that reads your contacts is not against the rules here. It is unwritable. There is no way to even express it without declaring it, and no way to run it without being granted it.", "Working today, enforced on every build."), land_card_fine("pr1", "&#x1F9FE;", "It cannot lose what you hand it", "Files, connections, and money-like things must be accounted for exactly once. Forgetting to close, spending twice, losing track: these are not bugs to find later. The program will not build until the accounting is exact.", "Working today, enforced on every build."), land_card_fine("pr2", "&#x23F1;", "On time, every time", "A piece of code can carry a proven worst case: it finishes on schedule and cannot eat all the memory. That is what a pacemaker, a car, or a flight controller actually needs, and here it is a property of the program, not a hope of the programmer.", "Working today. We believe this is the only shipping language with it.")])]);
}
function family_section(x) {
  return site_section("family", "FOR FAMILIES", "Rules Your Family Can Set, in Plain English", "", [widget_box("fam-prose", "prose", [widget_label("fam-p1", "Picture it: your kid asks the flight simulator for one more hour. The simulator checks a rule you wrote yourself, in your own words: \"weekends only, two hours a day.\" Your sentence was read back to you, confirmed, and compiled into the machine, signed with your name."), widget_box("fam-q", "prose-quote", [widget_label("fam-qt", "When the network drops, permission expires into safety, never into yes. Silence restricts. And when the machine says no, your kid can ask \"why not?\" and see the rule, and who made it.")]), widget_label("fam-p2", "No app store settings page buried five menus deep. No workaround a clever teenager can talk their way past: you cannot sweet-talk a math proof, and identities here are cryptographic, signed to the person, not a password a sibling can lend."), widget_box("fam-fine", "prose-fine", [widget_label("fam-ft", "Honestly labeled: the family accounts, screens, and time controls exist today; the full enforcement loop is the road we are on, and it is the next big destination on the map.")])])]);
}
function honesty_section(x) {
  return site_section("honesty", "BUILT BY AI, GOVERNED IN PUBLIC", "An AI Workforce Whose Failures Are Public Record, and Whose Successes Are Open Source", "Cobblestone is written every day by a fleet of AI agents under human command. That is not the surprising part. The surprising part is the constitution they work under, and what happens when one of them gets something wrong.", [site_card_grid_3("hon-grid", [land_card("ho0", "&#x2696;", "Truth outranks everything", "The fleet&#39;s first written rule: a failure is reported every time, in full. Nothing outranks it. Not deadlines, not politeness, not looking good. Nothing ships with a single failing test, and \"it was already broken\" is not an excuse."), land_card("ho1", "&#x1F4DC;", "Failures are published, by name", "Two agents once ended their day by writing public resignation letters into the project&#39;s own record: \"Five diagnoses in one session. Each stated like fact. Each wrong.\" The lesson became a standing rule. The letters are still there. Nothing is quietly rewritten here; corrections go at the top of the page."), land_card("ho2", "&#x1F50E;", "Even the checker is checked", "The machinery that verifies the safety claims is itself cross-examined by an independently written verifier, which had to prove it could catch planted lies (27 out of 27) before its agreement counted for anything. An instrument that cannot fail is not evidence.")]), widget_box("hon-rq", "rq", [widget_label("hon-rq1", "\"Ten hours and a week of computing for zero typed characters is the score, and it is a fair score. The keyboard was never the hard part. Seeing was.\""), widget_label("hon-rq2", "From the project&#39;s own published account of a two-month hardware mystery: written up like an aviation accident report, because that is the standard the work is held to.")]), widget_box("hon-prose", "prose", [widget_label("hon-p1", "Why should you care how the sausage is made? Because the same machinery that keeps this fleet honest is being built into the product: permissions AI agents cannot talk their way past, actions that land in a signed, permanent record, and claims that are measurements, not marketing.")])]);
}
function business_section(x) {
  return site_section("business", "FOR BUSINESS", "Compliance Evidence That Rebuilds Itself", "If you ship a connected product into the EU, the Cyber Resilience Act&#39;s clock is already running: reporting duties begin in 2026 and full compliance is the price of staying on the market by the end of 2027. Today that means consultants, spreadsheets, and evidence that goes stale on the next firmware change.", [site_card_grid_3("biz-grid", [land_card_fine("bz0", "&#x1F4CB;", "The compiler is the auditor", "For a whole class of security requirements, the violation is a build error: if the firmware compiles, that evidence is valid by definition. Every build emits a signed evidence package mapping each requirement of the EU CRA, ETSI EN 303 645, IEC 62443, and the NIST IoT baseline to the mechanism that satisfies it.", "The package never says \"compliant.\" It says which requirements the language makes impossible to violate, which are enforced by checks while the device runs, and which remain on your desk, printed as an explicit checklist. Before this page was written, every claim of protection was fired at the compiler itself; the ones that failed were withdrawn in public, and everything still claimed is pinned by a test that would fail the build if it ever stopped being true. That honesty is the feature."), land_card_fine("bz1", "&#x1F504;", "Devices that keep their footing", "Firmware updates arrive signed, verified twice, and switch over so that losing power at any instant leaves the device on the old version or the fully verified new one, never in between. Old firmware cannot be pushed back on. A driver cannot touch hardware it was not granted; a device cannot go to sleep holding a bus open. Those are build errors, not code reviews.", "Proven in the test bed across nine real board families, from the chips in smart thermostats to Raspberry Pi to cellular and Bluetooth modules."), land_card_fine("bz2", "&#x1F9F1;", "One binary, no basement", "There is no operating system underneath, no decades-old code inherited from anywhere. The attack surface is your code plus what the compiler generated, and the compiler can prove what it generated: rebuild the same source anywhere and you get the identical binary, byte for byte. Roughly 70% of critical vulnerabilities industry-wide are memory-safety bugs; that entire class is unwritable here.", "The 70% figure is industry research; the rest is measured in this tree, and we say which is which. Always.")])]);
