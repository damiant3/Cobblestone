<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobblestone -- The Arcade</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#e8e6df; --dim:#9a9488; --gold:#d4a017; --deep:#0a0a12;
    --panel:rgba(18,18,30,.82); --edge:rgba(212,160,23,.18);
  }
  body{background:var(--deep);color:var(--ink);
    font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}

  .topbar{display:flex;align-items:center;gap:22px;padding:12px 24px;background:#070710;
    border-bottom:1px solid #1e1e2e;position:sticky;top:0;z-index:20}
  .topbar-logo{color:var(--gold);font-size:18px;font-weight:700;letter-spacing:1px}
  .topbar .here{color:var(--dim);font-size:14px}

  /* The chosen game's scene, behind everything, dimmed hard enough that a
     board stays readable on top of it. */
  #scene{position:fixed;inset:0;z-index:-2;background:#0a0a12 center/cover no-repeat;
    transition:background-image .35s ease;filter:brightness(.34) saturate(.85)}
  #scrim{position:fixed;inset:0;z-index:-1;
    background:radial-gradient(ellipse at 50% 0%,rgba(10,10,18,.28),rgba(10,10,18,.93) 72%)}

  .wrap{display:grid;grid-template-columns:238px minmax(0,1fr);gap:22px;
    max-width:1240px;margin:0 auto;padding:22px 20px 64px}
  @media (max-width:940px){.wrap{grid-template-columns:1fr}}

  /* --- the gallery ---------------------------------------------------- */
  .side{align-self:start;position:sticky;top:66px;max-height:calc(100vh - 88px);
    overflow-y:auto;padding-right:4px}
  .side::-webkit-scrollbar{width:7px}
  .side::-webkit-scrollbar-thumb{background:#26263a;border-radius:4px}
  /* The picker is a row of kinds and then only that kind's games, rather
     than all thirty-four in one column you have to scroll. */
  .cats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
  .cats button{background:rgba(18,18,30,.9);border:1px solid #26263a;border-radius:16px;
    color:var(--dim);font-family:inherit;font-size:11px;padding:5px 11px;cursor:pointer}
  .cats button:hover{border-color:rgba(212,160,23,.45);color:var(--ink)}
  .cats button.on{background:rgba(212,160,23,.16);border-color:rgba(212,160,23,.55);
    color:var(--gold);font-weight:600}
  .cats button .n{opacity:.6;font-size:10px;margin-left:4px}
  .pick{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
    background:none;border:1px solid transparent;border-radius:9px;color:#cfcabf;
    font-family:inherit;font-size:13px;padding:4px 7px;margin-bottom:2px}
  .pick:hover{background:rgba(255,255,255,.04);border-color:#26263a}
  .pick.on{background:rgba(212,160,23,.14);border-color:rgba(212,160,23,.5);
    color:var(--gold);font-weight:600}
  .pick img{width:40px;height:27px;object-fit:cover;border-radius:4px;
    background:#15151f;flex:0 0 auto}
  .pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .tag{font-size:9px;color:var(--dim);letter-spacing:.6px}
  .pick.off{color:#565f6b;cursor:default}
  .pick.off:hover{background:none;border-color:transparent}

  /* --- the stage ------------------------------------------------------ */
  h1{font-size:25px;font-weight:700;color:#fff;margin-bottom:3px;letter-spacing:.2px}
  .desc{color:var(--dim);font-size:13.5px;line-height:1.65;margin-bottom:16px;max-width:72ch}
  .bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:12px}
  .bar button{background:rgba(18,18,30,.9);border:1px solid #26263a;border-radius:20px;
    color:var(--ink);font-family:inherit;font-size:13px;padding:7px 15px;cursor:pointer}
  .bar button:hover:not(:disabled){border-color:rgba(212,160,23,.5)}
  .bar button:disabled{opacity:.3;cursor:default}
  .bar button.act{border-color:rgba(212,160,23,.45);color:var(--gold)}
  .seg{display:inline-flex;border:1px solid #26263a;border-radius:20px;overflow:hidden}
  .seg button{border:none;border-radius:0;background:rgba(18,18,30,.9)}
  .seg button.on{background:rgba(212,160,23,.18);color:var(--gold);font-weight:600}
  .bar label{color:var(--dim);font-size:12px}
  input[type=range]{width:88px;accent-color:var(--gold)}

  #status{color:var(--gold);font-size:14.5px;font-weight:600;min-height:22px;margin-bottom:10px}
  #status .you{color:#7ee787}
  .stage{background:var(--panel);border:1px solid var(--edge);border-radius:16px;
    padding:20px;margin-bottom:16px;position:relative;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.45);backdrop-filter:blur(3px);
    display:flex;justify-content:center;min-height:120px;align-items:center;
    touch-action:none}
  /* Zoom and pan. The transform is on an inner layer so the panel itself
     keeps its size and the board is clipped by it rather than pushing the
     page around. */
  /* `zoom` rather than `transform: scale()`. A scale transform enlarges a
     layer the browser already rasterised, so a board that is crisp at 100%
     goes soft and pixelly on the way up -- text worst of all. `zoom` runs
     layout again at the new size, so every glyph and every drawn piece is
     redrawn at the resolution it ends up being seen at. */
  #panwrap{transform-origin:center center}
  #pan{transform-origin:center center}
  .stage.zoomed{cursor:grab}
  .stage.zoomed.dragging{cursor:grabbing}
  /* Zoomed, the panel itself grows and breaks out of its column so the
     board has the width of the browser to use. It only starts clipping,
     and only then needs dragging, once it butts against that edge. */
  .stage.wide{position:relative;left:50%;transform:translateX(-50%);max-width:none}
  .note{background:rgba(18,18,30,.75);border:1px solid #22222f;border-radius:12px;
    padding:15px 17px;color:var(--dim);font-size:12.5px;line-height:1.75;max-width:80ch}
  .note b{color:var(--ink)}
  .note code{font-family:ui-monospace,monospace;color:var(--gold);font-size:11.5px}
  .note p+p{margin-top:8px}
  .fail{color:#f0883e}

  /* Board tokens are drawn, not read. Letting the caret and the text
     selection loose on them turns a click into a drag-select and deadens
     the glyph itself to the click, which is the whole reason a token that
     was just a character felt dead to the pointer. */
  .stage,.stage *{user-select:none;-webkit-user-select:none}
  .stage{cursor:default}
  .clickable [data-i]{cursor:pointer}

  /* --- boards --------------------------------------------------------- */
  .grid{display:grid;gap:2px;justify-content:center}

  /* The piece you are carrying, shown where it would come to rest. */
  .ghost{opacity:.42;pointer-events:none}
  .ghost.disc::after,.ghost.stone::after{animation:none}
  /* Three ways a piece can arrive, and each game says which one it uses.
     drop: it fell (Connect Four). slide: it came from another square
     (checkers). placed: it was set down where it now is (Othello, Go). */
  .g.landed::after{animation:drop .28s cubic-bezier(.3,.85,.4,1)}
  .g.slid::after{animation:slide .22s ease-out}
  .g.placed::after{animation:place .22s ease-out}
  @keyframes drop{from{transform:translateY(calc(var(--fall,1) * -104%))}to{transform:none}}
  @keyframes slide{from{transform:translate(var(--dx,0),var(--dy,0))}to{transform:none}}
  @keyframes place{from{transform:scale(.35);opacity:.2}to{transform:none;opacity:1}}
  #hand.carry{width:44px;height:44px;margin:-22px 0 0 -22px;opacity:.85;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
  #hand.carry .ckp::after,#hand.carry .card{position:absolute;inset:0}
  #hand.carry .chk{position:absolute;inset:0;width:auto;height:auto}
  #hand.carry .urp{position:absolute;inset:0;width:auto;height:auto}
  #hand{position:fixed;pointer-events:none;z-index:30;width:34px;height:34px;
    margin:-17px 0 0 -17px;opacity:.9;display:none}
  #hand.on{display:block}
  #hand .disc,#hand .stone{position:absolute;inset:0}
  #hand .disc::after,#hand .stone::after{inset:0}
  #hand .mark{font-size:30px;line-height:34px;text-align:center;color:#f0883e;
    text-shadow:0 2px 6px rgba(0,0,0,.7)}
  #hand .hexchip{position:absolute;inset:0;background:#b6402f;
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}

  /* Tic-tac-toe as it is on paper: two strokes each way, no boxes. */
  .board-ttt{gap:0;background:none}
  .board-ttt .g{background:none;border:0 solid rgba(232,230,223,.55)}
  .board-ttt .g.c0,.board-ttt .g.c1{border-right-width:3px}
  .board-ttt .g.r0,.board-ttt .g.r1{border-bottom-width:3px}
  .board-ttt .g.x{color:#f0883e}.board-ttt .g.o{color:#58a6ff}
  .board-ttt .g{font-size:40px;text-shadow:0 2px 6px rgba(0,0,0,.6)}

  /* War: two decks facing each other, the showdown between them, and the
     count of cards held on the outside edge, which is the only score the
     game has. */
  .warboard{display:flex;align-items:center;gap:26px;padding:8px}
  .warside{display:flex;align-items:center;gap:14px}
  .warside.r{flex-direction:row-reverse}
  .warcount{font-size:30px;font-weight:700;color:var(--gold);min-width:52px;
    text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .wardeck{position:relative;width:52px;height:74px;border-radius:6px;
    background:repeating-linear-gradient(45deg,#2a3f6b 0 5px,#22335a 5px 10px);
    border:1px solid #1b2947;
    box-shadow:2px 2px 0 #1b2947,4px 4px 0 #16223c,0 6px 14px rgba(0,0,0,.5);
    display:flex;align-items:flex-end;justify-content:center}
  .wardeck.empty{background:none;border:1px dashed #3a3a4c;box-shadow:none}
  .wardeck span{font-size:9px;color:#b9c6e6;margin-bottom:4px;letter-spacing:.4px}
  .wardeck.empty span{color:#565f6b}
  .warcard{width:52px;height:74px;display:flex;align-items:center;justify-content:center}
  .warcard .card{width:52px;height:74px;font-size:15px}
  .warcard.takes .card{box-shadow:0 0 0 2px var(--gold),0 4px 12px rgba(212,160,23,.5)}
  .warmid{color:var(--dim);font-size:13px;letter-spacing:2px;min-width:44px;text-align:center}
  .card.flip{animation:flip .3s ease-out}
  @keyframes flip{from{transform:rotateY(90deg) scale(.9);opacity:.3}to{transform:none;opacity:1}}

  /* The Royal Game of Ur: three rows of eight, two squares missing from
     each player's row, rosettes marked. */
  .urwrap{display:flex;align-items:center;gap:14px}
  .urboard{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;
    background:linear-gradient(150deg,#6b5836,#3b3020);border:3px solid #2a2216;
    box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 8px 26px rgba(0,0,0,.45)}
  .urrow{display:flex;gap:6px}
  .ursq{position:relative;width:52px;height:52px;border-radius:6px;
    background:linear-gradient(160deg,#e8dcc0,#c3b189);border:1px solid #8a7a58;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 1px 3px rgba(255,255,255,.45)}
  .ursq.gap{background:none;border:none;box-shadow:none}
  .ursq.rosette{background:linear-gradient(160deg,#f3dc9c,#c9a763)}
  .ursq.rosette::before{content:'✦';position:absolute;font-size:30px;color:#8a6a24;
    opacity:.55;line-height:1}
  .ursq.hint{outline:2px solid var(--gold);cursor:pointer}
  .ursq.hint:hover{filter:brightness(1.12)}
  .urstep{position:absolute;top:2px;left:4px;font-size:9px;color:#6d5f43;opacity:.7}
  .urp{width:30px;height:30px;border-radius:50%;display:inline-block;z-index:1;
    box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 2px rgba(255,255,255,.35)}
  .urp.p1{background:radial-gradient(circle at 34% 28%,#f7f2e4,#c3b48c)}
  .urp.p2{background:radial-gradient(circle at 34% 28%,#5a5a5a,#141414)}
  .urside{display:flex;flex-direction:column;gap:12px}
  .urtray{display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.32);
    border:1px solid #3a3120;color:var(--dim);font-size:10px}
  .urtray b{display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#1a1a10}
  .urtray.hint{outline:2px solid var(--gold);cursor:pointer}

  /* Actions that belong under the board rather than up in the toolbar. */
  .stageacts{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .stageacts button{background:rgba(18,18,30,.9);border:1px solid rgba(212,160,23,.45);
    border-radius:20px;color:var(--gold);font-family:inherit;font-size:14px;
    padding:8px 22px;cursor:pointer}
  .stageacts button:hover:not(:disabled){background:rgba(212,160,23,.18)}
  .stageacts button:disabled{opacity:.3;cursor:default}
  .stagecol{display:flex;flex-direction:column;width:100%}

  /* Mancala: a carved board with stones in the cups. */
  .mboard{display:flex;align-items:stretch;gap:10px;padding:14px;border-radius:60px;
    background:linear-gradient(160deg,#7d5a30,#4d3720);border:3px solid #3a2a17;
    box-shadow:inset 0 3px 18px rgba(0,0,0,.55),0 8px 26px rgba(0,0,0,.45)}
  .mrows{display:flex;flex-direction:column;gap:10px}
  .mrow{display:flex;gap:10px}
  .mpit{position:relative;width:62px;height:62px;border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#33240f,#5b421f);
    box-shadow:inset 0 4px 10px rgba(0,0,0,.75);display:flex;align-items:center;
    justify-content:center}
  .mpit.hint{outline:2px solid rgba(212,160,23,.75);cursor:pointer}
  .mpit.hint:hover{outline-color:var(--gold);background:radial-gradient(circle at 50% 35%,#4a3416,#6d5027)}
  .mcount{position:absolute;font-size:15px;font-weight:700;color:#f6e9cf;z-index:2;
    text-shadow:0 1px 3px #000}
  .mstones{position:absolute;inset:9px;display:flex;flex-wrap:wrap;
    align-content:center;justify-content:center;gap:2px;opacity:.85}
  .mstones i{width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e9d9b6,#9b8455)}
  .mstore{width:60px;border-radius:32px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;color:var(--gold);
    background:radial-gradient(circle at 50% 25%,#33240f,#5b421f);
    box-shadow:inset 0 4px 12px rgba(0,0,0,.75)}
  .mstore span{font-size:10px;color:#c9b48c;letter-spacing:.5px}
  .mstore b{font-size:21px}
  .g{display:flex;align-items:center;justify-content:center;border-radius:3px;
    font-size:13px;font-weight:600;line-height:1;aspect-ratio:1;min-width:0;
    position:relative;transition:outline-color .12s}
  .g.big{font-size:26px}
  .clickable .g.hint{cursor:pointer;outline:1px solid rgba(212,160,23,.55)}
  .clickable .g.hint:hover{outline:2px solid var(--gold)}
  .g.picked{outline:2px solid #7ee787 !important;z-index:2}

  .felt{background:#1a7a37;background-image:linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12))}
  .disc::after{content:'';position:absolute;inset:11%;border-radius:50%;
    box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 1px 3px rgba(255,255,255,.18)}
  .disc.black::after{background:radial-gradient(circle at 34% 28%,#454545,#080808)}
  .disc.white::after{background:radial-gradient(circle at 34% 28%,#fff,#c2c2c2)}
  .disc.red::after{background:radial-gradient(circle at 34% 28%,#ff8574,#b62f24)}
  .disc.yellow::after{background:radial-gradient(circle at 34% 28%,#ffe694,#cf9c0d)}

  .sq-light{background:#c8b48a}.sq-dark{background:#5c4326}
  /* Checkers pieces are drawn discs filling the square, not a glyph. */
  .ckp::after{content:'';position:absolute;inset:9%;border-radius:50%;
    box-shadow:0 2px 5px rgba(0,0,0,.65),inset 0 2px 4px rgba(255,255,255,.3),
      inset 0 -3px 5px rgba(0,0,0,.35)}
  .ckp.s::after{background:radial-gradient(circle at 34% 28%,#f0705c,#8e2418)}
  .ckp.n::after{background:radial-gradient(circle at 34% 28%,#fbfaf5,#b9b3a4)}
  .ckp.k::before{content:'♛';position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-size:19px;z-index:2;
    color:#f6d67a;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .ckp.n.k::before{color:#8a6a24}

  .goban{background:#d9b571;color:#000}
  .goban::before{content:'';position:absolute;inset:0;
    background:linear-gradient(#00000055,#00000055) center/100% 1px no-repeat,
               linear-gradient(#00000055,#00000055) center/1px 100% no-repeat}
  .stone::after{content:'';position:absolute;inset:8%;border-radius:50%;
    box-shadow:0 2px 4px rgba(0,0,0,.55);z-index:1}
  .stone.black::after{background:radial-gradient(circle at 34% 28%,#4a4a4a,#000)}
  .stone.white::after{background:radial-gradient(circle at 34% 28%,#fff,#bdbdbd)}

  .tile{background:#1c1c2b;color:var(--ink);border-radius:5px}
  .tile.t0{background:rgba(255,255,255,.05)}
  .tile.t2,.tile.t4{background:#3f3a2a;color:#efe7d4}
  .tile.t8,.tile.t16{background:#8a6320;color:#fff}
  .tile.t32,.tile.t64{background:#b26f16;color:#fff}
  .tile.t128,.tile.t256,.tile.t512{background:#d19410;color:#1a1a10}
  .tile.t1024,.tile.t2048,.tile.tbig{background:var(--gold);color:#1a1a10;
    box-shadow:0 0 16px rgba(212,160,23,.55)}
  .tile.gone{background:transparent;box-shadow:none}
  .tile.free{outline:1px solid rgba(212,160,23,.4)}

  .life{border-radius:1px}
  .life.on{background:var(--gold);box-shadow:0 0 5px rgba(212,160,23,.7)}
  .life.off{background:rgba(255,255,255,.045)}
  .ms{background:#20202e;font-size:11px;cursor:pointer}
  .ms.hidden{background:linear-gradient(145deg,#33334a,#242436)}
  .ms.open{background:#15151f;color:var(--dim);cursor:default}
  .ms.boom{background:#7a2418}
  .ms.n1{color:#58a6ff}.ms.n2{color:#3fb950}.ms.n3{color:#f0883e}
  .ms.n4{color:#a371f7}.ms.n5{color:#f85149}.ms.n6{color:#39c5cf}
  .sud{background:rgba(255,255,255,.06);color:var(--ink);font-size:14px}
  .sud.shade{background:rgba(255,255,255,.12)}

  .space{background:rgba(255,255,255,.06);font-size:10px;color:var(--gold)}
  .space.o1{background:#2f4630}.space.o2{background:#4a2c2c}
  .space.o3{background:#2c3a52}.space.o4{background:#453a20}
  .terr{background:rgba(255,255,255,.06);font-size:12px;border-radius:6px}
  .terr.o0{color:#565f6b}.terr.o1{background:#2f4630;color:#8ee79a}
  .terr.o2{background:#4a2c2c;color:#ff9d92}.terr.o3{background:#2c3a52;color:#8ab4ff}
  .terr.o4{background:#453a20;color:#ffd97a}
  .sea{background:#13233f;font-size:11px;color:var(--dim)}
  .sea.t1{background:#1d3050}.sea.t2{background:#7a2418;color:#fff}
  .terrain{background:#1e2a1e}.terrain.t1{background:#2a3a24}.terrain.t2{background:#3a3226}
  .terrain.t3{background:#24303a}.terrain.t4{background:#2e2436}
  .unit{font-size:11px;font-weight:700}
  .unit.o0{background:#2f4630;color:#8ee79a}.unit.o1{background:#4a2c2c;color:#ff9d92}

  .dot{background:#8d8778;border-radius:50%;width:9px;height:9px;margin:auto;aspect-ratio:1}
  .hedge,.vedge{background:rgba(255,255,255,.07);border-radius:2px}
  .hedge.on,.vedge.on{background:var(--gold);box-shadow:0 0 7px rgba(212,160,23,.6)}
  .clickable .hedge.off:hover,.clickable .vedge.off:hover{background:rgba(212,160,23,.45);cursor:pointer}
  .boxcell{font-size:11px}
  .boxcell.o1{background:#2f4630;color:#8ee79a}.boxcell.o2{background:#4a2c2c;color:#ff9d92}

  .hex{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
  .hexrow{display:flex;gap:2px}
  .hexrow .g{width:26px;height:26px;aspect-ratio:auto;font-size:10px;
    background:rgba(255,255,255,.07);
    clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)}
  .hexrow .g.p1{background:#b6402f}.hexrow .g.p2{background:#2f5b9e}

  /* --- rows, chips, cards --------------------------------------------- */
  .rows{display:flex;flex-direction:column;gap:11px;width:100%}
  .rowline{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .rowlab{color:var(--dim);font-size:11.5px;min-width:112px;letter-spacing:.3px}
  .chip,.pit,.store,.die,.peg,.setcard{display:inline-flex;align-items:center;
    justify-content:center;background:rgba(255,255,255,.07);border:1px solid #2d2d40;
    border-radius:7px;color:var(--ink);font-size:12px;min-width:32px;height:30px;padding:0 8px}
  .chip.big{font-size:19px;height:40px;padding:0 16px;color:var(--gold);font-weight:700}
  .chip.gold{color:var(--gold)}
  .chip.p1{background:#4a2c2c}.chip.p2{background:#2c3a52}
  .clickable .hint{cursor:pointer;outline:1px solid rgba(212,160,23,.55)}
  .pit{background:#6b4b2a;border-color:#4a3520;min-width:42px;height:42px;
    border-radius:50%;font-weight:700;color:#f3e6cf}
  .pit.north{background:#4a3a5c}
  .store{background:#3f2d18;color:var(--gold);font-weight:700;min-width:54px;height:52px;
    border-radius:26px}
  .die{background:#f4f2e8;color:#16161e;font-weight:700;min-width:30px;border-radius:6px}
  /* Yahtzee: a die you are holding, and a scorecard box that is spent.
     A held die has to read as held from across the board, because the whole
     turn is deciding which ones to keep. */
  .die.big{font-size:31px;height:46px;min-width:46px;line-height:1}
  .clickable .die[data-i]{cursor:pointer}
  .die.picked{outline:2px solid #7ee787;background:#fff;
    box-shadow:0 0 10px rgba(126,231,135,.45)}
  /* Sudoku: the digit in hand, the squares you were given, and the ones you
     wrote. A given must not read like a guess, or the puzzle looks solved
     when it is only started. */
  .sdpick{display:flex;gap:6px;justify-content:center;padding:2px 0 12px;flex-wrap:wrap}
  .sud.given{font-weight:800;color:var(--ink)}
  .sud.mine{color:#7ee787}
  .clickable .sud.hint{outline:1px solid rgba(212,160,23,.5);cursor:pointer}
  .clickable .sud.hint:hover{outline:2px solid var(--gold)}
  .chip.open{color:var(--gold)}
  .clickable .chip.open{cursor:pointer}
  .clickable .chip.open:hover{background:rgba(212,160,23,.16)}
  /* A spent box is history, not a choice. It shows what it actually took. */
  .chip.spent{opacity:.5;color:var(--dim)}
  .peg{border-radius:50%;min-width:26px;height:26px}
  .peg.c0{background:#c1352b}.peg.c1{background:#1f6feb}.peg.c2{background:#2f7a3a}
  .peg.c3{background:#b58b12}.peg.c4{background:#7a3fb3}.peg.c5{background:#2c8a8a}
  .setcard{min-width:46px;font-weight:700;background:#f4f2e8;color:#16161e}
  .setcard.s0{color:#c1352b}.setcard.s1{color:#2f7a3a}.setcard.s2{color:#7a3fb3}
  .setcard.f0{opacity:.6}.setcard.f2{text-decoration:underline}

  /* Playing cards: the four court ranks and the back are real art; the pip
     cards are drawn, because the deck ships faces and a single pip mark. */
  /* Cards are DRAWN: index in the corner, pip through the middle. No
     painted faces. In a ten-column tableau a card has to be read at a
     glance from the sliver of it that is showing, and an illustration
     cannot be. */
  .card{position:relative;display:inline-block;
    width:48px;height:66px;border-radius:6px;background:#f9f8f3;color:#16161e;
    border:1px solid #b9b4a4;flex:0 0 auto;
    box-shadow:0 2px 5px rgba(0,0,0,.45)}
  .card.red{color:#c1352b}
  /* The index is the rank over its suit in the corner, and it is the half
     of the card that has to survive being covered: in a ten-column tableau
     only the top few millimetres of a buried card is showing. */
  .card i{position:absolute;top:2px;left:4px;font-style:normal;font-weight:800;
    font-size:12px;line-height:1;letter-spacing:-.5px;text-align:center;z-index:2}
  .card i em{display:block;font-style:normal;font-weight:700;font-size:9px;
    line-height:1.1}
  /* The rank PAINTED as that many pips, laid out where a printed deck lays
     them, the lower half inverted. The field is inset past the corner
     index rather than spanning the whole card. */
  /* The field is inset SYMMETRICALLY left and right, so the pips (whose x
     values are 26/50/74) sit centred on the card. It used to be left:14px
     against right:4px to clear the corner index, which pushed every pip 5px
     right of centre. It clears the index by starting BELOW it instead, which
     is where a printed card puts the pip field (Damian, 2026-09-02). */
  .card .pips,.card .court{position:absolute;top:21px;right:3px;bottom:3px;left:3px}
  .card .pip{position:absolute;transform:translate(-50%,-50%);
    font-size:9px;line-height:1}
  .card .pip.inv{transform:translate(-50%,-50%) rotate(180deg)}
  /* One large mark, the way an ace is printed. */
  .card .pips.a1 .pip{font-size:26px}
  /* A court card and an ace show the LETTER alone in the middle, no suit
     under it: the suit is already in the corner index (Damian, 2026-09-02). */
  .card .court{display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:800;line-height:1}
  .card.back,.card.facedown{background:#2a3f6b;color:transparent;border-color:#1b2947;
    background-image:repeating-linear-gradient(45deg,#2a3f6b 0 5px,#22335a 5px 10px)}
  .card.empty{background:none;border:1px dashed #6a6455;box-shadow:none}
  .card.empty.drop{border-color:rgba(212,160,23,.7);background:rgba(212,160,23,.07)}
  .card.movable{box-shadow:0 2px 5px rgba(0,0,0,.45),0 0 0 1px rgba(212,160,23,.6)}
  .card.picked{box-shadow:0 0 0 2px #7ee787,0 4px 10px rgba(0,0,0,.5);z-index:3}
  /* Where what you are carrying would land, asked of the engine. */
  .card.takes{box-shadow:0 0 0 2px rgba(126,231,135,.8),0 4px 10px rgba(0,0,0,.5)}
  /* A hint points; it does not play. */
  .card.hintfrom{box-shadow:0 0 0 2px #58a6ff,0 4px 10px rgba(0,0,0,.5);z-index:2}
  .card.hintto{box-shadow:0 0 0 2px #7ee787,0 0 14px rgba(126,231,135,.5);z-index:2}

  /* Room between the columns, and enough of each card showing to read it. */
  .cols{display:flex;gap:14px;align-items:flex-start;padding:4px}
  .col{display:flex;flex-direction:column;min-width:48px;padding-bottom:52px;cursor:pointer}
  /* 30px of each buried card shows. The corner index is rank (13px) over suit
     (11px) from top:2px, so it needs 26px; at -44 the strip was 22px and the
     suit was clipped by the card above it (Damian, 2026-09-02). */
  .col .card{margin-top:-36px}
  .col .card:first-child{margin-top:0}
  .col .card.facedown{margin-top:-52px}
  .col .card.facedown:first-child{margin-top:0}

  /* Klondike: the stock, the waste and four foundations over the tableau.
     The gap between the waste and the foundations is the table itself, and
     it is what makes the two halves read as two different things. */
  .ktop{display:flex;align-items:flex-start;gap:9px;padding:4px 4px 16px}
  .kgap{flex:0 0 22px}
  .kstock{width:48px;height:66px;border-radius:6px;flex:0 0 auto;cursor:pointer;
    border:1px solid #1b2947;color:#cdd9f5;
    background-image:repeating-linear-gradient(45deg,#2a3f6b 0 5px,#22335a 5px 10px);
    box-shadow:0 2px 5px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .kstock b{font-size:19px;line-height:1}
  .kstock span{font-size:8px;color:#93a4c8;letter-spacing:.4px}
  .kstock.spent{background-image:none;border:1px dashed #4a4a5a;color:#5b6070;
    box-shadow:none}
  .kstock.spent.ready{border-color:rgba(212,160,23,.75);color:var(--gold);
    background:rgba(212,160,23,.07)}
  .card.kfound{display:flex;align-items:center;justify-content:center;
    font-size:23px;color:#6a6455}
  .card.empty.kfound.red{color:#7d4a44}
  /* A card turned from the stock comes across to the waste. */
  @keyframes turned{
    from{transform:translateX(-57px) rotateY(78deg);opacity:.15}
    to{transform:none;opacity:1}
  }
  .card.kwaste.dealt{animation:turned .26s ease-out both}
  .kcols{padding-top:0}

  /* The stock, and the eight runs. Spider has no ace foundations: a
     completed king-to-ace run leaves the tableau on its own, so these are
     the runs that have GONE, which is the whole of the score. */
  .tray{display:flex;align-items:center;gap:20px;padding:2px 6px 14px}
  .stockpile{width:48px;height:66px;border-radius:6px;flex:0 0 auto;
    border:1px solid #1b2947;color:#cdd9f5;
    background-image:repeating-linear-gradient(45deg,#2a3f6b 0 5px,#22335a 5px 10px);
    box-shadow:0 2px 5px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .stockpile b{font-size:19px;line-height:1}
  .stockpile span{font-size:8px;color:#93a4c8;letter-spacing:.3px}
  .stockpile.out{background-image:none;border:1px dashed #4a4a5a;
    color:#5b6070;box-shadow:none}
  .runs{display:flex;align-items:center;gap:6px}
  .runslot{width:26px;height:36px;border-radius:4px;flex:0 0 auto;
    border:1px dashed #6a6455}
  .runslot.done{border:1px solid #b9b4a4;background:#f9f8f3;color:#16161e;
    box-shadow:0 2px 5px rgba(0,0,0,.45);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:13px}
  .runlab{font-size:11px;color:var(--dim);margin-left:8px}

  /* A dealt row lands rather than appearing: each card flies in from the
     stock, which sits at the left of the tray, so the further right the
     column the further it travels. `--dx` and the delay are set per card. */
  @keyframes dealt{
    from{transform:translate(var(--dx,-120px),-108px) rotate(8deg);opacity:0}
    to{transform:none;opacity:1}
  }
  .col .card.dealt{animation:dealt .34s cubic-bezier(.2,.72,.3,1) both;z-index:4}

  /* A finished run leaves the board. */
  @keyframes flyaway{
    0%{transform:none;opacity:1}
    100%{transform:translateY(-140px) rotate(12deg) scale(.8);opacity:0}
  }
  .won .col .card{animation:flyaway .7s ease-in forwards}
  .wonbanner{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-size:30px;font-weight:800;color:var(--gold);
    text-shadow:0 3px 14px rgba(0,0,0,.8);pointer-events:none;
    animation:rise .8s ease-out both;z-index:8}
  @keyframes rise{from{transform:translateY(18px) scale(.9);opacity:0}
    to{transform:none;opacity:1}}
  .pair{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .pair figcaption{color:var(--dim);font-size:11.5px;text-align:center;margin-bottom:6px}

  /* --- backgammon, drawn rather than photographed ---------------------- */
  /* A point can hold five checkers plus the overflow counter above them:
     six times 25px and the gaps is 155px, so a 142px row put the counter
     into the dice. The rows are tall enough for a full point now. */
  .bgb{background:#5c4326;border:9px solid #3a2a17;border-radius:8px;
    display:grid;grid-template-columns:repeat(6,34px) 28px repeat(6,34px) 46px;
    grid-template-rows:168px 26px 168px;
    box-shadow:inset 0 0 40px rgba(0,0,0,.55)}
  .pt{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:2px}
  .pt.dn{flex-direction:column-reverse;padding-top:0;padding-bottom:2px}
  .pt::before{content:'';position:absolute;inset:0;
    clip-path:polygon(0 0,100% 0,50% 100%);background:#9a7746;opacity:.92}
  .pt.alt::before{background:#3d2c19}
  .pt.dn::before{clip-path:polygon(0 100%,100% 100%,50% 0)}
  .clickable .pt.hint,.clickable .bgbar.hint,.clickable .bgoff.hint{cursor:pointer}
  .pt.hint::after,.bgbar.hint::after,.bgoff.hint::after{content:'';position:absolute;
    inset:2px;border:2px solid rgba(212,160,23,.75);border-radius:5px;pointer-events:none}
  .pt.picked::after{border-color:#7ee787;border-width:2px}
  .bgbar,.bgoff{position:relative}
  .chk{width:25px;height:25px;border-radius:50%;z-index:1;flex:0 0 auto;
    box-shadow:0 1px 3px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.25)}
  .chk.w{background:radial-gradient(circle at 34% 28%,#fff,#cfc7b4)}
  .chk.b{background:radial-gradient(circle at 34% 28%,#5a5a5a,#111)}
  .chk.more{display:flex;align-items:center;justify-content:center;font-size:11px;
    color:var(--gold);background:#241a0f;box-shadow:none}
  .bgbar{background:#3a2a17;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;position:relative;z-index:1}
  .bgoff{background:#2a1e11;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;color:var(--dim);font-size:10px}
  .bgoff b{font-size:17px;color:var(--gold);line-height:1}
  .bgoff .lbl{letter-spacing:.5px;opacity:.8}
  /* The middle strip and its throw sit above the bar and the points, so a
     tall stack or the bar's own panel cannot paint over the button. */
  .bgmid{background:#4a3520;display:flex;align-items:center;justify-content:space-between;
    padding:0 6px;position:relative;z-index:4}
  /* Each half is the width of one side of the board, and its dice sit in
     the middle of it rather than shoved against an edge. */
  .bghalf{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:20px}
  .bgdice{display:flex;gap:5px}
  .bgdie{display:grid;grid-template-columns:repeat(3,4px);grid-template-rows:repeat(3,4px);
    gap:1px;padding:3px;width:20px;height:20px;border-radius:4px;background:#f4f2e8;
    box-shadow:0 1px 3px rgba(0,0,0,.6)}
  .bgdie.spent{opacity:.35}
  .bgdie i{border-radius:50%;background:transparent}
  .bgdie.w{background:#f4f2e8}
  .bgdie.w i.on{background:#1a1a10}
  .bgdie.b{background:#1c1c1c;box-shadow:0 1px 3px rgba(0,0,0,.7),0 0 0 1px #3a3a3a}
  .bgdie.b i.on{background:#f4f2e8}
  /* The cube sits between the two bear-off trays, inert, at 64. */
  .bgcubewell{background:#2a1e11;display:flex;align-items:center;justify-content:center}
  .bgcube{width:26px;height:26px;border-radius:5px;background:#e8e4d6;color:#1a1a10;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.6);opacity:.8;flex:0 0 auto}
  /* The throw, in the middle of the board where you reach to make it. */
  .bgroll{flex:0 0 auto;background:rgba(212,160,23,.95);border:1px solid #8a6a24;
    border-radius:14px;color:#1a1a10;font-family:inherit;font-size:12px;font-weight:700;
    padding:4px 14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap;
    position:relative;z-index:6}
  .bgroll:hover{background:var(--gold);box-shadow:0 2px 10px rgba(212,160,23,.6)}
</style>
</head>
<body>
<div id="scene"></div><div id="scrim"></div><div id="hand"></div>

<nav class="topbar">
  <span class="topbar-logo">&#x2588; COBBLESTONE</span>
  <a href="../landing.html#today">&#x2190; Back to the site</a>
  <span class="here">The Arcade</span>
</nav>

<div class="wrap">
  <aside class="side" id="side"></aside>
  <main>
    <h1 id="title">The Arcade</h1>
    <p class="desc" id="desc">Every game here is a Codex engine compiled to WebAssembly by the
       project&#39;s own backend and running in this tab. No server decides anything, and no
       JavaScript picks a move.</p>
    <div class="bar" id="bar"></div>
    <div id="status">Choose a game.</div>
    <div class="stage" id="stage"></div>
    <details class="note" id="rules"></details>
    <div class="note" id="note"></div>
  </main>
</div>

<script type="module">
import { GAMES, CHESS, IMPORTS, driver, renderHtml, esc } from './arcade.js';
import { RULES } from './rules.js';

const $ = id => document.getElementById(id);
const CATS = ['Board', 'Card', 'Puzzle', 'Dice', 'Strategy', 'Other'];
const all = [...GAMES, CHESS];

// --- state ---------------------------------------------------------------
// Declared BEFORE the gallery, which reads `cur` to mark the current game.
// A `let` read above its declaration is a temporal-dead-zone error, and in
// a module that aborts the whole script: no tabs, no list, empty panels.
const cache = new Map();
let cur = null, timer = null, playing = false, delay = 260;
const DELAYS = [1400, 900, 600, 400, 280, 180, 110, 60, 25, 5];

// --- the gallery ---------------------------------------------------------
// A kind is picked first and then only its games are listed. Thirty-four in
// one column meant scrolling past three quarters of them to reach any one.
let cat = 'Board', pendingGallery = false;

function gallery() {
  let h = '<div class="cats">' + CATS.map(c => {
    const n = all.filter(g => g.cat === c).length;
    return n ? `<button data-cat="${c}" class="${c === cat ? 'on' : ''}">` +
      `${c}<span class="n">${n}</span></button>` : '';
  }).join('') + '</div>';

  for (const g of all.filter(x => x.cat === cat)) {
    const off = g === CHESS;
    const tag = off ? 'not built' : (g.solo || g.move || g.keys) ? 'you play' : 'watch';
    h += `<button class="pick${off ? ' off' : ''}${cur && cur.game.id === g.id ? ' on' : ''}" ` +
      `data-id="${g.id}"${off ? ' disabled' : ''}>` +
      // Chess has no thumbnail because chess is not built, and a game with
      // no art should read as plain, not as a broken image.
      `<img src="art/thumbs/${g.id}.png" alt="" loading="lazy" onerror="this.remove()">` +
      `<span class="nm">${esc(g.name)}<br><span class="tag">${tag}</span></span></button>`;
  }
  $('side').innerHTML = h;
  for (const b of document.querySelectorAll('.cats button')) {
    b.onclick = () => { cat = b.dataset.cat; gallery(); };
  }
  for (const b of document.querySelectorAll('.pick:not(.off)')) {
    b.onclick = () => select(b.dataset.id);
  }
}
gallery();

async function load(game) {
  if (cache.has(game.id)) return cache.get(game.id);
  const res = await fetch(`${game.id}.wasm`);
  if (!res.ok) throw new Error(`${game.id}.wasm did not load (${res.status})`);
  const mod = await WebAssembly.instantiate(await res.arrayBuffer(), IMPORTS);
  cache.set(game.id, mod.instance.exports);
  return mod.instance.exports;
}

async function select(id) {
  stop();
  const game = GAMES.find(g => g.id === id);
  if (!game) return;
  // Follow the game into its own kind, so picking one from a link or the
  // default does not leave the wrong tab lit.
  const switched = game.cat !== cat;
  cat = game.cat;
  for (const b of document.querySelectorAll('.pick')) b.classList.toggle('on', b.dataset.id === id);
  if (switched) pendingGallery = true;
  $('title').textContent = game.name;
  $('desc').textContent = game.desc;
  $('status').textContent = 'Loading the engine…';
  $('stage').innerHTML = '';
  // Each board wants its own framing, so the zoom does not carry over.
  zoom = 1; panX = 0; panY = 0;
  $('scene').style.backgroundImage =
    game.id === 'backgammon' ? 'none' : `url("art/scenes/${game.id}.jpg")`;
  try {
    cur = driver(game, await load(game));
  } catch (err) {
    cur = null;
    const served = location.protocol.startsWith('http');
    $('status').innerHTML = `<span class="fail">${esc(err.message)}</span>`;
    $('stage').innerHTML = served
      ? `<p class="desc">The module is build output, not tracked source: run
         <code>apps/games/build-wasm.ps1 -Game ${esc(game.id)}</code> to produce it.</p>`
      : `<p class="desc">This page has to be <b>served</b>, not opened from disk: a browser
         refuses to fetch wasm over <code>file://</code>. Run
         <code>apps/landing/serve.ps1</code> and open
         <code>http://localhost:8088/games/index.html</code>.</p>`;
    return;
  }
  if (pendingGallery) { pendingGallery = false; gallery(); }
  newGame();
}

function newGame() {
  if (!cur) return;
  stop();
  cur.reset();
  cur.beginTurn();
  draw();
}

function stop() { playing = false; clearTimeout(timer); }

function tick() {
  if (!playing || !cur) return;
  if (!cur.step()) { stop(); draw(); return; }
  draw();
  if (cur.done()) { stop(); return; }
  timer = setTimeout(tick, delay);
}

// --- controls ------------------------------------------------------------
function controls() {
  if (!cur) return '';
  const g = cur.game;
  let h = '<button id="b-new">&#x21BB; New game</button>';
  // Choices that change the deal, so they restart the game when picked.
  for (const o of (g.options || [])) {
    const cur_ = cur.opts[o.name] === undefined ? o.def : cur.opts[o.name];
    h += `<span class="seg" data-opt="${o.name}">`;
    o.values.forEach((v, i) => {
      h += `<button data-optval="${v}" class="${v === cur_ ? 'on' : ''}">` +
        `${esc(o.labels ? o.labels[i] : v)}</button>`;
    });
    h += '</span>';
  }
  if (cur.canUndo()) h += '<button id="b-undo">&#x21A9; Undo</button>';
  if (g.hint) h += '<button id="b-hint" class="act">&#x1F4A1; Hint</button>';
  if (cur.playable && !g.solo) {
    h += '<span class="seg">' +
      `<button id="m-play" class="${cur.mode === 'play' ? 'on' : ''}">You play</button>` +
      `<button id="m-watch" class="${cur.mode === 'watch' ? 'on' : ''}">Watch</button></span>`;
  }
  if (g.step && (cur.mode === 'watch' || !cur.playable)) {
    h += '<button id="b-play">' + (playing ? '&#x23F8; Pause' : '&#x25B6; Play') +
      '</button><button id="b-step">&#x23ED; Step</button>';
  }
  if (g.step) h += '<button id="b-run">&#x23E9; Run to the end</button>';
  if (!g.actionsInStage) {
    // An action the board draws for itself is not repeated up here.
    for (const a of cur.actions()) {
      if (a.inBoard) continue;
      h += `<button class="act" data-act="${a.index}"${a.enabled ? '' : ' disabled'}>${esc(a.label)}</button>`;
    }
  }
  h += '<label for="speed">Speed</label>' +
    `<input type="range" id="speed" min="1" max="10" value="${DELAYS.indexOf(delay) + 1}">`;
  return h;
}

function wire() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('b-new', newGame);
  on('b-undo', () => { stop(); cur.undo(); draw(); });
  on('b-hint', () => { cur.showHint(); draw(); });
  for (const seg of document.querySelectorAll('[data-opt]')) {
    for (const b of seg.querySelectorAll('[data-optval]')) {
      b.onclick = () => {
        cur.option(seg.dataset.opt, Number(b.dataset.optval));
        newGame();
      };
    }
  }
  on('m-play', () => { cur.mode = 'play'; newGame(); });
  on('m-watch', () => { cur.mode = 'watch'; newGame(); });
  on('b-step', () => { stop(); cur.step(); draw(); });
  on('b-play', () => {
    if (playing) { stop(); draw(); return; }
    playing = true; draw(); tick();
  });
  on('b-run', () => {
    stop();
    // Bounded: the module frees nothing, so a run-to-the-end is a budget,
    // not a spin.
    const cap = cur.game.steps || 400;
    for (let i = 0; i < cap && !cur.done(); i++) if (!cur.step()) break;
    draw();
    const s = cur.runs();
    if (s) $('status').innerHTML = esc(cur.status()) + ' &middot; whole game: ' + esc(s);
  });
  for (const b of document.querySelectorAll('[data-act]')) {
    b.onclick = () => { if (cur.act(Number(b.dataset.act))) afterHuman(); };
  }
  const sp = $('speed');
  if (sp) sp.oninput = () => { delay = DELAYS[sp.value - 1]; };
}

// The opponent answers by itself. This is the whole of "there is an AI to
// play against": without it your move is accepted and then nothing happens.
// The opponent answers a move at a time, drawn between each, so its choices
// are visible rather than only the position they add up to. Applying the
// whole reply at once and drawing once is what made the board jump.
function afterHuman() {
  draw();
  if (cur.done() || cur.game.solo) return;
  const pace = Math.min(500, delay + 180);
  const one = () => {
    if (!cur || cur.done() || cur.yourTurn()) { if (cur) { cur.beginTurn(); draw(); } return; }
    if (!cur.step()) { cur.beginTurn(); draw(); return; }
    draw();
    timer = setTimeout(one, pace);
  };
  timer = setTimeout(one, pace);
}

function draw() {
  if (!cur) return;
  const yours = cur.yourTurn() && cur.mode === 'play' && !cur.done();
  $('status').innerHTML = (yours ? '<span class="you">Your move</span> &middot; ' : '')
    + esc(cur.status());
  const clickable = !!(cur.game.move || cur.game.solo) && cur.yourTurn();
  let board = renderHtml(cur.view(), clickable);
  // Some games want their controls under the board rather than up in the
  // toolbar: Hit and Stand belong beneath your own cards.
  if (cur.game.actionsInStage) {
    board = '<div class="stagecol">' + board + '<div class="stageacts">' +
      cur.actions().map(a =>
        `<button data-act="${a.index}"${a.enabled ? '' : ' disabled'}>${esc(a.label)}</button>`
      ).join('') + '</div></div>';
  }
  // Two layers on purpose: the outer one is translated for panning, in real
  // pixels, and the inner one is ZOOMED. Keeping them apart is what lets
  // the pan maths stay in screen pixels while the zoom changes layout.
  $('stage').innerHTML = `<div id="panwrap"><div id="pan">${board}</div></div>`;
  applyZoom();
  markLanded();
  $('bar').innerHTML = controls();
  wire();
  $('note').innerHTML = note();
  $('rules').innerHTML = rules();
}

// What the last move put on the board, so it can arrive rather than just
// appear. A chip dropped into Connect Four falls the distance it really
// fell; anything else brightens once where it landed.
let priorCells = null, lastFrom = null;
function markLanded() {
  const v = cur.view();
  const now = (v && v.cells) ? v.cells.map(c => c.cls + '|' + c.text) : null;
  // How a piece arrives has to match how it moves. Falling is Connect
  // Four's mechanic and nobody else's -- applied to every grid it made
  // checkers drop out of the sky.
  const style = cur.game.land || 'pop';
  if (now && priorCells && priorCells.length === now.length) {
    const cells = $('stage').querySelectorAll('#pan .g');
    for (let i = 0; i < now.length; i++) {
      if (now[i] === priorCells[i] || !cells[i]) continue;
      if (style === 'drop') {
        cells[i].classList.add('landed');
        if (v.cols) cells[i].style.setProperty('--fall', String(Math.floor(i / v.cols) + 1));
      } else if (style === 'slide' && lastFrom !== null && cells[lastFrom]) {
        // Slide from the square it actually left, measured off the two
        // elements so it works at any zoom or board size.
        const a = cells[lastFrom].getBoundingClientRect();
        const b = cells[i].getBoundingClientRect();
        cells[i].style.setProperty('--dx', (a.left - b.left) + 'px');
        cells[i].style.setProperty('--dy', (a.top - b.top) + 'px');
        cells[i].classList.add('slid');
      } else {
        cells[i].classList.add('placed');
      }
    }
  }
  priorCells = now;
  lastFrom = null;
}

function rules() {
  const r = RULES[cur.game.id];
  if (!r) return '<summary>How to play</summary><p>No rules panel for this one yet.</p>';
  return `<summary>How to play ${esc(cur.game.name)}</summary>` + r.map(line =>
    '<p>' + esc(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</p>').join('');
}

// --- the piece in your hand ----------------------------------------------
// A click on a board is a physical act, so it should look like one before
// it happens: the pointer carries the piece and the board shows where it
// would come to rest.
let ghostAt = null;
function clearGhost() {
  $('hand').className = '';
  $('hand').innerHTML = '';
  if (ghostAt) { ghostAt.remove(); ghostAt = null; }
}

function hover(ev) {
  if (!cur || !cur.game.ghost || !cur.yourTurn() || cur.done()) return clearGhost();
  const t = ev.target.closest('[data-i]');
  if (!t) return clearGhost();
  const g = cur.game.ghost(cur.exports, cur.handle, Number(t.dataset.i));
  if (!g) return clearGhost();

  const hand = $('hand');
  hand.className = 'on';
  hand.style.left = ev.clientX + 'px';
  hand.style.top = ev.clientY + 'px';
  hand.innerHTML = `<div class="${g.carry || ''}">${g.carry === 'mark' ? esc(g.text || '') : ''}</div>`;

  const cells = $('stage').querySelectorAll('.g,[data-i]');
  let target = null;
  for (const c of cells) if (Number(c.dataset.i) === g.i) { target = c; break; }
  if (!target) { if (ghostAt) { ghostAt.remove(); ghostAt = null; } return; }
  if (ghostAt && ghostAt.parentElement === target) return;
  if (ghostAt) ghostAt.remove();
  const el = document.createElement('div');
  el.className = 'ghost ' + (g.cls || '');
  el.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center';
  el.textContent = g.text || '';
  target.appendChild(el);
  ghostAt = el;
}

function note() {
  const g = cur.game;
  let h = '<p><b>What is running.</b> <code>apps/games/classic/</code> holds the rules; ' +
    '<code>apps/games/build-wasm.ps1</code> compiles them to the compiler&#39;s inner ' +
    'language, hands that to <code>codex/plugs/wasm</code>, and the module your browser ' +
    'loaded is what came back.</p>';
  if (g.watchOnly) h += `<p><b>This one watches.</b> ${esc(g.watchOnly)}.</p>`;
  else if (cur.playable) {
    h += '<p><b>You are player one and you are on the go.</b> Your click goes through the ' +
      'module&#39;s own legality test and is refused if the rules refuse it, and then the ' +
      'engine answers on its own.</p>';
  }
  return h;
}

// Rendering lives in arcade.js so the grader runs the same code.

// --- zoom and pan --------------------------------------------------------
// Boards run from a three-square grid to a 144-tile Mahjong layout, so one
// fixed size suits none of them. Zooming past the panel makes the board
// bigger than its box, and then it has to be draggable or the parts that
// went outside are simply unreachable.
let zoom = 1, panX = 0, panY = 0;
const ZMIN = 0.5, ZMAX = 3;
const CAN_ZOOM = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('zoom', '2');

function applyZoom() {
  const pan = $('pan'), wrap = $('panwrap'), stage = $('stage');
  if (!pan || !wrap || !stage) return;

  // Lay the board out again at the new size. Everything after this measures
  // the RESULT rather than multiplying by the zoom, because under `zoom`
  // the two are not the same number and getBoundingClientRect is the one
  // that reports what is actually on the screen.
  //
  // Firefox only took `zoom` in 126, so where it is missing this falls back
  // to a scale transform: softer at high zoom, but a working board beats a
  // crisp one that does not resize.
  if (CAN_ZOOM) {
    pan.style.zoom = zoom === 1 ? '' : String(zoom);
  } else {
    pan.style.transform = zoom === 1 ? '' : `scale(${zoom})`;
  }

  const r = pan.getBoundingClientRect();
  if (zoom > 1.001) {
    const pad = 40;
    stage.classList.add('wide');
    stage.style.width = Math.min(r.width + pad, window.innerWidth - 28) + 'px';
    stage.style.height = Math.min(r.height + pad, window.innerHeight - 130) + 'px';
  } else {
    stage.classList.remove('wide');
    stage.style.width = '';
    stage.style.height = '';
  }

  clampPan();
  // The pan is on the OUTER layer, so it stays in screen pixels whatever
  // the zoom is doing to the layer inside it.
  wrap.style.transform = `translate(${panX}px,${panY}px)`;
  stage.classList.toggle('zoomed', overflowing());
}

// Whether the board is actually bigger than the panel now holding it. Until
// it is, there is nothing to pan and the grab cursor would be a lie.
// Measured, not computed: `zoom` changes layout, so offsetWidth times the
// zoom factor is not the size on screen.
function overflowing() {
  const pan = $('pan'), stage = $('stage');
  if (!pan || !stage) return false;
  const r = pan.getBoundingClientRect();
  return r.width > stage.clientWidth - 8 || r.height > stage.clientHeight - 8;
}

function setZoom(z) {
  zoom = Math.min(ZMAX, Math.max(ZMIN, z));
  if (zoom <= 1.001) { zoom = 1; panX = panY = 0; }
  applyZoom();
}

// Do not let the board be dragged off into nothing: panning is only ever
// worth as much as the board actually overflows its panel.
function clampPan() {
  const pan = $('pan'), stage = $('stage');
  if (!pan || !stage) return;
  const r = pan.getBoundingClientRect();
  const mx = Math.max(0, (r.width - stage.clientWidth) / 2 + 12);
  const my = Math.max(0, (r.height - stage.clientHeight) / 2 + 12);
  panX = Math.min(mx, Math.max(-mx, panX));
  panY = Math.min(my, Math.max(-my, panY));
}

// Ctrl and the wheel, so a plain wheel still scrolls the page.
$('stage').addEventListener('wheel', ev => {
  if (!cur || !ev.ctrlKey) return;
  ev.preventDefault();
  setZoom(zoom * (ev.deltaY < 0 ? 1.12 : 1 / 1.12));
}, { passive: false });

// --- picking a piece up, and moving the board ----------------------------
// One pointer, two jobs: carry a piece, or drag the board when it is zoomed
// past its panel. Which one it is gets decided at press time by what is
// under the pointer, so neither needs a modifier key.
//
// Dragging a piece and clicking twice are the SAME gesture here. A press
// that selects followed by a release elsewhere is a drag; a press that
// selects and a release in place leaves the piece selected, so the next
// press finishes it. Nobody has to be told which style the page wants.
let panning = false, lastX = 0, lastY = 0, carry = null;

function startPan(ev) {
  // Nothing to drag until the board is bigger than the panel holding it.
  if (!overflowing()) return;
  panning = true; lastX = ev.clientX; lastY = ev.clientY;
  $('stage').classList.add('dragging');
  $('stage').setPointerCapture(ev.pointerId);
}

function showCarry(el, ev) {
  const hand = $('hand');
  hand.className = 'on carry';
  hand.style.left = ev.clientX + 'px';
  hand.style.top = ev.clientY + 'px';
  // Carry the PIECE, not the square it was standing on. A checkers square
  // carries its own look, but a backgammon point is a triangle holding
  // checkers and a spider column is a stack of cards, so where the square
  // contains a piece it is that piece which gets picked up.
  const piece = el.querySelector('.chk, .urp, .card:last-child');
  const look = (piece || el).className
    .replace(/\b(picked|hint|landed|slid|dn|alt|pt)\b/g, '').trim();
  hand.innerHTML = '<div class="' + look + '" style="position:absolute;inset:0"></div>';
}

$('stage').addEventListener('pointerdown', ev => {
  if (!cur || cur.done() || !cur.game.move || !cur.yourTurn()) return startPan(ev);
  const t = ev.target.closest('[data-i]');
  if (!t) return startPan(ev);
  const from = Number(t.dataset.i);
  const r = cur.move(from);
  if (r === 'moved') { clearGhost(); stop(); lastFrom = null; afterHuman(); return; }
  if (r !== 'select' || cur.sel === null || cur.sel === undefined) return startPan(ev);
  carry = { from: from };
  lastX = ev.clientX; lastY = ev.clientY;
  showCarry(t, ev);
  draw();
  $('stage').setPointerCapture(ev.pointerId);
});

$('stage').addEventListener('pointermove', ev => {
  if (carry) {
    $('hand').style.left = ev.clientX + 'px';
    $('hand').style.top = ev.clientY + 'px';
    return;
  }
  if (panning) {
    panX += ev.clientX - lastX; panY += ev.clientY - lastY;
    lastX = ev.clientX; lastY = ev.clientY;
    applyZoom();
    return;
  }
  hover(ev);
});

function endPointer(ev) {
  try { $('stage').releasePointerCapture(ev.pointerId); } catch (e) { /* already released */ }
  if (panning) { panning = false; $('stage').classList.remove('dragging'); return; }
  if (!carry) return;
  const held = carry;
  carry = null;
  clearGhost();
  // Where it was let go. The hand takes no pointer events, so this finds
  // the square underneath it rather than the hand itself.
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const t = under && under.closest ? under.closest('[data-i]') : null;
  const to = t ? Number(t.dataset.i) : null;
  if (to === null || to === held.from) { draw(); return; }
  lastFrom = held.from;
  const r = cur.move(to);
  if (r === 'moved') { stop(); afterHuman(); }
  else { lastFrom = null; draw(); }
}

$('stage').addEventListener('pointerup', endPointer);
$('stage').addEventListener('pointercancel', function () {
  panning = false; carry = null;
  $('stage').classList.remove('dragging');
  clearGhost(); draw();
});
$('stage').addEventListener('mouseleave', clearGhost);
window.addEventListener('resize', applyZoom);

document.addEventListener('keydown', ev => {
  if (!cur) return;
  // U and H everywhere they mean anything, because a solitaire played with
  // the mouse still wants its two most-used buttons under a finger.
  if (ev.code === 'KeyU' && cur.canUndo()) {
    stop(); cur.undo(); draw(); ev.preventDefault(); return;
  }
  if (ev.code === 'KeyH' && cur.game.hint) {
    cur.showHint(); draw(); ev.preventDefault(); return;
  }
  if (!cur.game.keys) return;
  if (cur.key(ev.code)) { stop(); draw(); ev.preventDefault(); }
});

// gallery() wires its own buttons every time it redraws, so there is no
// second place doing it.
select('othello');
</script>
</body>
</html>
