<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodexMagic - Collection</title>
  <link rel="stylesheet" href="/magic.css">
  <style>
    .page.collection-layout { display: flex; gap: 16px; padding: 16px 24px; height: calc(100vh - 50px); max-width: none; }
    .collection-panel { flex: 2; overflow-y: auto; }
    .deck-panel { flex: 1; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-y: auto; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .filter-bar select, .filter-bar input { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .card-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .deck-list { list-style: none; }
    .deck-list li { padding: 4px 0; font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); cursor: pointer; }
    .deck-list li:hover { color: var(--red); }
    .deck-stats { margin-top: 12px; font-size: 12px; color: var(--text-dim); }
    .deck-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .deck-header h3 { font-size: 14px; }
    .valid { color: var(--green); }
    .invalid { color: var(--red); }
    .mana-curve { display: flex; gap: 2px; align-items: flex-end; height: 60px; margin-top: 8px; }
    .curve-bar { background: var(--blue); min-width: 20px; border-radius: 2px 2px 0 0; text-align: center; font-size: 9px; color: var(--text-dim); }
    .curve-label { font-size: 9px; text-align: center; color: var(--text-dim); margin-top: 2px; }
    .collection-stats { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  </style>
</head>
<body>
<div id="cx-header"></div>

<div class="page collection-layout">
  <div class="collection-panel">
    <div class="filter-bar">
      <select id="filter-color" onchange="filterCards()">
        <option value="">All Colors</option>
        <option value="W">White</option><option value="U">Blue</option>
        <option value="B">Black</option><option value="R">Red</option>
        <option value="G">Green</option><option value="C">Colorless</option>
      </select>
      <select id="filter-type" onchange="filterCards()">
        <option value="">All Types</option>
        <option value="Creature">Creature</option><option value="Instant">Instant</option>
        <option value="Sorcery">Sorcery</option><option value="Enchantment">Enchantment</option>
        <option value="Artifact">Artifact</option><option value="Land">Land</option>
      </select>
      <select id="filter-rarity" onchange="filterCards()">
        <option value="">All Rarities</option>
        <option value="Common">Common</option><option value="Uncommon">Uncommon</option>
        <option value="Rare">Rare</option><option value="Mythic">Mythic</option>
      </select>
      <select id="filter-owned" onchange="filterCards()">
        <option value="">All Cards</option>
        <option value="owned">Owned Only</option>
        <option value="missing">Missing</option>
      </select>
      <input type="text" id="search" placeholder="Search..." oninput="filterCards()">
    </div>
    <div class="collection-stats" id="collection-stats">Loading pool...</div>
    <div class="card-grid" id="card-grid"></div>
  </div>

  <div class="deck-panel">
    <div class="deck-header">
      <h3>Deck Builder</h3>
      <span id="deck-valid" class="valid"></span>
    </div>
    <div style="margin-bottom: 8px;">
      <label style="font-size:12px; color:var(--text-dim);">General:</label>
      <select id="general-select" onchange="onGeneralChange()" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); padding:4px; border-radius:4px; font-size:12px;">
      </select>
    </div>
    <div id="deck-count" style="font-size:13px; margin-bottom:8px;">0 cards</div>
    <ul class="deck-list" id="deck-list"></ul>
    <div class="mana-curve" id="mana-curve"></div>
    <div style="margin-top:12px; display:flex; gap:8px;">
      <button class="btn" onclick="autofillDeck()" style="flex:1;">Auto-fill</button>
      <button class="btn" onclick="clearDeck()" style="flex:1;">Clear</button>
      <button class="btn" onclick="validateDeck()" style="flex:1;">Validate</button>
    </div>
  </div>
</div>

<script src="/card-render.js"></script>
<script src="/magic.js"></script>
<script>
var pool = [];
var deck = [];
var generals = [];
var ownedCounts = {};

async function init() {
  await ensureAccount();
  var data = await authCall('/pool');
  if (data && data.cards) {
    pool = data.cards;
  }
  await loadOwned();
  renderPool(getFilteredPool());
  var gdata = await apiCall('/store/generals');
  if (gdata && gdata.generals) {
    generals = gdata.generals;
    var sel = document.getElementById('general-select');
    sel.innerHTML = '';
    for (var g of generals) {
      var opt = document.createElement('option');
      opt.value = g.id;
      opt.textContent = g.name + ' (' + g.power + '/' + g.toughness + '/' + g.defense + ')';
      sel.appendChild(opt);
    }
  }
}

async function loadOwned() {
  ownedCounts = {};
  var data = await authCall('/collection?t=' + encodeURIComponent(authToken));
  if (data && data.cards) {
    var total = data.total || 0;
    for (var c of data.cards) {
      ownedCounts[c.cardId] = c.count;
    }
    var uniqueOwned = Object.keys(ownedCounts).length;
    document.getElementById('collection-stats').textContent = total + ' cards owned (' + uniqueOwned + ' unique) | ' + pool.length + ' in pool';
  } else {
    document.getElementById('collection-stats').textContent = '0 cards owned | ' + pool.length + ' in pool';
  }
}

function getFilteredPool() {
  var type = document.getElementById('filter-type').value;
  var rarity = document.getElementById('filter-rarity').value;
  var search = document.getElementById('search').value.toLowerCase();
  var color = document.getElementById('filter-color').value;
  var owned = document.getElementById('filter-owned').value;
  return pool.filter(function(c) {
    if (type && c.type !== type) return false;
    if (rarity && c.rarity !== rarity) return false;
    if (search && c.name.toLowerCase().indexOf(search) === -1) return false;
    if (owned === 'owned' && !ownedCounts[c.id]) return false;
    if (owned === 'missing' && ownedCounts[c.id]) return false;
    if (color) {
      if (!c.color) return color === 'C';
      if (color === 'W' && !c.color.white) return false;
      if (color === 'U' && !c.color.blue) return false;
      if (color === 'B' && !c.color.black) return false;
      if (color === 'R' && !c.color.red) return false;
      if (color === 'G' && !c.color.green) return false;
      if (color === 'C') {
        if (c.color.white || c.color.blue || c.color.black || c.color.red || c.color.green) return false;
      }
    }
    return true;
  });
}

function filterCards() {
  renderPool(getFilteredPool());
}

function renderPool(cards) {
  var grid = document.getElementById('card-grid');
  grid.innerHTML = '';
  for (var c of cards) {
    var el = renderCard(c, { size: 'normal', onClick: addToDeck });
    el.addEventListener('contextmenu', (function(card) { return function(e) { e.preventDefault(); showCardDetail(card); }; })(c));
    var count = ownedCounts[c.id] || 0;
    if (count > 0) {
      var badge = document.createElement('div');
      badge.style.cssText = 'position:absolute;top:2px;left:2px;background:#3fb950;color:#000;font-size:10px;font-weight:bold;padding:1px 5px;border-radius:8px;z-index:1';
      badge.textContent = 'x' + count;
      el.style.position = 'relative';
      el.appendChild(badge);
    } else {
      el.style.opacity = '0.45';
    }
    grid.appendChild(el);
  }
  if (cards.length === 0) {
    grid.innerHTML = '<div style="color:var(--text-dim); padding:24px;">No cards match filters</div>';
  }
}

function addToDeck(card) {
  var id = card.id !== undefined ? card.id : 0;
  deck.push(id);
  renderDeck();
}

function removeFromDeck(idx) {
  deck.splice(idx, 1);
  renderDeck();
}

function clearDeck() { deck = []; renderDeck(); }

async function autofillDeck() {
  var gen = document.getElementById('general-select').value;
  var data = await apiCall('/deck/generate?general=' + gen + '&seed=' + Date.now());
  if (data && data.cards) {
    deck = data.cards;
    renderDeck();
  }
}

async function validateDeck() {
  var gen = document.getElementById('general-select').value;
  var data = await apiCall('/deck/validate?general=' + gen + '&cards=' + deck.join(','));
  var el = document.getElementById('deck-valid');
  if (data && data.valid) {
    el.textContent = 'VALID';
    el.className = 'valid';
  } else {
    el.textContent = data ? data.reason : 'INVALID';
    el.className = 'invalid';
  }
}

function onGeneralChange() {
  document.getElementById('deck-valid').textContent = '';
}

function renderDeck() {
  var list = document.getElementById('deck-list');
  var counts = {};
  var order = [];
  for (var id of deck) {
    if (!counts[id]) { counts[id] = 0; order.push(id); }
    counts[id]++;
  }
  list.innerHTML = '';
  for (var i = 0; i < order.length; i++) {
    var id = order[i];
    var card = pool.find(function(c) { return c.id === parseInt(id); });
    var li = document.createElement('li');
    li.innerHTML = '<span>' + (card ? card.name : 'Card #' + id) + '</span><span class="count">x' + counts[id] + '</span>';
    li.onclick = (function(cardId) { return function() { var idx = deck.indexOf(cardId); if (idx >= 0) removeFromDeck(idx); }; })(parseInt(id));
    list.appendChild(li);
  }
  document.getElementById('deck-count').textContent = deck.length + ' cards';
  renderManaCurve();
  document.getElementById('deck-valid').textContent = '';
}

function renderManaCurve() {
  var curve = document.getElementById('mana-curve');
  var buckets = [0,0,0,0,0,0,0,0];
  for (var id of deck) {
    var card = pool.find(function(c) { return c.id === parseInt(id); });
    if (card && card.cost) {
      var cmc = (card.cost.white||0)+(card.cost.blue||0)+(card.cost.black||0)+(card.cost.red||0)+(card.cost.green||0)+(card.cost.generic||0);
      var bucket = cmc > 7 ? 7 : cmc;
      buckets[bucket]++;
    }
  }
  var max = Math.max.apply(null, buckets) || 1;
  curve.innerHTML = '';
  for (var i = 0; i < 8; i++) {
    var h = buckets[i] / max * 50;
    var div = document.createElement('div');
    div.style.display = 'flex';
    div.style.flexDirection = 'column';
    div.style.alignItems = 'center';
    div.innerHTML = '<div class="curve-bar" style="height:' + Math.max(h, 2) + 'px">' + (buckets[i] || '') + '</div><div class="curve-label">' + (i < 7 ? i : '7+') + '</div>';
    curve.appendChild(div);
  }
}

init();
</script>
</body>
</html>
