<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodexMagic - Marketplace</title>
  <link rel="stylesheet" href="/magic.css">
  <style>
    .page { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .tab-bar { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tab-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 8px 16px; border-radius: 4px 4px 0 0; cursor: pointer; font-size: 13px; }
    .tab-btn:hover { color: var(--text); background: var(--bg-surface); }
    .tab-btn.active { background: var(--bg-surface); color: var(--gold); border-bottom-color: var(--bg-surface); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: var(--text); }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-bar select, .filter-bar input { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; font-size: 13px; }
    .btn { background: var(--border); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #3d444d; }
    .btn-primary { background: var(--blue); color: #000; border-color: var(--blue); }
    .btn-gold { background: var(--gold); color: #000; border-color: var(--gold); }
    .btn-green { background: var(--green); color: #000; border-color: var(--green); }
    .btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
    .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .listing-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
    .listing-card:hover { border-color: var(--gold); transform: translateY(-2px); }
    .listing-card.auction { border-left: 3px solid var(--blue); }
    .listing-card.sale { border-left: 3px solid var(--green); }
    .listing-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .listing-name { font-weight: bold; font-size: 14px; }
    .listing-type-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .listing-type-badge.sale { background: var(--green); color: #000; }
    .listing-type-badge.auction { background: var(--blue); color: #000; }
    .listing-body { padding: 0 16px 12px; }
    .listing-card-info { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .listing-price { font-size: 20px; font-weight: bold; color: var(--gold); margin-bottom: 4px; }
    .listing-seller { font-size: 12px; color: var(--text-dim); }
    .listing-timer { font-size: 12px; color: var(--orange); margin-top: 4px; }
    .listing-bids { font-size: 12px; color: var(--blue); margin-top: 2px; }
    .listing-actions { padding: 8px 16px 12px; display: flex; gap: 8px; }
    .bid-input { width: 80px; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 13px; }
    .create-form { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
    .form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
    .form-row label { font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; }
    .form-row input, .form-row select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; font-size: 13px; min-width: 120px; }
    .msg { padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; display: none; }
    .msg-ok { background: #1a3a1a; border: 1px solid var(--green); color: var(--green); }
    .msg-err { background: #3a1a1a; border: 1px solid var(--red); color: var(--red); }
    .my-listing-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .my-listing-info { flex: 1; }
    .my-listing-info .name { font-weight: bold; font-size: 14px; }
    .my-listing-info .detail { font-size: 12px; color: var(--text-dim); }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-align: center; }
    .stat-value { font-size: 24px; font-weight: bold; color: var(--gold); }
    .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .empty-state { text-align: center; padding: 48px; color: var(--text-dim); }
    .balance-bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 16px; padding: 8px 16px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; }
    .balance { font-size: 18px; color: var(--gold); font-weight: bold; }
  </style>
</head>
<body>
<div id="cx-header"></div>

<div class="page">
  <div class="balance-bar">
    <span class="balance" id="my-balance">0 MC</span>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="showTab('browse')">Browse</button>
    <button class="tab-btn" onclick="showTab('sell')">Sell / Auction</button>
    <button class="tab-btn" onclick="showTab('my')">My Listings</button>
    <button class="tab-btn" onclick="showTab('history')">History</button>
  </div>

  <!-- Browse Tab -->
  <div id="tab-browse" class="tab-panel active">
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value" id="mkt-total">0</div><div class="stat-label">Active Listings</div></div>
      <div class="stat-card"><div class="stat-value" id="mkt-sales">0</div><div class="stat-label">For Sale</div></div>
      <div class="stat-card"><div class="stat-value" id="mkt-auctions">0</div><div class="stat-label">Auctions</div></div>
      <div class="stat-card"><div class="stat-value" id="mkt-volume">0</div><div class="stat-label">Total Volume (MC)</div></div>
    </div>

    <div class="filter-bar">
      <select id="mkt-filter-type" onchange="loadListings()">
        <option value="">All Types</option>
        <option value="sale">For Sale</option>
        <option value="auction">Auctions</option>
      </select>
      <select id="mkt-filter-card-type" onchange="loadListings()">
        <option value="">All Card Types</option>
        <option value="Creature">Creature</option>
        <option value="Instant">Instant</option>
        <option value="Sorcery">Sorcery</option>
        <option value="Enchantment">Enchantment</option>
        <option value="Artifact">Artifact</option>
        <option value="Land">Land</option>
      </select>
      <select id="mkt-filter-rarity" onchange="loadListings()">
        <option value="">All Rarities</option>
        <option value="Common">Common</option>
        <option value="Uncommon">Uncommon</option>
        <option value="Rare">Rare</option>
        <option value="Mythic">Mythic</option>
      </select>
      <select id="mkt-sort" onchange="loadListings()">
        <option value="newest">Newest</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price: High to Low</option>
        <option value="ending">Ending Soon</option>
      </select>
      <input id="mkt-search" placeholder="Search cards..." oninput="loadListings()">
    </div>

    <div class="listing-grid" id="listings-grid"></div>
    <div id="no-listings" class="empty-state" style="display:none">No listings match your filters.</div>
  </div>

  <!-- Sell / Auction Tab -->
  <div id="tab-sell" class="tab-panel">
    <div class="create-form">
      <div class="section-title">Create Listing</div>
      <div id="sell-msg" class="msg"></div>
      <div class="form-row">
        <label>Listing Type
          <select id="sell-type" onchange="onSellTypeChange()">
            <option value="sale">Fixed Price Sale</option>
            <option value="auction">Auction</option>
          </select>
        </label>
        <label>Card
          <select id="sell-card"></select>
        </label>
      </div>
      <div class="form-row">
        <label id="lbl-price">Price (MC)
          <input id="sell-price" type="number" value="100" min="1">
        </label>
        <label id="lbl-min-bid" style="display:none">Starting Bid (MC)
          <input id="sell-min-bid" type="number" value="50" min="1">
        </label>
        <label id="lbl-buyout" style="display:none">Buyout Price (MC, 0=none)
          <input id="sell-buyout" type="number" value="0" min="0">
        </label>
        <label id="lbl-duration" style="display:none">Duration
          <select id="sell-duration">
            <option value="1">1 hour</option>
            <option value="6">6 hours</option>
            <option value="12">12 hours</option>
            <option value="24" selected>24 hours</option>
            <option value="48">48 hours</option>
            <option value="72">72 hours</option>
          </select>
        </label>
      </div>
      <button class="btn btn-gold" onclick="createListing()">List on Marketplace</button>
    </div>

    <div class="section-title">Your Collection</div>
    <div class="filter-bar">
      <input id="sell-search" placeholder="Search your cards..." oninput="filterMyCards()">
    </div>
    <div class="listing-grid" id="my-cards-grid"></div>
  </div>

  <!-- My Listings Tab -->
  <div id="tab-my" class="tab-panel">
    <div class="section-title">Your Active Listings</div>
    <div id="my-listings-list"></div>
    <div id="no-my-listings" class="empty-state" style="display:none">You have no active listings.</div>
  </div>

  <!-- History Tab -->
  <div id="tab-history" class="tab-panel">
    <div class="section-title">Transaction History</div>
    <div id="history-list"></div>
    <div id="no-history" class="empty-state" style="display:none">No transactions yet.</div>
  </div>
</div>

<script src="/card-render.js"></script>
<script src="/magic.js"></script>
<script>
var pool = [];
var myCards = [];
var allListings = [];

async function init() {
  await ensureAccount();
  await refreshBalance();
  updateBalance();
  var data = await authCall('/pool');
  if (data && data.cards) pool = data.cards;
  await loadMyCards();
  await loadListings();
}

function updateBalance() {
  var bal = currentAccount ? (currentAccount.balance || 0) : 0;
  document.getElementById('my-balance').textContent = bal + ' MC';
}

function showTab(id) {
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('tab-' + id).classList.add('active');
  event.target.classList.add('active');
  if (id === 'browse') loadListings();
  if (id === 'sell') loadMyCards();
  if (id === 'my') loadMyListings();
  if (id === 'history') loadHistory();
}

function showMsg(id, text, ok) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 4000);
}

function onSellTypeChange() {
  var isAuction = document.getElementById('sell-type').value === 'auction';
  document.getElementById('lbl-price').style.display = isAuction ? 'none' : '';
  document.getElementById('lbl-min-bid').style.display = isAuction ? '' : 'none';
  document.getElementById('lbl-buyout').style.display = isAuction ? '' : 'none';
  document.getElementById('lbl-duration').style.display = isAuction ? '' : 'none';
}

async function marketCall(path) {
  try {
    var url = '/api/market' + path;
    if (authToken) url += (url.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(authToken);
    var r = await fetch(url);
    return r.json();
  } catch (e) { console.error('Market error:', path, e); return null; }
}

// -- Browse --
async function loadListings() {
  var type = document.getElementById('mkt-filter-type').value;
  var cardType = document.getElementById('mkt-filter-card-type').value;
  var rarity = document.getElementById('mkt-filter-rarity').value;
  var sort = document.getElementById('mkt-sort').value;
  var search = document.getElementById('mkt-search').value;
  var qs = '?type=' + type + '&cardType=' + encodeURIComponent(cardType)
    + '&rarity=' + encodeURIComponent(rarity) + '&sort=' + sort
    + '&search=' + encodeURIComponent(search);
  var r = await marketCall('/listings' + qs);
  allListings = (r && r.listings) || [];
  document.getElementById('mkt-total').textContent = r ? (r.totalActive || 0) : 0;
  document.getElementById('mkt-sales').textContent = r ? (r.totalSales || 0) : 0;
  document.getElementById('mkt-auctions').textContent = r ? (r.totalAuctions || 0) : 0;
  document.getElementById('mkt-volume').textContent = r ? (r.totalVolume || 0) : 0;
  renderListings(allListings);
}

function renderListings(listings) {
  var grid = document.getElementById('listings-grid');
  var empty = document.getElementById('no-listings');
  if (listings.length === 0) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = listings.map(function(l) {
    var isMine = currentAccount && l.seller === currentAccount.handle;
    var isAuction = l.type === 'auction';
    var priceLabel = isAuction
      ? (l.currentBid > 0 ? 'Current bid: ' + l.currentBid + ' MC' : 'Starting: ' + l.minBid + ' MC')
      : l.price + ' MC';
    var actions = '';
    if (isMine) {
      actions = '<button class="btn btn-danger" onclick="cancelListing(' + l.id + ')" style="padding:4px 10px;font-size:12px">Cancel</button>';
    } else if (isAuction) {
      var minNext = (l.currentBid || l.minBid) + 1;
      actions = '<input class="bid-input" id="bid-' + l.id + '" type="number" value="' + minNext + '" min="' + minNext + '">'
        + ' <button class="btn btn-primary" onclick="placeBid(' + l.id + ')" style="padding:4px 10px;font-size:12px">Bid</button>';
      if (l.buyout > 0) {
        actions += ' <button class="btn btn-gold" onclick="buyoutAuction(' + l.id + ')" style="padding:4px 10px;font-size:12px">Buyout ' + l.buyout + ' MC</button>';
      }
    } else {
      actions = '<button class="btn btn-green" onclick="buyListing(' + l.id + ')" style="padding:4px 10px;font-size:12px">Buy Now</button>';
    }
    return '<div class="listing-card ' + l.type + '">'
      + '<div class="listing-header"><span class="listing-name">' + l.cardName + '</span>'
      + '<span class="listing-type-badge ' + l.type + '">' + (isAuction ? 'Auction' : 'Sale') + '</span></div>'
      + '<div class="listing-body">'
      + '<div class="listing-card-info">' + (l.cardType || '') + ' &middot; ' + (l.rarity || 'Common') + '</div>'
      + '<div class="listing-price">' + priceLabel + '</div>'
      + '<div class="listing-seller">Seller: ' + l.seller + '</div>'
      + (isAuction ? '<div class="listing-timer">' + (l.timeLeft || '--') + ' remaining</div>' : '')
      + (isAuction && l.bidCount > 0 ? '<div class="listing-bids">' + l.bidCount + ' bid' + (l.bidCount > 1 ? 's' : '') + '</div>' : '')
      + '</div>'
      + '<div class="listing-actions">' + actions + '</div></div>';
  }).join('');
}

async function buyListing(id) {
  var r = await marketCall('/buy?id=' + id);
  if (r && r.ok) {
    await refreshBalance(); updateBalance();
    loadListings();
  } else { alert((r && r.error) || 'Purchase failed'); }
}

async function placeBid(id) {
  var input = document.getElementById('bid-' + id);
  var amount = parseInt(input.value);
  var r = await marketCall('/bid?id=' + id + '&amount=' + amount);
  if (r && r.ok) {
    await refreshBalance(); updateBalance();
    loadListings();
  } else { alert((r && r.error) || 'Bid failed'); }
}

async function buyoutAuction(id) {
  var r = await marketCall('/buyout?id=' + id);
  if (r && r.ok) {
    await refreshBalance(); updateBalance();
    loadListings();
  } else { alert((r && r.error) || 'Buyout failed'); }
}

async function cancelListing(id) {
  var r = await marketCall('/cancel?id=' + id);
  if (r && r.ok) { loadListings(); loadMyListings(); }
  else { alert((r && r.error) || 'Cancel failed'); }
}

// -- Sell --
async function loadMyCards() {
  var data = await marketCall('/my-cards');
  myCards = (data && data.cards) || [];
  populateCardSelect();
  renderMyCards(myCards);
}

function populateCardSelect() {
  var sel = document.getElementById('sell-card');
  sel.innerHTML = '';
  for (var i = 0; i < myCards.length; i++) {
    var c = myCards[i];
    var opt = document.createElement('option');
    opt.value = c.tokenId;
    opt.textContent = (c.name || 'Card #' + c.cardId) + ' (' + (c.rarity || 'Common') + ')';
    sel.appendChild(opt);
  }
  if (myCards.length === 0) {
    var opt = document.createElement('option');
    opt.textContent = 'No cards — buy packs in the Store!';
    opt.disabled = true;
    sel.appendChild(opt);
  }
}

function filterMyCards() {
  var q = document.getElementById('sell-search').value.toLowerCase();
  var filtered = myCards.filter(function(c) {
    return (c.name || '').toLowerCase().indexOf(q) >= 0;
  });
  renderMyCards(filtered);
}

function renderMyCards(cards) {
  var grid = document.getElementById('my-cards-grid');
  if (cards.length === 0) { grid.innerHTML = '<div class="empty-state">No cards to list. Buy packs in the store!</div>'; return; }
  grid.innerHTML = cards.map(function(c) {
    return '<div class="listing-card sale" style="cursor:pointer" onclick="quickList(' + c.tokenId + ')">'
      + '<div class="listing-header"><span class="listing-name">' + (c.name || 'Card #' + c.cardId) + '</span></div>'
      + '<div class="listing-body">'
      + '<div class="listing-card-info">' + (c.type || '') + ' &middot; ' + (c.rarity || 'Common') + '</div>'
      + '<div style="font-size:12px;color:var(--green)">Click to list</div></div></div>';
  }).join('');
}

function quickList(tokenId) {
  var sel = document.getElementById('sell-card');
  for (var i = 0; i < sel.options.length; i++) {
    if (parseInt(sel.options[i].value) === tokenId) { sel.selectedIndex = i; break; }
  }
  showTab('sell');
  document.querySelectorAll('.tab-btn')[1].classList.add('active');
}

async function createListing() {
  var type = document.getElementById('sell-type').value;
  var cardSel = document.getElementById('sell-card');
  if (!cardSel.value) { showMsg('sell-msg', 'Select a card', false); return; }
  var tokenId = cardSel.value;
  var qs = '?type=' + type + '&tokenId=' + tokenId;
  if (type === 'sale') {
    var price = parseInt(document.getElementById('sell-price').value);
    if (!price || price < 1) { showMsg('sell-msg', 'Price must be positive', false); return; }
    qs += '&price=' + price;
  } else {
    var minBid = parseInt(document.getElementById('sell-min-bid').value);
    var buyout = parseInt(document.getElementById('sell-buyout').value) || 0;
    var duration = parseInt(document.getElementById('sell-duration').value);
    if (!minBid || minBid < 1) { showMsg('sell-msg', 'Starting bid must be positive', false); return; }
    qs += '&minBid=' + minBid + '&buyout=' + buyout + '&duration=' + duration;
  }
  var r = await marketCall('/create' + qs);
  if (r && r.ok) {
    showMsg('sell-msg', 'Listed! Listing ID: ' + r.id, true);
    loadMyCards();
    loadListings();
  } else {
    showMsg('sell-msg', (r && r.error) || 'Failed to create listing', false);
  }
}

// -- My Listings --
async function loadMyListings() {
  var r = await marketCall('/my-listings');
  var list = document.getElementById('my-listings-list');
  var empty = document.getElementById('no-my-listings');
  var listings = (r && r.listings) || [];
  if (listings.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  list.innerHTML = listings.map(function(l) {
    var isAuction = l.type === 'auction';
    var priceInfo = isAuction
      ? 'Current bid: ' + (l.currentBid || l.minBid) + ' MC' + (l.bidCount > 0 ? ' (' + l.bidCount + ' bids)' : '')
      : 'Price: ' + l.price + ' MC';
    return '<div class="my-listing-row">'
      + '<div class="my-listing-info"><div class="name">' + l.cardName + '</div>'
      + '<div class="detail">' + (isAuction ? 'Auction' : 'Sale') + ' &middot; ' + priceInfo
      + (isAuction ? ' &middot; ' + (l.timeLeft || '--') + ' left' : '') + '</div></div>'
      + '<button class="btn btn-danger" onclick="cancelListing(' + l.id + ')" style="padding:4px 10px;font-size:12px">Cancel</button></div>';
  }).join('');
}

// -- History --
async function loadHistory() {
  var r = await marketCall('/history');
  var list = document.getElementById('history-list');
  var empty = document.getElementById('no-history');
  var txs = (r && r.transactions) || [];
  if (txs.length === 0) { list.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  list.innerHTML = txs.map(function(tx) {
    var icon = tx.type === 'sold' ? '&#x2191;' : '&#x2193;';
    var color = tx.type === 'sold' ? 'var(--green)' : 'var(--blue)';
    return '<div class="my-listing-row">'
      + '<div class="my-listing-info"><div class="name" style="color:' + color + '">'
      + '<span>' + icon + '</span> ' + tx.cardName + '</div>'
      + '<div class="detail">' + tx.type + ' &middot; ' + tx.price + ' MC &middot; '
      + (tx.type === 'sold' ? 'to ' + tx.buyer : 'from ' + tx.seller)
      + ' &middot; ' + tx.time + '</div></div></div>';
  }).join('');
}

init();
</script>
</body>
</html>
