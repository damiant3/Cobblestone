<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
</head>
<body>
<nav class="topbar">
  <span class="topbar-logo">&#x2588; COBBLESTONE</span>
  <button class="tab-btn active" data-tab="status" onclick="switchTab('status')">Status</button>
  <button class="tab-btn" data-tab="games" onclick="switchTab('games')">Games</button>
</nav>

<div class="content">
  <div id="tab-status" class="tab-panel active">
    {{STATUS}}
  </div>
  <div id="tab-games" class="tab-panel">
    {{GAMES}}
    <audio id="ambient-music" src="/assets/games/music/ambient-menu.wav" loop preload="none"></audio>
  </div>
</div>

<div class="footer">
  Auto-refreshes status every 30s &middot; <a href="/">reload</a>
</div>

<script src="/web/app.js?v={{VERSION}}"></script>
</body>
</html>
