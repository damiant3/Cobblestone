# The shard's own premises, read after every reference source. Placements use the ServUO
# Data/Decoration CFG syntax (a definition line, then x y z lines). Strip x1 y1 x2 y2 zmin zmax
# takes every client static in the area between those heights, walls (0x10) and roofs (0x10000000)
# kept, out of the player's statics (transform-flora.ps1, FLR1 kind 3) and out of the server's
# collision (install-map-cache.ps1). Clear x1 y1 x2 y2 drops the server's scenery and lights in
# the area (import-decoration.ps1); doors and signs stay.

