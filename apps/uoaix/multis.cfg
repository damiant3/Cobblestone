# Buildable multis: pieces cut from the main map and the designs they make (docs/Designs/Active/Apps/UoaixMultis.md).
# build-multis.ps1 writes them into the players' MULTI.IDX and MULTI.MUL. A design keeps its id for life. A piece's
# `door x y z` is a map door that becomes a deed house's front door (one, or a double door), locked by its key.

# The Shrine of Justice; its floor is land 0x43A..0x43D, drawn as stone pavers.
Piece shrine-justice 1296 628 1305 637
  land 0x043A 0x043D 0x0519

# Castle British's keep and its south court (the barracks, roofed at z 52).
Piece castle-british 1319 1585 1360 1682
  land 0x03E9 0x03EC 0x0515
  land 0x0486 0x0489 0x0511
  door 1359 1624 50
  door 1359 1625 50

# The keep's throne room alone, smaller than the largest multi the 1.25 client draws (id 126, 3461 components).
Piece castle-british-hall 1319 1617 1360 1633
  land 0x03E9 0x03EC 0x0515
  land 0x0486 0x0489 0x0511
  door 1359 1624 50
  door 1359 1625 50

Design 0x0200 shrine-justice
  shrine-justice 0 0 0

Design 0x0201 castle-british
  castle-british 0 0 0

Design 0x0202 castle-british-hall
  castle-british-hall 0 0 0

# The castle with the Shrine of Justice on the barracks roof of its south court.
Design 0x0203 castle-shrine
  castle-british 0 0 0
  clear -3 38 6 47 2 127
  shrine-justice 1 42 2
