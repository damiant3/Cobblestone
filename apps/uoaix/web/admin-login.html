<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UOAIX | Shard administration</title>
<style>
:root{font-family:system-ui,sans-serif;color:#23312c;background:#f3f1e8;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{background:#153c32;color:#fff;padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header b{font:28px Georgia,serif;letter-spacing:2px}header span{font-size:12px;letter-spacing:1.5px;color:#d3d5bb}main{max-width:1180px;margin:36px auto;padding:0 24px}h1,h2,h3{font-family:Georgia,serif;font-weight:400;margin-top:0}h1{font-size:36px;margin-bottom:8px}h2{font-size:25px}h3{font-size:19px}p{margin-top:0}.muted{color:#647068}.login{max-width:510px;margin:80px auto;padding:32px;background:#fff;border:1px solid #d4d9cd;box-shadow:0 10px 40px #173d3209}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6c765c}label{display:block;font-size:13px;margin:16px 0 6px}input,select,button{font:inherit}input,select{width:100%;padding:10px 12px;border:1px solid #bfc8bd;background:#fff;color:#23312c;border-radius:3px}button{border:1px solid #234c3e;background:#234c3e;color:white;padding:10px 16px;border-radius:3px;cursor:pointer}button:hover{background:#153c32}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;color:#234c3e}.secondary:hover{background:#e6ece3}.login button{width:100%;margin-top:22px}:focus-visible{outline:3px solid #b89c4a;outline-offset:3px}#message{white-space:pre-wrap;padding:12px 16px;border-left:3px solid #ae9140;background:#fff;margin-bottom:20px}#message:empty{display:none}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.tools{display:flex;gap:8px;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:#fff;border-top:3px solid #a89555;padding:18px 20px}.stat strong{display:block;font:32px Georgia,serif;margin:6px 0}.stat span{font-size:12px;color:#637369}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.card{background:white;border:1px solid #d4d9cd;padding:24px;margin-bottom:24px;min-width:0}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.cardhead h2{margin-bottom:12px}.pill{font-size:11px;border:1px solid #bbcbbb;padding:3px 8px;border-radius:20px;color:#365143}.support{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #e5e9df;padding:12px 0}.support p{font-size:13px;margin:3px 0}.support button{padding:6px 10px;background:#fff;color:#234c3e}.empty{padding:20px 0;color:#6c766e;font-size:14px}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;color:#6c766e;letter-spacing:.6px}td,th{border-bottom:1px solid #e7ebe2;padding:10px 10px 10px 0;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 ui-monospace,monospace;background:#f3f5ef;padding:16px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.formgrid label{margin-top:12px}.wide{grid-column:1/-1}.actionnote{font-size:12px;color:#6c766e;margin:12px 0}.log-entry{border-top:1px solid #e5e9df;padding:12px 0;font-size:13px}.log-entry strong{font-weight:600}.log-entry small{display:block;color:#6b766d;overflow-wrap:anywhere}.footer{font-size:12px;color:#6b766d;padding:12px 0 32px}.login .muted{font-size:14px}[hidden]{display:none!important}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.topline{align-items:flex-start;flex-direction:column}header span{display:none}}@media(max-width:460px){main{padding:0 16px;margin-top:24px}.login{margin-top:30px;padding:24px}.card{padding:18px}.stats{gap:10px}.stat{padding:14px}h1{font-size:30px}.formgrid{grid-template-columns:1fr 1fr}}
fieldset{border:1px solid #d4d9cd;margin:20px 0;padding:16px}legend{font-size:13px;color:#637369}.gm-powers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gm-powers label{display:flex;gap:8px;align-items:center;margin:0}.gm-powers input{width:auto}#gm-controls .tools{flex-wrap:wrap}@media(max-width:650px){.gm-powers{grid-template-columns:1fr 1fr}}
</style></head><body><header><b>UOAIX</b><span>THE KEEPER'S DESK</span></header><main><div id="message" role="status" aria-live="polite"></div><section class="login" id="login"><p class="eyebrow">Private shard administration</p><h1>Enter the keeper's desk</h1><p class="muted">Use the owner key or your personal GM credential. World reports and controls become available after authentication.</p><form id="login-form"><label for="key">Administrator key</label><input id="key" type="password" autocomplete="off" spellcheck="false" required pattern="([0-9a-fA-F]{64}|UOAIXGM1:[0-9]{1,3}:[0-9a-fA-F]{64})" placeholder="Owner key or UOAIXGM1 credential"><button id="connect">Authenticate</button></form></section><div id="app"></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id), enc=new TextEncoder(), dec=new TextDecoder('utf-8',{fatal:true});
let outgoing,incoming,sequence=0,session=0,chain=Promise.resolve(),selected=0,oldestLog=0;
let gmAccounts=[],gmOldest=0,role=4,isGm=false,myPowers=0,leaseEnd=0;
const gmPowers=[[1,'Support queue'],[2,'Go to player'],[4,'Unstick player'],[8,'Inspect items and logs'],[16,'Restore lost items'],[32,'Kick'],[64,'Mute'],[128,'Jail'],[256,'Ban'],[512,'Favor: coin'],[1024,'Favor: items'],[2048,'Favor: titles'],[4096,'Favor: plots']];
const gmLimits=['coin_each','coin_day','item_each','item_day','title_day','plot_day'];
const hex=bytes=>Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
const unhex=text=>{if(text.length%2||!/^[a-f0-9]*$/i.test(text))throw Error('Invalid encrypted response');return Uint8Array.from(text.match(/../g)||[],x=>parseInt(x,16));};
const note=text=>{$('message').textContent=text;};
async function hmac(key,text){const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',k,enc.encode(text)));}
async function authenticate(key){
 const token=key.split(':');role=token.length===3&&token[0]==='UOAIXGM1'?Number(token[1]):4;if(token.length===3)key=token[2];if(!Number.isInteger(role)||role<4||role>132||!/^[0-9a-f]{64}$/i.test(key))throw Error('Invalid administrator credential');
 if(!window.isSecureContext||!crypto.subtle)throw Error('A secure browser connection is required. The local development address is supported.');
 const hello=await fetch('/handshake',{cache:'no-store'}),fields=(await hello.text()).split('\n');
 if(!hello.ok||fields.length!==2||fields[0]!=='UOAIX1'||!/^[a-f0-9]{64}$/i.test(fields[1]))throw Error('Invalid shard handshake');
 const raw=unhex(key),epoch=fields[1];
 incoming=await hmac(raw,'UOAIX1/request/'+role+'/'+epoch);outgoing=await hmac(raw,'UOAIX1/response/'+role+'/'+epoch);raw.fill(0);
 sequence=0;leaseEnd=0;
 await reserveSequence();
}
async function reserveSequence(){
 const challenge=hex(crypto.getRandomValues(new Uint8Array(32))),tag=hex(await hmac(incoming,'UOAIX1/sequence/'+role+'/'+challenge));
 const sync=await fetch('/handshake',{method:'POST',body:role+'\n'+challenge+'\n'+tag,cache:'no-store'}),parts=(await sync.text()).split('\n');
 if(!sync.ok||parts.length!==2||!/^\d{1,9}$/.test(parts[0]))throw Error('Authentication refused');
 const verifier=await crypto.subtle.importKey('raw',outgoing,{name:'HMAC',hash:'SHA-256'},false,['verify']);
 if(!await crypto.subtle.verify('HMAC',verifier,unhex(parts[1]),enc.encode('UOAIX1/sequence/'+role+'/'+challenge+'/'+parts[0])))throw Error('Handshake authentication failed');
 const floor=Number(parts[0]);if(floor>999998975)throw Error('Sequence exhausted');
 const label='UOAIX1/reserve/'+role+'/'+challenge+'/'+floor,reserved=await fetch('/handshake',{method:'POST',body:role+'\n'+challenge+'\n'+floor+'\n'+hex(await hmac(incoming,label)),cache:'no-store'}),proof=(await reserved.text()).split('\n');
 if(!reserved.ok||proof.length!==2||proof[0]!==String(floor)||!await crypto.subtle.verify('HMAC',verifier,unhex(proof[1]),enc.encode(label)))throw Error('Sequence reservation refused');
 sequence=floor;leaseEnd=floor+1024;
}
function request(command){const work=chain.then(async()=>{
 if(sequence>=leaseEnd)await reserveSequence();
 if(++sequence>999999999)throw Error('Session sequence exhausted');
 const nonce=new Uint8Array(12);new DataView(nonce.buffer).setBigUint64(4,BigInt(sequence),true);
 const body=enc.encode(JSON.stringify({...command,session}));if(body.length>2048)throw Error('Request is too large');
 const key=await crypto.subtle.importKey('raw',incoming,'AES-GCM',false,['encrypt']);
 const sealed=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:nonce,additionalData:enc.encode('UOAIX1/request/'+role+'/'+sequence),tagLength:128},key,body));
 const wire=role+'\n'+sequence+'\n'+hex(sealed.slice(0,-16))+'\n'+hex(sealed.slice(-16));
 const response=await fetch('/admin',{method:'POST',body:wire,cache:'no-store'});if(!response.ok)throw Error('Request refused. Reconnect and review the action log before repeating an action.');
 const parts=(await response.text()).split('\n');if(parts.length!==2)throw Error('Invalid response');
 const cipher=unhex(parts[0]),tag=unhex(parts[1]),combined=new Uint8Array(cipher.length+tag.length);combined.set(cipher);combined.set(tag,cipher.length);
 const replyKey=await crypto.subtle.importKey('raw',outgoing,'AES-GCM',false,['decrypt']);
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:nonce,additionalData:enc.encode('UOAIX1/response/'+role+'/'+sequence),tagLength:128},replyKey,combined);
 const value=JSON.parse(dec.decode(plain));if(value.error)throw Error(value.error);return value;
 });chain=work.catch(()=>{});return work;}
function cell(row,text,tag='td'){const node=document.createElement(tag);node.textContent=String(text);row.append(node);return node;}
function empty(parent,text){const node=document.createElement('p');node.className='empty';node.textContent=text;parent.append(node);}
function reportSubject(report){const kind=report.subject_kind??'account';if(kind==='account')return report.account||'Account';if(kind==='npc')return 'NPC #'+report.subject_id;if(kind==='world')return report.subject_id?'World object #'+report.subject_id:'World';return 'Unknown subject';}
function renderLog(rows){oldestLog=rows.length?rows[0].record.id:0;$('actions').replaceChildren();for(const item of rows.slice().reverse()){const row=document.createElement('div');row.className='log-entry';cell(row,'#'+item.record.id+' '+item.record.action+' \u00b7 '+({0:'Queued',1:'Applied','-1':'Refused','-2':'Cancelled'}[item.result]||'Recorded'),'strong');cell(row,item.record.actor+' \u00b7 session '+item.record.session+' \u00b7 tick '+item.record.tick,'small');cell(row,JSON.stringify(item.record.arguments),'small');$('actions').append(row);}$('older-log').disabled=oldestLog<=1;}
function selectGm(){const account=gmAccounts.find(a=>a.account===Number($('gm-account').value)),policy=account?.policy;for(const [bit]of gmPowers)$('gm-power-'+bit).checked=!!(policy?.powers&bit);for(const field of gmLimits)$('gm-'+field.replaceAll('_','-')).value=policy?.[field]??0;$('gm-dub').disabled=!account||policy.gm===1;$('gm-set').disabled=!account||policy.gm!==1;$('gm-revoke').disabled=!account||policy.gm!==1;}
function renderGmLog(rows){gmOldest=rows.length?rows[0].id:0;$('gm-actions').replaceChildren();for(const item of rows.slice().reverse()){const row=document.createElement('div');row.className='log-entry';const actor=item.actor_account===0?item.principal:(gmAccounts.find(a=>a.account===item.actor_account)?.name||'Account '+item.actor_account);cell(row,'#'+item.id+' '+item.action+' \u00b7 '+item.decision,'strong');cell(row,actor+' -> account '+item.target_account+' \u00b7 day '+item.game_day+' \u00b7 grant revision '+item.grant_revision,'small');cell(row,item.reason||item.detail,'small');if(!item.action.startsWith('gm-'))cell(row,'Request '+item.request_id+' \u00b7 subject '+item.subject+' \u00b7 amount '+item.amount,'small');cell(row,JSON.stringify(item.before)+' -> '+JSON.stringify(item.after),'small');$('gm-actions').append(row);}if(!rows.length)empty($('gm-actions'),'No GM actions recorded.');$('gm-older').disabled=gmOldest<=1;}
async function refreshGms(){
 const data=await request({command:'gm-list'});if(data.stand_in!==true)throw Error('Unexpected GM storage mode');gmAccounts=data.accounts;const chosen=$('gm-account').value;$('gm-account').replaceChildren();$('gm-accounts').replaceChildren();
 for(const account of gmAccounts){const row=document.createElement('tr');cell(row,account.name+' (#'+account.account+')');cell(row,account.policy.gm?'GM':account.human?'Player':'NPC');cell(row,gmPowers.filter(([bit])=>account.policy.powers&bit).map(([,label])=>label).join(', ')||'None');cell(row,account.coins_used+'/'+account.policy.coin_day+' coin; '+account.items_used+'/'+account.policy.item_day+' items; '+account.titles_used+'/'+account.policy.title_day+' titles; '+account.plots_used+'/'+account.policy.plot_day+' plots');cell(row,account.coins);$('gm-accounts').append(row);if(account.human){const option=document.createElement('option');option.value=account.account;option.textContent=account.name+' (#'+account.account+')';$('gm-account').append(option);}}
 if(gmAccounts.some(a=>String(a.account)===chosen&&a.human))$('gm-account').value=chosen;selectGm();$('gm-treasury').textContent='Stand-in treasury: '+data.treasury+' coin. Game day '+data.day+'. '+data.action_count+' actions recorded.';renderGmLog((await request({command:'gm-log',before:0})).rows);
}
async function refresh(){if(isGm)return refreshGmPanel();const data=await request({command:'panel-data'}),h=data.health;
 $('day-seconds').value=data.day_seconds;
 $('population').textContent=h.population;$('fallbacks').textContent=h.model_fallbacks;$('support-count').textContent=h.conduct_pending;$('world-state').textContent=h.up?'Running':'Down';$('hour').textContent='Game hour '+h.game_hour;
 $('economy').textContent='Gold in '+h.gold_in+' \u00b7 Gold out '+h.gold_out+' \u00b7 Bread '+h.bread_price+' \u00b7 Goods '+h.goods_price+' \u00b7 Spawns '+h.spawns+' \u00b7 Refused proposals '+h.refused_proposals+' \u00b7 Errors '+h.errors;
 $('support').replaceChildren();for(const report of data.support){const row=document.createElement('div');row.className='support';const copy=document.createElement('div');cell(copy,reportSubject(report),'strong');cell(copy,report.happened,'p');row.append(copy);const button=document.createElement('button');button.textContent='Review #'+report.id;button.onclick=()=>review(report.id).catch(e=>note(e.message));row.append(button);$('support').append(row);}if(!data.support.length)empty($('support'),'No reports awaiting review.');
 $('connection-rows').replaceChildren();for(const connection of data.connections){const row=document.createElement('tr');for(const value of [connection.id,connection.account,connection.character,connection.address,connection.since])cell(row,value);$('connection-rows').append(row);}$('connection-count').textContent=data.connections.length+' connected';
 renderLog(data.log);$('log-count').textContent=data.log_count+' recorded';$('submit-action').disabled=!!data.pending;$('action-state').textContent=data.pending?'An action awaits the game server.':'Actions are logged before the game server applies them.';
 await refreshGms();
 await refreshTreasury();
}
async function refreshTreasury(){const data=await request({command:'treasury-view'});$('treasury-mode').textContent=!data.available?'Unavailable':data.writable?'Controls enabled':'Read only';$('treasury-balance').textContent=data.available?'Treasury balance: '+(data.backend==='currency'?data.copper+' copper, '+data.silver+' silver, ':'')+data.balance+' gold. Game hour '+data.game_hour+'.':'Economy is not connected.';$('treasury-business').replaceChildren();$('treasury-chains').replaceChildren();const writable=data.available&&data.writable;for(const id of ['treasury-tax','treasury-business','treasury-amount','treasury-metal','treasury-tax-submit','treasury-grant-submit'])$(id).disabled=!writable;$('treasury-rates-form').hidden=!data.available||data.backend!=='currency';for(const id of ['treasury-copper-rate','treasury-silver-rate','treasury-rates-submit'])$(id).disabled=!writable;if(data.backend==='currency'){$('treasury-copper-rate').value=data.copper_per_gold;$('treasury-silver-rate').value=data.silver_per_gold;$('treasury-rates-current').textContent=data.copper_per_gold+' copper = '+data.silver_per_gold+' silver = 1 gold';}$('treasury-metal').replaceChildren();if(!data.available)return;for(const metal of data.metals){const option=document.createElement('option');option.value=metal;option.textContent={1:'Copper',2:'Silver',3:'Gold'}[metal];$('treasury-metal').append(option);}$('treasury-tax').value=(data.tax_basis_points/100).toFixed(2);for(const business of data.businesses){const option=document.createElement('option');option.value=business.purse;option.textContent='Business #'+business.owner+' (purse '+business.purse+'): '+business.balance+' gold'+(data.backend==='currency'?', '+business.copper+' copper, '+business.silver+' silver':'');$('treasury-business').append(option);}$('treasury-grant-submit').disabled=!writable||!data.businesses.length;for(const chain of data.chains){const row=document.createElement('tr');for(const value of [chain.name,chain.turnover,chain.crown,chain.share_basis_points===null?'No turnover':(chain.share_basis_points/100).toFixed(2)+'%'])cell(row,value);$('treasury-chains').append(row);}}
async function review(id){const report=await request({command:'report-read',id});selected=id;$('report-detail').hidden=false;$('report-title').textContent='Report #'+id+' \u00b7 '+reportSubject(report);$('report-meta').textContent=report.location+' \u00b7 game hour '+report.game_hour+' \u00b7 '+report.wall_time;$('report-evidence').textContent=report.happened+'\n\n'+report.evidence;$('ack-report').disabled=isGm&&!(myPowers&1);}
function bindGmPanel(){
 if(!isGm){const tools=document.createElement('div');tools.innerHTML='<h3>Personal panel credential</h3><p class="muted">Issue a credential for the selected GM. Rotation closes the previous session. Copy the credential before leaving.</p><div class="tools"><button type="button" id="gm-key-issue">Issue or rotate key</button><button type="button" class="secondary" id="gm-key-revoke">Revoke key</button></div><label for="gm-issued-key">New credential</label><input id="gm-issued-key" type="password" readonly autocomplete="off"><button type="button" class="secondary" id="gm-key-show">Show or hide</button>';$('gm-form').after(tools);
 $('gm-key-show').onclick=()=>{$('gm-issued-key').type=$('gm-issued-key').type==='password'?'text':'password';};
 $('gm-key-issue').onclick=async()=>{try{const key=hex(crypto.getRandomValues(new Uint8Array(32))),reply=await request({command:'gm-key-set',account:Number($('gm-account').value),key});$('gm-issued-key').value='UOAIXGM1:'+reply.role+':'+key;note('Personal GM credential issued. Share the credential privately with the selected GM.');await refreshGms();}catch(e){note(e.message);}};
 $('gm-key-revoke').onclick=async()=>{try{await request({command:'gm-key-revoke',account:Number($('gm-account').value)});$('gm-issued-key').value='';note('GM credential revoked.');await refreshGms();}catch(e){note(e.message);}};return;}
 for(const id of ['action-form','connection-rows','actions','gm-controls','day-form','treasury-controls'])$(id).closest('.card').hidden=true;
 const card=document.createElement('section');card.className='card';card.id='gm-work';card.innerHTML='<h2>Delegated actions</h2><p class="muted">In-memory stand-in. Favors change fixture resources. Other actions record authorization only; no live player effect follows.</p><p id="gm-own-policy"></p><form id="gm-work-form"><label for="gm-work-action">Granted action</label><select id="gm-work-action"></select><div class="formgrid"><div><label for="gm-work-target">Target account</label><input id="gm-work-target" type="number" min="1" max="2147483647" required></div><div><label for="gm-work-subject">Item, title or plot ID</label><input id="gm-work-subject" type="number" min="0" max="2147483647" value="0" required></div><div><label for="gm-work-amount">Amount</label><input id="gm-work-amount" type="number" min="0" max="1000000000" value="1" required></div></div><label for="gm-work-detail">Reason</label><input id="gm-work-detail" maxlength="128" required><button id="gm-work-submit">Record action</button></form><h3>Your action log</h3><div class="tools"><button class="secondary" id="gm-own-older">Older actions</button><button class="secondary" id="gm-own-latest">Latest actions</button></div><div id="gm-own-actions"></div>';$('gm-controls').after(card);
 $('gm-work-form').onsubmit=async event=>{event.preventDefault();try{const reply=await request({command:'gm-action',action:$('gm-work-action').value,target:Number($('gm-work-target').value),subject:Number($('gm-work-subject').value),amount:Number($('gm-work-amount').value),detail:$('gm-work-detail').value});note('Stand-in action #'+reply.log_id+' recorded.');}catch(e){note(e.message);}try{await refreshGmPanel();}catch(e){note(e.message);}};
 $('gm-own-older').onclick=()=>loadOwnLog(gmOldest).catch(e=>note(e.message));$('gm-own-latest').onclick=()=>loadOwnLog(0).catch(e=>note(e.message));
}
async function loadOwnLog(before){const data=await request({command:'gm-own-log',before});gmOldest=data.before;$('gm-own-actions').replaceChildren();for(const item of data.rows){const row=document.createElement('div');row.className='log-entry';cell(row,'#'+item.id+' '+item.action+' '+item.decision,'strong');cell(row,'Actor '+item.actor_account+' -> '+item.target_account+'; '+(item.reason||item.detail),'small');$('gm-own-actions').append(row);}$('gm-own-older').disabled=gmOldest<=1;}
async function refreshGmPanel(){const data=await request({command:'panel-data'}),h=data.health,a=data.account;myPowers=a.policy.powers;$('population').textContent=h.population;$('fallbacks').textContent=h.model_fallbacks;$('support-count').textContent=h.conduct_pending;$('world-state').textContent=h.up?'Running':'Down';$('hour').textContent='Game hour '+h.game_hour;$('economy').textContent='Gold in '+h.gold_in+'; gold out '+h.gold_out;
 $('support').replaceChildren();for(const report of data.support){const row=document.createElement('div');row.className='support';cell(row,reportSubject(report)+': '+report.happened,'span');const button=document.createElement('button');button.textContent='Review #'+report.id;button.onclick=()=>review(report.id).catch(e=>note(e.message));row.append(button);$('support').append(row);}if(!data.support.length)empty($('support'),'No reports awaiting review.');$('ack-report').disabled=!(myPowers&1);
 const names=['support','go-to-player','unstuck','inspect','restore-items','kick','mute','jail','ban','favor-coins','favor-items','favor-title','favor-plot'];$('gm-work-action').replaceChildren();for(const [i,[bit,title]]of gmPowers.entries()){if(!(myPowers&bit)||bit===1)continue;const option=document.createElement('option');option.value=names[i];option.textContent=title;$('gm-work-action').append(option);}$('gm-work-submit').disabled=!$('gm-work-action').options.length;$('gm-own-policy').textContent='Grant revision '+a.policy.revision+'. Today: '+a.coins_used+'/'+a.policy.coin_day+' coin; '+a.items_used+'/'+a.policy.item_day+' items. Coin per action '+a.policy.coin_each+'; items per action '+a.policy.item_each+'; titles per day '+a.policy.title_day+'; plots per day '+a.policy.plot_day+'.';await loadOwnLog(0);
}
function bindPanel(){bindGmPanel();
 $('treasury-rates-form').onsubmit=async event=>{event.preventDefault();try{await request({command:'treasury-rates',copper_per_gold:Number($('treasury-copper-rate').value),silver_per_gold:Number($('treasury-silver-rate').value)});await refresh();note('Coin rates changed and logged.');}catch(e){note(e.message);try{await refresh();}catch{}}};
 $('treasury-tax-form').onsubmit=async event=>{event.preventDefault();try{await request({command:'treasury-tax',basis_points:Math.round(Number($('treasury-tax').value)*100)});await refresh();note('Tax rate changed and logged.');}catch(e){note(e.message);}};

 $('day-form').onsubmit=async event=>{event.preventDefault();try{const changed=await request({command:'panel-day-set',seconds:Number($('day-seconds').value)});await refresh();note('Game-day length changed to '+changed.day_seconds+' real seconds. The change was logged.');}catch(e){note(e.message);}};
 $('gm-powers').replaceChildren();for(const [bit,title]of gmPowers){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.id='gm-power-'+bit;label.append(input,document.createTextNode(title));$('gm-powers').append(label);}
 $('gm-account').onchange=selectGm;$('gm-latest').onclick=()=>refreshGms().catch(e=>note(e.message));$('gm-older').onclick=async()=>{try{renderGmLog((await request({command:'gm-log',before:gmOldest})).rows);}catch(e){note(e.message);}};
 $('gm-form').onsubmit=async event=>{event.preventDefault();const command={command:event.submitter?.value||'gm-set',account:Number($('gm-account').value),powers:gmPowers.reduce((mask,[bit])=>mask|($('gm-power-'+bit).checked?bit:0),0)};for(const field of gmLimits)command[field]=Number($('gm-'+field.replaceAll('_','-')).value);try{await request(command);note('GM change recorded in the in-memory stand-in.');}catch(e){note(e.message);}try{await refreshGms();}catch(e){note(e.message);}};
 $('older-log').onclick=async()=>{try{renderLog((await request({command:'panel-log',before:oldestLog})).log);}catch(e){note(e.message);}};

 $('refresh').onclick=()=>refresh().catch(e=>note(e.message));
