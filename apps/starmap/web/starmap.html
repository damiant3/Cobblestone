<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Star Atlas</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020208;--surface:#08081a;--panel:#0c0c22;--border:#1a1a3e;--text:#c8c8e0;--dim:#4848a0;--accent:#00d4ff;--accent2:#7b61ff;--warn:#ff5f57;--green:#28c840;--font:'Cascadia Code','JetBrains Mono','Fira Code',monospace}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;cursor:crosshair}
.app{display:flex;flex-direction:column;height:100vh}
.header{height:32px;display:flex;align-items:center;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.logo{font-size:0.75em;font-weight:300;letter-spacing:0.2em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sep{width:1px;height:16px;background:var(--border)}
.hdr-btn{padding:3px 8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:var(--font);font-size:0.52em;cursor:pointer;border-radius:3px;transition:0.1s}
.hdr-btn:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.hdr-btn.active{color:var(--accent);border-color:var(--accent);background:rgba(0,212,255,0.06)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:0.52em;color:var(--dim)}
.search-box{display:flex;align-items:center;gap:4px}
.search-input{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:1em;padding:2px 6px;border-radius:3px;width:160px;outline:none}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--dim);opacity:0.5}
.main{flex:1;display:flex;position:relative;overflow:hidden}
canvas{flex:1;display:block}
#error{color:var(--warn);padding:2em;text-align:center;display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10}
.info-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);transition:transform 0.2s}
.info-panel.open{transform:translateX(0)}
.info-head{height:28px;display:flex;align-items:center;padding:0 8px;font-size:0.6em;letter-spacing:0.1em;color:var(--dim);border-bottom:1px solid var(--border);justify-content:space-between}
.info-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1em}
.info-close:hover{color:var(--warn)}
.info-body{flex:1;overflow-y:auto;padding:8px}
.info-name{font-size:0.85em;color:var(--accent);margin-bottom:6px}
.info-kind{font-size:0.55em;color:var(--dim);letter-spacing:0.1em;margin-bottom:8px}
.info-row{display:flex;justify-content:space-between;padding:2px 0;font-size:0.55em}
.info-label{color:var(--dim)}
.info-value{color:var(--text)}
.info-desc{font-size:0.52em;color:var(--dim);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.info-actions{padding:8px;border-top:1px solid var(--border);display:flex;gap:4px}
.info-btn{flex:1;padding:4px;border:1px solid var(--border);background:rgba(255,255,255,0.02);color:var(--text);font-family:var(--font);font-size:0.52em;border-radius:3px;cursor:pointer}
.info-btn:hover{border-color:var(--accent);color:var(--accent)}
.catalog-panel{position:absolute;top:0;left:0;width:240px;height:100%;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transform:translateX(-100%);transition:transform 0.2s}
.catalog-panel.open{transform:translateX(0)}
.cat-head{height:28px;display:flex;align-items:center;padding:0 8px;font-size:0.6em;letter-spacing:0.1em;color:var(--dim);border-bottom:1px solid var(--border)}
.cat-list{flex:1;overflow-y:auto}
.cat-item{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:0.58em;cursor:pointer;border-left:2px solid transparent;transition:0.08s}
.cat-item:hover{background:rgba(255,255,255,0.03)}
.cat-item.sel{background:rgba(0,212,255,0.08);border-left-color:var(--accent);color:var(--accent)}
.cat-item .icon{width:16px;text-align:center;opacity:0.5}
.cat-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-item .mag{font-size:0.85em;color:var(--dim)}
.hud{position:absolute;bottom:8px;left:8px;font-size:0.5em;color:var(--dim);line-height:1.6;pointer-events:none}
.hud-right{position:absolute;bottom:8px;right:8px;font-size:0.48em;color:var(--dim);text-align:right;line-height:1.5;pointer-events:none}
.crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;opacity:0.15}
.crosshair::before,.crosshair::after{content:'';position:absolute;background:var(--accent)}
.crosshair::before{width:1px;height:100%;left:50%}
.crosshair::after{width:100%;height:1px;top:50%}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="logo">CODEX STAR ATLAS</span>
    <div class="hdr-sep"></div>
    <button class="hdr-btn" id="btn-catalog">Catalog</button>
    <button class="hdr-btn active" id="btn-labels">Labels</button>
    <button class="hdr-btn active" id="btn-grid">Grid</button>
    <button class="hdr-btn active" id="btn-constellations">Lines</button>
    <div class="hdr-sep"></div>
    <div class="search-box">
      <input class="search-input" id="search" placeholder="Search stars..." />
    </div>
    <div class="hdr-right">
      <span id="obj-count">-- objects</span>
      <span id="fps">-- fps</span>
    </div>
  </div>
  <div class="main">
    <canvas id="viewport"></canvas>
    <div id="error">WebGPU not available. Use Chrome 113+ or Edge 113+.</div>
    <div class="crosshair"></div>
    <div class="hud" id="hud">
      <div id="hud-target">Target: Sol</div>
      <div id="hud-pos">0, 0, 0</div>
      <div id="hud-dist">Distance: 100 pc</div>
    </div>
    <div class="hud-right">
      WASD move &middot; Mouse orbit<br>
      Scroll zoom &middot; Click select<br>
      F fly to &middot; G grid &middot; L labels<br>
      1-6 magnitude limit &middot; +/- speed
    </div>
    <div class="catalog-panel" id="catalog-panel">
      <div class="cat-head">CATALOG</div>
      <div class="cat-list" id="cat-list"></div>
    </div>
    <div class="info-panel" id="info-panel">
      <div class="info-head">
        <span>OBJECT INFO</span>
        <button class="info-close" id="info-close">&times;</button>
      </div>
      <div class="info-body" id="info-body"></div>
      <div class="info-actions">
        <button class="info-btn" id="btn-fly-to">Fly To</button>
        <button class="info-btn" id="btn-wiki">Details</button>
      </div>
    </div>
  </div>
</div>
<script>
// Codex Star Atlas -- WebGPU renderer
// Loads starmap.dat binary catalog (118K stars from HYG v4.2)
// Credit: HYG Star Database by David Nash, CC BY-SA 4.0
//         Based on Hipparcos (ESA), Yale BSC, Gliese catalogs.

// Star record: [id, name, x, y, z, mag(x1000), bv(x1000), kind, constellation]
let STARS = [];
let DSOS = [];  // deep-sky objects: [id, name, kind, x, y, z, mag, con, desc]
let CONSTELLATIONS = []; // loaded from binary: [name, [[fromId, toId], ...]]
const SPECT_NAMES = ['O','B','A','F','G','K','M','L','T','W','?'];
const DSO_KINDS = ['Globular Cluster','Open Cluster','Planetary Nebula','Diffuse Nebula',
                   'Galaxy','Quasar','Dark Nebula','Supernova Remnant'];

async function loadCatalog() {
  try {
    const resp = await fetch('data/starmap.dat');
    if (!resp.ok) throw new Error('starmap.dat not found -- run import-hyg.ps1 first');
    const buf = await resp.arrayBuffer();
    const dv = new DataView(buf);
    const td = new TextDecoder('utf-8');

    // Header (64 bytes for v2, 32 for v1)
    const magic = dv.getInt32(0, true);
    if (magic !== 0x52415453) throw new Error('Bad magic: ' + magic.toString(16));
    const version = dv.getInt32(4, true);
    const starCount = dv.getInt32(8, true);
    const namedCount = dv.getInt32(12, true);
    const nameTableOff = dv.getInt32(16, true);
    const dsoCount = version >= 2 ? dv.getInt32(20, true) : 0;
    const dsoOff = version >= 2 ? dv.getInt32(24, true) : 0;
    const conCount = version >= 2 ? dv.getInt32(28, true) : 0;
    const conOff = version >= 2 ? dv.getInt32(32, true) : 0;
    const headerSize = version >= 2 ? 64 : 32;

    // Read name table
    const names = [];
    let noff = nameTableOff;
    for (let i = 0; i < namedCount; i++) {
      const len = dv.getUint8(noff); noff++;
      names.push(td.decode(new Uint8Array(buf, noff, len)));
      noff += len;
    }

    // Read stars
    const stars = new Array(starCount);
    for (let i = 0; i < starCount; i++) {
      const off = headerSize + i * 32;
      const id = dv.getInt32(off, true);
      const x = dv.getInt32(off+4, true), y = dv.getInt32(off+8, true), z = dv.getInt32(off+12, true);
      const mag = dv.getInt16(off+16, true);
      const bv = dv.getInt16(off+20, true);
      const c0=dv.getUint8(off+23),c1=dv.getUint8(off+24),c2=dv.getUint8(off+25);
      const con = String.fromCharCode(c0,c1,c2).trim();
      const flags = dv.getUint8(off+26);
      const nameIdx = dv.getInt32(off+27, true);
      const proper = (flags & 1) ? (names[nameIdx] || '') : '';
      stars[i] = [id, proper, x, y, z, mag, bv, 'Star', con];
    }

    // Read DSOs
    const dsos = [];
    if (dsoCount > 0 && dsoOff > 0) {
      for (let i = 0; i < dsoCount; i++) {
        const off = dsoOff + i * 80;
        const id = dv.getInt32(off, true);
        const x = dv.getInt32(off+4, true), y = dv.getInt32(off+8, true), z = dv.getInt32(off+12, true);
        const mag = dv.getInt16(off+16, true);
        const kind = dv.getUint8(off+18);
        const dc0=dv.getUint8(off+19),dc1=dv.getUint8(off+20),dc2=dv.getUint8(off+21);
        const dcon = String.fromCharCode(dc0,dc1,dc2).trim();
        const nameLen = dv.getUint8(off+22);
        const dname = td.decode(new Uint8Array(buf, off+23, nameLen));
        const descLen = dv.getUint8(off+63);
        const ddesc = td.decode(new Uint8Array(buf, off+64, Math.min(descLen,16)));
        const kindName = DSO_KINDS[kind] || 'Unknown';
        dsos.push([id, dname, x, y, z, mag, 0, kindName, dcon, ddesc]);
      }
    }
    DSOS = dsos;

    // Read constellations
    const cons = [];
    if (conCount > 0 && conOff > 0) {
      let coff = conOff;
      for (let i = 0; i < conCount; i++) {
        const abbrLen = dv.getUint8(coff); coff++;
        const abbr = td.decode(new Uint8Array(buf, coff, abbrLen)); coff += abbrLen;
        const cnameLen = dv.getUint8(coff); coff++;
        const cname = td.decode(new Uint8Array(buf, coff, cnameLen)); coff += 20;
        const lineCount = dv.getUint16(coff, true); coff += 2;
        const lines = [];
        for (let j = 0; j < lineCount; j++) {
          const from = dv.getInt32(coff, true); coff += 4;
          const to = dv.getInt32(coff, true); coff += 4;
          lines.push([from, to]);
        }
        cons.push([cname, lines]);
      }
    }
    CONSTELLATIONS = cons;

    // Merge DSOs into STARS for unified rendering
    for (const d of dsos) {
      stars.push([d[0], d[1], d[2], d[3], d[4], d[5], d[6], d[7], d[8]]);
    }

    return stars;
  } catch (e) {
    console.warn('Binary catalog load failed, using fallback:', e.message);
    return fallbackStars();
  }
}

function fallbackStars() {
  return [
    [0,"Sol",0,0,0,-26720,656,"Star","---"],
    [1,"Sirius",-1810,-909,-400,-1460,9,"Star","CMa"],
    [2,"Canopus",27900,75400,-47600,-720,164,"Star","Car"],
    [3,"Arcturus",-26300,-27200,29800,-50,1230,"Star","Boo"],
    [4,"Vega",2500,5200,13100,30,0,"Star","Lyr"],
    [5,"Rigel",-98000,-200000,-128000,120,-30,"Star","Ori"],
    [6,"Betelgeuse",-87000,-164000,36000,420,1500,"Star","Ori"],
    [7,"Procyon",-2200,700,1500,340,432,"Star","CMi"],
    [8,"Altair",2300,-1700,1400,770,220,"Star","Aql"],
    [9,"Deneb",329000,359000,145000,1250,90,"Star","Cyg"],
    [10,"Polaris",-28000,76200,97700,1980,600,"Star","UMi"],
  ];
}

// Constellations loaded from binary (CONSTELLATIONS set by loadCatalog)

// Star lookup by ID (built after catalog loads)
let STAR_BY_ID = {};

// Spectral class color (more precise than B-V alone)
function spectralColor(kind, bv) {
  if(kind==='Galaxy') return [0.6,0.55,0.8];
  if(kind==='Nebula') return [0.4,0.7,0.9];
  if(kind==='Cluster') return [0.8,0.8,0.5];
  if(kind==='Black Hole') return [0.1,0.1,0.1];
  return bvToRGB(bv);
}

// BV color index to RGB (refined Planck-like curve)
function bvToRGB(bv) {
  let r,g,b;
  if(bv<-300){r=146;g=168;b=255}       // O-type: deep blue
  else if(bv<-150){r=162;g=184;b=255}   // early B: blue-white
  else if(bv<0){r=185;g=204;b=255}      // late B: pale blue
  else if(bv<150){r=215;g=223;b=255}    // A-type: white-blue
  else if(bv<300){r=244;g=241;b=255}    // early F: white
  else if(bv<450){r=255;g=248;b=240}    // late F: yellow-white
  else if(bv<600){r=255;g=237;b=210}    // G-type: yellow (Sun-like)
  else if(bv<800){r=255;g=218;b=172}    // early K: orange
  else if(bv<1100){r=255;g=195;b=139}   // K-type: deep orange
  else if(bv<1400){r=255;g=166;b=108}   // early M: orange-red
  else if(bv<1700){r=255;g=132;b=68}    // M-type: red
  else{r=255;g=100;b=40}                // late M/L: deep red
  return [r/255,g/255,b/255];
}

function formatDist(s) {
  const pc = Math.sqrt(s[2]*s[2]+s[3]*s[3]+s[4]*s[4])/1000;
  const ly = pc * 3.262;
  if(ly > 1e9) return (ly/1e9).toFixed(1)+' Gly';
  if(ly > 1e6) return (ly/1e6).toFixed(1)+' Mly';
  if(ly > 1000) return (ly/1000).toFixed(1)+' kly';
  if(ly > 1) return ly.toFixed(1)+' ly';
  return (ly*63241).toFixed(0)+' AU';
}

function magToSize(mag) {
  if(mag<-1000) return 6;
  if(mag<0) return 5;
  if(mag<1000) return 4;
  if(mag<2000) return 3.5;
  if(mag<3000) return 3;
  if(mag<4000) return 2;
  if(mag<6000) return 1.5;
  return 1;
}

// Camera state
let cam = {fx:0,fy:0,fz:0,yaw:0,pitch:15,dist:500,speed:50};
let selected = -1, showLabels=true, showGrid=true, showLines=true, magLimit=6500;
let dragging=false, lastMx=0, lastMy=0;
let keys={};

const canvas = document.getElementById('viewport');
const ctx2d = document.createElement('canvas').getContext('2d');

async function main() {
  // Load star catalog
  document.getElementById('obj-count').textContent = 'loading...';
  STARS = await loadCatalog();
  STAR_BY_ID = {};
  for (const s of STARS) STAR_BY_ID[s[0]] = s;
  document.getElementById('obj-count').textContent = STARS.length.toLocaleString() + ' objects, ' + CONSTELLATIONS.length + ' constellations';

  // Check WebGPU
  if (!navigator.gpu) { document.getElementById('error').style.display='block'; return; }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { document.getElementById('error').style.display='block'; return; }
  const device = await adapter.requestDevice();
  const gpuCtx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  gpuCtx.configure({device, format, alphaMode:'premultiplied'});

  // 2D overlay canvas
  const overlay = document.createElement('canvas');
  overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5';
  canvas.parentElement.appendChild(overlay);
  const ctx = overlay.getContext('2d');

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
    overlay.width = r.width * devicePixelRatio;
    overlay.height = r.height * devicePixelRatio;
    overlay.style.width = r.width+'px';
    overlay.style.height = r.height+'px';
  }
  resize();
  window.addEventListener('resize', resize);


  // Render pass shader -- points as circles
  const shaderSrc = `
struct VSOut { @builtin(position) pos: vec4f, @location(0) color: vec3f, @location(1) size: f32 };
struct Star { pos: vec3f, color: vec3f, size: f32 };
@group(0) @binding(0) var<uniform> mvp: mat4x4f;
@group(0) @binding(1) var<storage,read> stars: array<Star>;
@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VSOut {
  let s = stars[ii];
  let clip = mvp * vec4f(s.pos, 1.0);
  let quad = array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(-1,1),vec2f(-1,1),vec2f(1,-1),vec2f(1,1));
  let offset = quad[vi] * s.size / vec2f(${canvas.width > 0 ? canvas.width : 800}.0, ${canvas.height > 0 ? canvas.height : 600}.0) * clip.w * 4.0;
  var out: VSOut;
  out.pos = clip + vec4f(offset, 0, 0);
  out.color = s.color;
  out.size = s.size;
  return out;
}
@fragment fn fs(in: VSOut) -> @location(0) vec4f {
  return vec4f(in.color, 1.0);
}`;

  // Build MVP matrix
  function perspective(fov, aspect, near, far) {
    const f = 1/Math.tan(fov*Math.PI/360);
    return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,2*far*near/(near-far),0]);
  }
  function lookAt(eye, center, up) {
    const z=[eye[0]-center[0],eye[1]-center[1],eye[2]-center[2]];
    const zl=Math.hypot(...z); z[0]/=zl;z[1]/=zl;z[2]/=zl;
    const x=[up[1]*z[2]-up[2]*z[1],up[2]*z[0]-up[0]*z[2],up[0]*z[1]-up[1]*z[0]];
    const xl=Math.hypot(...x); x[0]/=xl;x[1]/=xl;x[2]/=xl;
    const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
      -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),1]);
  }
  function mat4mul(a,b) {
    const o=new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++) {
      o[j*4+i]=a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];
    }
    return o;
  }

  // Create pipeline once
  const module = device.createShaderModule({code:shaderSrc});
  const pipeline = device.createRenderPipeline({
    layout:'auto',
    vertex:{module,entryPoint:'vs'},
    fragment:{module,entryPoint:'fs',targets:[{format,blend:{color:{srcFactor:'src-alpha',dstFactor:'one',operation:'add'},alpha:{srcFactor:'one',dstFactor:'one',operation:'add'}}}]},
    primitive:{topology:'triangle-list'},
  });

  // Pre-compute star GPU data once (positions + colors don't change)
  // Only rebuild when magLimit changes
  let gpuStarData = null, gpuVisible = null, lastMagLimit = -1;

  function rebuildStarData() {
    const vis = [];
    for (const s of STARS) {
      if (s[5] > magLimit) continue;
      const [r,g,b] = spectralColor(s[7], s[6]);
      const sz = magToSize(s[5]);
      vis.push({x:s[2]/100,y:s[3]/100,z:s[4]/100,r,g,b,size:sz,id:s[0],name:s[1],kind:s[7]});
    }
    const data = new Float32Array(vis.length * 7);
    for (let i=0;i<vis.length;i++) {
      const v=vis[i], o=i*7;
      data[o]=v.x; data[o+1]=v.y; data[o+2]=v.z;
      data[o+3]=v.r; data[o+4]=v.g; data[o+5]=v.b;
      data[o+6]=v.size;
    }
    gpuStarData = data;
    gpuVisible = vis;
    lastMagLimit = magLimit;
    document.getElementById('obj-count').textContent = vis.length.toLocaleString()+' / '+STARS.length.toLocaleString()+' stars';
  }

  // Reusable MVP uniform buffer
  const mvpBuf = device.createBuffer({size:64,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});

  let lastT = performance.now(), frames = 0;

  function frame() {
    // Update camera from keys
    const spd = cam.speed;
    const yr = cam.yaw*Math.PI/180, pr = cam.pitch*Math.PI/180;
    const fwd = [-Math.sin(yr)*Math.cos(pr), Math.sin(pr), -Math.cos(yr)*Math.cos(pr)];
    const right = [Math.cos(yr), 0, -Math.sin(yr)];
    if(keys['w']||keys['W']){cam.fx+=fwd[0]*spd;cam.fy+=fwd[1]*spd;cam.fz+=fwd[2]*spd}
    if(keys['s']||keys['S']){cam.fx-=fwd[0]*spd;cam.fy-=fwd[1]*spd;cam.fz-=fwd[2]*spd}
    if(keys['d']||keys['D']){cam.fx+=right[0]*spd;cam.fy+=right[1]*spd;cam.fz+=right[2]*spd}
    if(keys['a']||keys['A']){cam.fx-=right[0]*spd;cam.fy-=right[1]*spd;cam.fz-=right[2]*spd}
    if(keys['q']||keys['Q']) cam.fy+=spd;
    if(keys['e']||keys['E']) cam.fy-=spd;

    // Eye position from orbit
    const eyeX = cam.fx + cam.dist*Math.sin(yr)*Math.cos(pr);
    const eyeY = cam.fy - cam.dist*Math.sin(pr);
    const eyeZ = cam.fz + cam.dist*Math.cos(yr)*Math.cos(pr);

    const W = canvas.width, H = canvas.height;
    const aspect = W/H || 1;
    const proj = perspective(60, aspect, 0.1, 1e12);
    const view = lookAt([eyeX,eyeY,eyeZ],[cam.fx,cam.fy,cam.fz],[0,1,0]);
    const mvp = mat4mul(view, proj);

    // Rebuild star data if mag limit changed
    if (magLimit !== lastMagLimit) rebuildStarData();
    const visible = gpuVisible;
    if (!visible || visible.length === 0) { requestAnimationFrame(frame); return; }

    // Upload MVP and star data
    device.queue.writeBuffer(mvpBuf, 0, mvp);
    const starBuf = device.createBuffer({size:gpuStarData.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST,mappedAtCreation:true});
    new Float32Array(starBuf.getMappedRange()).set(gpuStarData);
    starBuf.unmap();

    const bg = device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:mvpBuf}},{binding:1,resource:{buffer:starBuf}}]});

    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({colorAttachments:[{view:gpuCtx.getCurrentTexture().createView(),clearValue:{r:0.008,g:0.008,b:0.03,a:1},loadOp:'clear',storeOp:'store'}]});
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bg);
    pass.draw(6, visible.length);
    pass.end();
    device.queue.submit([encoder.finish()]);
    starBuf.destroy();

    // 2D overlay: labels, grid, HUD
    ctx.clearRect(0,0,W,H);
    if(showLabels) {
      ctx.font = `${10*devicePixelRatio}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillStyle = 'rgba(200,200,224,0.5)';
      for(const v of visible) {
        if(v.name && v.size >= 3) {
          // Project to screen
          const cx=v.x-eyeX, cy=v.y-eyeY, cz=v.z-eyeZ;
          const vx = view[0]*cx+view[4]*cy+view[8]*cz+view[12];
          const vy = view[1]*cx+view[5]*cy+view[9]*cz+view[13];
          const vz = view[2]*cx+view[6]*cy+view[10]*cz+view[14];
          const vw = view[3]*cx+view[7]*cy+view[11]*cz+view[15];
          if(vz > 0) continue; // behind camera
          const px = proj[0]*vx+proj[4]*vy+proj[8]*vz+proj[12]*vw;
          const py = proj[1]*vx+proj[5]*vy+proj[9]*vz+proj[13]*vw;
          const pw = proj[3]*vx+proj[7]*vy+proj[11]*vz+proj[15]*vw;
          if(Math.abs(pw)<0.001) continue;
          const sx = (px/pw*0.5+0.5)*W;
          const sy = (1-(py/pw*0.5+0.5))*H;
          if(sx>0 && sx<W && sy>0 && sy<H) {
            ctx.fillText(v.name, sx+8*devicePixelRatio, sy+3*devicePixelRatio);
          }
        }
      }
    }

    // Constellation lines
    if(showLines) {
      ctx.strokeStyle = 'rgba(72,72,160,0.25)';
      ctx.lineWidth = 1 * devicePixelRatio;
      function project3d(wx,wy,wz) {
        const cx=wx-eyeX, cy=wy-eyeY, cz=wz-eyeZ;
        const vx2=view[0]*cx+view[4]*cy+view[8]*cz+view[12];
        const vy2=view[1]*cx+view[5]*cy+view[9]*cz+view[13];
        const vz2=view[2]*cx+view[6]*cy+view[10]*cz+view[14];
        const vw2=view[3]*cx+view[7]*cy+view[11]*cz+view[15];
        if(vz2>0) return null;
        const px2=proj[0]*vx2+proj[4]*vy2+proj[8]*vz2+proj[12]*vw2;
        const py2=proj[1]*vx2+proj[5]*vy2+proj[9]*vz2+proj[13]*vw2;
        const pw2=proj[3]*vx2+proj[7]*vy2+proj[11]*vz2+proj[15]*vw2;
        if(Math.abs(pw2)<0.001) return null;
        return [(px2/pw2*0.5+0.5)*W, (1-(py2/pw2*0.5+0.5))*H];
      }
      for(const [cname, lines] of CONSTELLATIONS) {
        ctx.beginPath();
        let drew = false;
        for(const [fid,tid] of lines) {
          const fs=STAR_BY_ID[fid], ts=STAR_BY_ID[tid];
          if(!fs||!ts) continue;
          const fp=project3d(fs[2]/100,fs[3]/100,fs[4]/100);
          const tp=project3d(ts[2]/100,ts[3]/100,ts[4]/100);
          if(!fp||!tp) continue;
          ctx.moveTo(fp[0],fp[1]);
          ctx.lineTo(tp[0],tp[1]);
          drew = true;
        }
        if(drew) ctx.stroke();
        // Constellation label at centroid
        if(drew && showLabels) {
          let sx=0,sy=0,n=0;
          for(const [fid,tid] of lines) {
            const fs=STAR_BY_ID[fid];
            if(fs){const p=project3d(fs[2]/100,fs[3]/100,fs[4]/100);if(p){sx+=p[0];sy+=p[1];n++}}
          }
          if(n>0) {
            ctx.font = `${9*devicePixelRatio}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.fillStyle = 'rgba(72,72,160,0.35)';
            ctx.fillText(cname, sx/n, sy/n - 12*devicePixelRatio);
          }
        }
      }
    }

    // Star glow for bright objects (magnitude < 1)
    for(const v of visible) {
      if(v.size < 4) continue;
      const cx2=v.x-eyeX, cy2=v.y-eyeY, cz2=v.z-eyeZ;
      const vx3=view[0]*cx2+view[4]*cy2+view[8]*cz2+view[12];
      const vy3=view[1]*cx2+view[5]*cy2+view[9]*cz2+view[13];
      const vz3=view[2]*cx2+view[6]*cy2+view[10]*cz2+view[14];
      const vw3=view[3]*cx2+view[7]*cy2+view[11]*cz2+view[15];
      if(vz3>0) continue;
      const px3=proj[0]*vx3+proj[4]*vy3+proj[8]*vz3+proj[12]*vw3;
      const py3=proj[1]*vx3+proj[5]*vy3+proj[9]*vz3+proj[13]*vw3;
      const pw3=proj[3]*vx3+proj[7]*vy3+proj[11]*vz3+proj[15]*vw3;
      if(Math.abs(pw3)<0.001) continue;
      const gx=(px3/pw3*0.5+0.5)*W, gy=(1-(py3/pw3*0.5+0.5))*H;
      if(gx<0||gx>W||gy<0||gy>H) continue;
      const gr = v.size * 3 * devicePixelRatio;
      const grad = ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
      const cr=Math.round(v.r*255), cg=Math.round(v.g*255), cb=Math.round(v.b*255);
      grad.addColorStop(0, `rgba(${cr},${cg},${cb},0.6)`);
      grad.addColorStop(0.5, `rgba(${cr},${cg},${cb},0.15)`);
      grad.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(gx,gy,gr,0,Math.PI*2);
      ctx.fill();
    }

    // Deep-sky object icons
    ctx.font = `${11*devicePixelRatio}px ${getComputedStyle(document.body).fontFamily}`;
    for(const v of visible) {
      if(v.kind==='Star') continue;
      const cx3=v.x-eyeX, cy3=v.y-eyeY, cz3=v.z-eyeZ;
      const vx4=view[0]*cx3+view[4]*cy3+view[8]*cz3+view[12];
      const vy4=view[1]*cx3+view[5]*cy3+view[9]*cz3+view[13];
      const vz4=view[2]*cx3+view[6]*cy3+view[10]*cz3+view[14];
      const vw4=view[3]*cx3+view[7]*cy3+view[11]*cz3+view[15];
      if(vz4>0) continue;
      const px4=proj[0]*vx4+proj[4]*vy4+proj[8]*vz4+proj[12]*vw4;
      const py4=proj[1]*vx4+proj[5]*vy4+proj[9]*vz4+proj[13]*vw4;
      const pw4=proj[3]*vx4+proj[7]*vy4+proj[11]*vz4+proj[15]*vw4;
      if(Math.abs(pw4)<0.001) continue;
      const dx2=(px4/pw4*0.5+0.5)*W, dy2=(1-(py4/pw4*0.5+0.5))*H;
      if(dx2<0||dx2>W||dy2<0||dy2>H) continue;
      let icon='?', col='rgba(123,97,255,0.7)';
      if(v.kind==='Galaxy'){icon='@';col='rgba(123,97,255,0.7)'}
      else if(v.kind==='Nebula'){icon='~';col='rgba(0,212,255,0.7)'}
      else if(v.kind==='Cluster'){icon='+';col='rgba(40,200,64,0.7)'}
      else if(v.kind==='Black Hole'){icon='O';col='rgba(255,95,87,0.8)'}
      ctx.fillStyle = col;
      ctx.fillText(icon, dx2-5*devicePixelRatio, dy2+4*devicePixelRatio);
    }

    // FPS
    frames++;
    const now = performance.now();
    if(now-lastT > 1000) {
      document.getElementById('fps').textContent = frames+' fps';
      frames=0; lastT=now;
    }

    // HUD
    document.getElementById('hud-pos').textContent =
      Math.round(cam.fx)+', '+Math.round(cam.fy)+', '+Math.round(cam.fz)+' (pc/10)';
    document.getElementById('hud-dist').textContent = 'Orbit: '+Math.round(cam.dist)+' pc/10';

    requestAnimationFrame(frame);
  }
  rebuildStarData();
  requestAnimationFrame(frame);

  // Input handling
  canvas.addEventListener('mousedown', e => { dragging=true; lastMx=e.clientX; lastMy=e.clientY; });
  window.addEventListener('mouseup', () => dragging=false);
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    cam.yaw += (e.clientX-lastMx)*0.3;
    cam.pitch = Math.max(-89,Math.min(89, cam.pitch+(e.clientY-lastMy)*0.3));
    lastMx=e.clientX; lastMy=e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    cam.dist = Math.max(1, Math.min(1e10, cam.dist * (1+e.deltaY*0.001)));
  }, {passive:false});
  window.addEventListener('keydown', e => {
    keys[e.key]=true;
    if(e.key==='l'||e.key==='L'){showLabels=!showLabels;document.getElementById('btn-labels').classList.toggle('active')}
    if(e.key==='g'||e.key==='G'){showGrid=!showGrid;document.getElementById('btn-grid').classList.toggle('active')}
    if(e.key==='c'||e.key==='C'){showLines=!showLines;document.getElementById('btn-constellations').classList.toggle('active')}
    if(e.key>='1'&&e.key<='6') magLimit=[500,1500,2500,3500,5000,8000][e.key-'1'];
    if(e.key==='='||e.key==='+') cam.speed=Math.min(cam.speed*2,1e8);
    if(e.key==='-') cam.speed=Math.max(cam.speed/2,1);
    if(e.key==='f'||e.key==='F') {
      if(selected>=0) {
        const s = STAR_BY_ID[selected];
        if(s) { flyTo(s); }
      }
    }
  });
  window.addEventListener('keyup', e => keys[e.key]=false);

  // Fly-to helper
  function flyTo(s) {
    cam.fx=s[2]/100; cam.fy=s[3]/100; cam.fz=s[4]/100;
    const d = Math.sqrt(s[2]*s[2]+s[3]*s[3]+s[4]*s[4]);
    cam.dist = Math.max(10, d/500);
    if(cam.dist < 1) cam.dist = 100;
    selected = s[0];
    document.getElementById('hud-target').textContent = 'Target: '+s[1];
    showInfo(s);
  }

  // Click to select nearest star
  canvas.addEventListener('click', e => {
    const rect=canvas.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*devicePixelRatio;
    const my=(e.clientY-rect.top)*devicePixelRatio;
    const W2=canvas.width, H2=canvas.height;
    const yr2=cam.yaw*Math.PI/180, pr2=cam.pitch*Math.PI/180;
    const eX2=cam.fx+cam.dist*Math.sin(yr2)*Math.cos(pr2);
    const eY2=cam.fy-cam.dist*Math.sin(pr2);
    const eZ2=cam.fz+cam.dist*Math.cos(yr2)*Math.cos(pr2);
    let bestS=null, bestD=40*devicePixelRatio;
    for(const s of STARS) {
      if(s[5]>magLimit) continue;
      const wx=s[2]/100,wy=s[3]/100,wz=s[4]/100;
      const cx4=wx-eX2,cy4=wy-eY2,cz4=wz-eZ2;
      const v2=view; const p2=proj;
      const vx5=v2[0]*cx4+v2[4]*cy4+v2[8]*cz4+v2[12];
      const vy5=v2[1]*cx4+v2[5]*cy4+v2[9]*cz4+v2[13];
      const vz5=v2[2]*cx4+v2[6]*cy4+v2[10]*cz4+v2[14];
      const vw5=v2[3]*cx4+v2[7]*cy4+v2[11]*cz4+v2[15];
      if(vz5>0) continue;
      const px5=p2[0]*vx5+p2[4]*vy5+p2[8]*vz5+p2[12]*vw5;
      const py5=p2[1]*vx5+p2[5]*vy5+p2[9]*vz5+p2[13]*vw5;
      const pw5=p2[3]*vx5+p2[7]*vy5+p2[11]*vz5+p2[15]*vw5;
      if(Math.abs(pw5)<0.001) continue;
      const sx2=(px5/pw5*0.5+0.5)*W2;
      const sy2=(1-(py5/pw5*0.5+0.5))*H2;
      const dd=Math.hypot(sx2-mx,sy2-my);
      if(dd<bestD){bestD=dd;bestS=s}
    }
    if(bestS){selected=bestS[0];showInfo(bestS);document.getElementById('hud-target').textContent='Target: '+bestS[1]}
  });

  // Double-click to fly to
  canvas.addEventListener('dblclick', e => {
    if(selected>=0) { const s=STAR_BY_ID[selected]; if(s) flyTo(s); }
  });

  // Button handlers
  document.getElementById('btn-labels').addEventListener('click', () => {showLabels=!showLabels;document.getElementById('btn-labels').classList.toggle('active')});
  document.getElementById('btn-grid').addEventListener('click', () => {showGrid=!showGrid;document.getElementById('btn-grid').classList.toggle('active')});
  document.getElementById('btn-constellations').addEventListener('click', () => {showLines=!showLines;document.getElementById('btn-constellations').classList.toggle('active')});
  document.getElementById('btn-catalog').addEventListener('click', () => {
    const panel = document.getElementById('catalog-panel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')) buildCatalog();
  });
  document.getElementById('info-close').addEventListener('click', () => {
    document.getElementById('info-panel').classList.remove('open');
  });

  function dsoIcon(kind) {
    if(kind.includes('Galaxy')) return '@';
    if(kind.includes('Nebula')) return '~';
    if(kind.includes('Cluster')) return '+';
    if(kind.includes('Quasar')) return '!';
    if(kind.includes('Black')) return 'O';
    if(kind.includes('Supernova')) return '#';
    return '?';
  }

  function buildCatalog() {
    const list = document.getElementById('cat-list');
    list.innerHTML = '';
    // Named stars first
    const named = STARS.filter(s => s[1] && s[7] === 'Star').sort((a,b) => a[5]-b[5]);
    const dsos = STARS.filter(s => s[7] !== 'Star').sort((a,b) => a[5]-b[5]);
    const addSection = (title) => {
      const h = document.createElement('div');
      h.style.cssText = 'padding:6px 8px 2px;font-size:0.5em;letter-spacing:0.1em;color:var(--dim);border-bottom:1px solid var(--border)';
      h.textContent = title;
      list.appendChild(h);
    };
    const addItem = (s) => {
      const div = document.createElement('div');
      div.className = 'cat-item';
      const icon = s[7]==='Star' ? '*' : dsoIcon(s[7]);
      div.innerHTML = `<span class="icon">${icon}</span><span class="nm">${s[1]}</span><span class="mag">${(s[5]/1000).toFixed(1)}</span>`;
      div.addEventListener('click', () => flyTo(s));
      list.appendChild(div);
    };
    addSection(`NAMED STARS (${named.length})`);
    for(const s of named) addItem(s);
    addSection(`DEEP SKY (${dsos.length})`);
    for(const s of dsos) addItem(s);
  }

  function showInfo(s) {
    const body = document.getElementById('info-body');
    const isDSO = s[7] !== 'Star';
    const desc = s.length > 9 ? s[9] : '';
    body.innerHTML = `
      <div class="info-name">${s[1] || '(unnamed)'}</div>
      <div class="info-kind">${s[7]}</div>
      <div class="info-row"><span class="info-label">Magnitude</span><span class="info-value">${(s[5]/1000).toFixed(2)}</span></div>
      <div class="info-row"><span class="info-label">Constellation</span><span class="info-value">${s[8]}</span></div>
      ${isDSO ? '' : `<div class="info-row"><span class="info-label">B-V Index</span><span class="info-value">${(s[6]/1000).toFixed(2)}</span></div>`}
      ${isDSO ? '' : `<div class="info-row"><span class="info-label">Spectral</span><span class="info-value">${SPECT_NAMES[s[6]] || '?'}</span></div>`}
      <div class="info-row"><span class="info-label">Distance</span><span class="info-value">${formatDist(s)}</span></div>
      <div class="info-row"><span class="info-label">Position</span><span class="info-value">${(s[2]/1000).toFixed(1)}, ${(s[3]/1000).toFixed(1)}, ${(s[4]/1000).toFixed(1)} pc</span></div>
      ${desc ? `<div class="info-desc">${desc}</div>` : ''}
    `;
    document.getElementById('info-panel').classList.add('open');
    document.getElementById('btn-fly-to').onclick = () => flyTo(s);
  }

  // Search with Enter to fly
  const searchEl = document.getElementById('search');
  searchEl.addEventListener('keydown', e => {
    if(e.key==='Enter') {
      const q = searchEl.value.toLowerCase().trim();
      if(q.length < 1) return;
      const match = STARS.find(s => s[1].toLowerCase().includes(q));
      if(match) flyTo(match);
      e.preventDefault();
    }
  });
  searchEl.addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    if(q.length < 2) return;
    const matches = STARS.filter(s => s[1].toLowerCase().includes(q)).slice(0,8);
    if(matches.length === 1) {
      selected = matches[0][0];
      showInfo(matches[0]);
    }
  });
}

main().catch(e => { console.error(e); document.getElementById('error').style.display='block'; document.getElementById('error').textContent='Error: '+e.message; });
</script>
</body>
</html>
