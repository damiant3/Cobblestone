<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Globe</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020210;--surface:#08081a;--panel:#0c0c22;--border:#1a1a3e;--text:#c8c8e0;--dim:#4848a0;--accent:#00d4ff;--accent2:#7b61ff;--warn:#ff5f57;--green:#28c840;--font:'Cascadia Code','JetBrains Mono','Fira Code',monospace}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;cursor:grab}
body.dragging{cursor:grabbing}
.app{display:flex;flex-direction:column;height:100vh}
.header{height:32px;display:flex;align-items:center;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.logo{font-size:0.75em;font-weight:300;letter-spacing:0.2em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sep{width:1px;height:16px;background:var(--border)}
.hdr-btn{padding:3px 8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:var(--font);font-size:0.52em;cursor:pointer;border-radius:3px;transition:0.1s}
.hdr-btn:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.hdr-btn.active{color:var(--accent);border-color:var(--accent);background:rgba(0,212,255,0.06)}
.hdr-btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.hdr-btn .dot.on{background:var(--green)}
.hdr-btn .dot.off{background:var(--dim)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:0.52em;color:var(--dim)}
.main{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#error{color:var(--warn);padding:2em;text-align:center;display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10}
.hud{position:absolute;bottom:10px;left:12px;font-size:0.52em;color:var(--dim);line-height:1.7;pointer-events:none}
.hud-right{position:absolute;bottom:10px;right:12px;font-size:0.48em;color:var(--dim);text-align:right;line-height:1.5;pointer-events:none}
.overlay-panel{position:absolute;top:8px;right:8px;width:200px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 0;font-size:0.55em;z-index:5}
.ov-title{padding:2px 10px 4px;color:var(--dim);letter-spacing:0.1em;font-size:0.9em;border-bottom:1px solid var(--border)}
.ov-item{display:flex;align-items:center;gap:6px;padding:4px 10px;cursor:pointer;transition:0.08s}
.ov-item:hover{background:rgba(255,255,255,0.03)}
.ov-item.active{color:var(--accent)}
.ov-toggle{width:10px;height:10px;border-radius:50%;border:1px solid var(--dim);flex-shrink:0}
.ov-item.active .ov-toggle{background:var(--accent);border-color:var(--accent)}
.ov-label{flex:1}
.ov-count{color:var(--dim);font-size:0.85em}
.info-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px 20px;font-size:0.6em;display:none;z-index:20;min-width:200px;max-width:320px}
.info-popup h3{color:var(--accent);margin-bottom:8px;font-size:1.1em}
.info-popup .row{display:flex;justify-content:space-between;padding:2px 0}
.info-popup .lbl{color:var(--dim)}
.info-popup .close{position:absolute;top:6px;right:10px;cursor:pointer;color:var(--dim);font-size:1.2em;background:none;border:none}
.info-popup .close:hover{color:var(--warn)}
.zoom-ctrl{position:absolute;bottom:60px;right:12px;display:flex;flex-direction:column;gap:2px;z-index:5}
.zoom-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);color:var(--dim);font-size:0.7em;cursor:pointer;border-radius:4px}
.zoom-btn:hover{color:var(--text);border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="logo">CODEX GLOBE</span>
    <div class="hdr-sep"></div>
    <button class="hdr-btn active" id="btn-grid">Grid</button>
    <button class="hdr-btn active" id="btn-labels">Labels</button>
    <button class="hdr-btn active" id="btn-rotate">Rotate</button>
    <div class="hdr-sep"></div>
    <button class="hdr-btn" id="btn-goto">Go To...</button>
    <div class="hdr-right">
      <span id="status">initializing...</span>
      <span id="fps">-- fps</span>
    </div>
  </div>
  <div class="main">
    <canvas id="viewport"></canvas>
    <div id="error">WebGPU not available</div>
    <div class="overlay-panel" id="overlays">
      <div class="ov-title">DATA OVERLAYS</div>
    </div>
    <div class="hud" id="hud">
      <div id="hud-lat">Lat: 0.0</div>
      <div id="hud-lon">Lon: 0.0</div>
      <div id="hud-alt">Alt: 25,000 km</div>
    </div>
    <div class="hud-right">
      Drag to orbit &middot; Scroll to zoom<br>
      Click data point for details
    </div>
    <div class="zoom-ctrl">
      <button class="zoom-btn" id="zoom-in">+</button>
      <button class="zoom-btn" id="zoom-out">-</button>
      <button class="zoom-btn" id="zoom-home">H</button>
    </div>
    <div class="info-popup" id="info-popup">
      <button class="close" id="info-close">&times;</button>
      <div id="info-content"></div>
    </div>
  </div>
</div>
<script>
// Codex Globe — WebGPU Earth renderer with live data overlays
// Data sources:
//   Aircraft: OpenSky Network (opensky-network.org) CC BY-NC-SA
//   Earthquakes: USGS (earthquake.usgs.gov) public domain
//   Weather: Open-Meteo (open-meteo.com) CC BY 4.0
//   ISS: Open Notify (open-notify.org)

const canvas = document.getElementById('viewport');
const R = 6.371; // Earth radius in render units
let cam = {lat:30, lon:0, dist:25, autoRotate:true};
let showGrid=true, showLabels=true;
let dragging=false, lastX=0, lastY=0;
let overlayData = {aircraft:[],earthquakes:[],weather:[],iss:null,wildfires:[],storms:[],volcanoes:[],fireballs:[],solarFlares:[],buoys:[]};
let overlays = [
  {id:'aircraft', label:'Aircraft',    icon:'^', active:false, count:0, interval:15000, color:'#febc2e'},
  {id:'earthquakes',label:'Earthquakes',icon:'!', active:false, count:0, interval:300000,color:'#ff5f57'},
  {id:'weather',  label:'Temperature', icon:'T', active:false, count:0, interval:600000,color:'#00d4ff'},
  {id:'iss',      label:'ISS Tracker', icon:'S', active:true,  count:0, interval:5000,  color:'#28c840'},
  {id:'wind',     label:'Wind',        icon:'~', active:false, count:0, interval:600000,color:'#7b61ff'},
  {id:'wildfires',label:'Wildfires',   icon:'F', active:false, count:0, interval:300000,color:'#ff6b2b'},
  {id:'storms',   label:'Storms',      icon:'S', active:false, count:0, interval:600000,color:'#cc44ff'},
  {id:'volcanoes',label:'Volcanoes',   icon:'V', active:false, count:0, interval:3600000,color:'#ff2222'},
  {id:'fireballs',label:'Fireballs',   icon:'B', active:false, count:0, interval:3600000,color:'#ffaa00'},
  {id:'solarFlares',label:'Solar Flares',icon:'X',active:false, count:0, interval:600000,color:'#ffdd00'},
  {id:'buoys',    label:'Ocean Buoys', icon:'W', active:false, count:0, interval:1800000,color:'#00ccaa'},
];

// --- Sphere geometry ---
function buildSphere(latSegs, lonSegs) {
  const verts = [], indices = [];
  for (let lat = 0; lat <= latSegs; lat++) {
    const theta = lat * Math.PI / latSegs;
    const sinT = Math.sin(theta), cosT = Math.cos(theta);
    for (let lon = 0; lon <= lonSegs; lon++) {
      const phi = lon * 2 * Math.PI / lonSegs;
      const x = sinT * Math.cos(phi), y = cosT, z = sinT * Math.sin(phi);
      const u = lon / lonSegs, v = lat / latSegs;
      verts.push(x*R, y*R, z*R, x, y, z, u, v); // pos(3) normal(3) uv(2)
    }
  }
  for (let lat = 0; lat < latSegs; lat++) {
    for (let lon = 0; lon < lonSegs; lon++) {
      const a = lat*(lonSegs+1)+lon, b = a+lonSegs+1;
      indices.push(a, b, a+1, b, b+1, a+1);
    }
  }
  return {verts: new Float32Array(verts), indices: new Uint32Array(indices)};
}

// Procedural Earth color from lat/lon (rough land/ocean)
function earthColor(u, v) {
  const lat = (0.5 - v) * 180, lon = (u - 0.5) * 360;
  // Very rough continent detection
  const isLand = (
    (lat > 10 && lat < 70 && lon > -130 && lon < -60) || // N America
    (lat > -60 && lat < 15 && lon > -82 && lon < -34) || // S America
    (lat > 35 && lat < 72 && lon > -12 && lon < 50) ||   // Europe
    (lat > -38 && lat < 38 && lon > -20 && lon < 55) ||  // Africa
    (lat > 5 && lat < 75 && lon > 50 && lon < 150) ||    // Asia
    (lat > -45 && lat < -10 && lon > 112 && lon < 155) || // Australia
    (lat > -85 && lat < -60)                               // Antarctica
  );
  if (isLand) {
    if (lat < -60) return [0.9, 0.92, 0.95]; // ice
    if (lat > 60) return [0.2+Math.random()*0.05, 0.35+Math.random()*0.05, 0.15]; // tundra
    if (Math.abs(lat) < 25 && lon > -20 && lon < 55) return [0.7, 0.6, 0.35]; // sahara
    return [0.18+Math.random()*0.04, 0.32+Math.random()*0.04, 0.12]; // green land
  }
  // Ocean depth variation
  const depth = 0.5 + Math.sin(lat*0.1)*0.1 + Math.sin(lon*0.08)*0.05;
  return [0.02, 0.06*depth+0.04, 0.18*depth+0.08];
}

// Lat/lon to 3D position on sphere
function geoTo3D(lat, lon, alt) {
  const r = R + (alt || 0);
  const latR = lat * Math.PI / 180, lonR = lon * Math.PI / 180;
  return [r*Math.cos(latR)*Math.cos(lonR), r*Math.sin(latR), r*Math.cos(latR)*Math.sin(lonR)];
}

// --- Data fetching ---
async function fetchAircraft() {
  try {
    const r = await fetch('https://opensky-network.org/api/states/all');
    const j = await r.json();
    if (!j.states) return;
    overlayData.aircraft = j.states.slice(0, 2000).filter(s => s[5] && s[6]).map(s => ({
      callsign: (s[1]||'').trim(), lon: s[5], lat: s[6], alt: (s[7]||10000)/1000,
      heading: s[10]||0, speed: s[9]||0, origin: s[2]||''
    }));
    overlays[0].count = overlayData.aircraft.length;
  } catch(e) { console.warn('Aircraft fetch failed:', e.message); }
}

async function fetchEarthquakes() {
  try {
    const r = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson');
    const j = await r.json();
    overlayData.earthquakes = j.features.map(f => ({
      lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1],
      depth: f.geometry.coordinates[2], mag: f.properties.mag || 0,
      place: f.properties.place || '', time: f.properties.time || 0
    }));
    overlays[1].count = overlayData.earthquakes.length;
  } catch(e) { console.warn('Earthquake fetch failed:', e.message); }
}

async function fetchWeather() {
  const cities = [
    [35.69,139.69,'Tokyo'],[28.61,77.21,'Delhi'],[40.71,-74.01,'New York'],
    [51.51,-0.13,'London'],[-33.87,151.21,'Sydney'],[55.76,37.62,'Moscow'],
    [48.86,2.35,'Paris'],[19.43,-99.13,'Mexico City'],[-23.55,-46.63,'Sao Paulo'],
    [30.04,31.24,'Cairo'],[39.90,116.41,'Beijing'],[37.57,126.98,'Seoul'],
    [-34.60,-58.38,'Buenos Aires'],[-1.29,36.82,'Nairobi'],[13.76,100.50,'Bangkok'],
    [1.35,103.82,'Singapore'],[25.20,55.27,'Dubai'],[52.52,13.41,'Berlin'],
    [61.22,-149.90,'Anchorage'],[64.15,-21.94,'Reykjavik'],
    [-33.93,18.42,'Cape Town'],[-36.85,174.76,'Auckland'],
    [21.31,-157.86,'Honolulu'],[43.65,-79.38,'Toronto']
  ];
  try {
    const results = [];
    // Fetch a few at a time to not hammer the API
    for (const [lat,lon,name] of cities) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,wind_direction_10m`;
        const r = await fetch(url);
        const j = await r.json();
        if (j.current) {
          results.push({lat, lon, name, temp:j.current.temperature_2m, windSpeed:j.current.wind_speed_10m, windDir:j.current.wind_direction_10m});
        }
      } catch(e) {}
    }
    overlayData.weather = results;
    overlays[2].count = results.length;
    overlays[4].count = results.length; // wind uses same data
  } catch(e) { console.warn('Weather fetch failed:', e.message); }
}

async function fetchISS() {
  try {
    const r = await fetch('http://api.open-notify.org/iss-now.json');
    const j = await r.json();
    if (j.iss_position) {
      overlayData.iss = {lat: parseFloat(j.iss_position.latitude), lon: parseFloat(j.iss_position.longitude), alt: 0.408};
      overlays[3].count = 1;
    }
  } catch(e) {
    // CORS might block this, use fallback
    try {
      const r2 = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
      const j2 = await r2.json();
      overlayData.iss = {lat: j2.latitude, lon: j2.longitude, alt: j2.altitude/6371};
      overlays[3].count = 1;
    } catch(e2) { console.warn('ISS fetch failed:', e2.message); }
  }
}

async function fetchEONET(category, key, overlayIdx) {
  try {
    const r = await fetch(`https://eonet.gsfc.nasa.gov/api/v3/events?category=${category}&status=open&limit=200`);
    const j = await r.json();
    const points = [];
    for (const ev of (j.events || [])) {
      for (const geo of (ev.geometry || [])) {
        if (geo.coordinates && geo.coordinates.length >= 2) {
          points.push({lon:geo.coordinates[0], lat:geo.coordinates[1], title:ev.title||'', date:geo.date||'', source:(ev.sources&&ev.sources[0])?ev.sources[0].id:''});
        }
      }
    }
    overlayData[key] = points;
    overlays[overlayIdx].count = points.length;
  } catch(e) { console.warn(category+' fetch failed:', e.message); }
}
async function fetchWildfires() { await fetchEONET('wildfires', 'wildfires', 5); }
async function fetchStorms() { await fetchEONET('severeStorms', 'storms', 6); }
async function fetchVolcanoes() { await fetchEONET('volcanoes', 'volcanoes', 7); }

async function fetchFireballs() {
  try {
    const r = await fetch('https://ssd-api.jpl.nasa.gov/fireball.api?limit=100');
    const j = await r.json();
    overlayData.fireballs = (j.data||[]).filter(d=>d[3]&&d[5]).map(d => {
      let lat = parseFloat(d[3]); if(d[4]==='S') lat=-lat;
      let lon = parseFloat(d[5]); if(d[6]==='W') lon=-lon;
      return {lat,lon,date:d[0],energy:parseFloat(d[1])||0,vel:parseFloat(d[8])||0,alt:parseFloat(d[7])||0};
    });
    overlays[8].count = overlayData.fireballs.length;
  } catch(e) { console.warn('Fireball fetch failed:', e.message); }
}

async function fetchSolarFlares() {
  try {
    const d = new Date(); const end = d.toISOString().slice(0,10);
    d.setDate(d.getDate()-30); const start = d.toISOString().slice(0,10);
    const r = await fetch(`https://api.nasa.gov/DONKI/FLR?startDate=${start}&endDate=${end}&api_key=DEMO_KEY`);
    const j = await r.json();
    overlayData.solarFlares = (j||[]).map(f => ({
      classType:f.classType||'?', peakTime:f.peakTime||'', region:f.activeRegionNum||0,
      location:f.sourceLocation||''
    }));
    overlays[9].count = overlayData.solarFlares.length;
  } catch(e) { console.warn('Solar flare fetch failed:', e.message); }
}

async function fetchBuoys() {
  try {
    const r = await fetch('https://www.ndbc.noaa.gov/data/latest_obs/latest_obs.txt');
    const txt = await r.text();
    const lines = txt.split('\n').slice(2); // skip header lines
    const buoys = [];
    for (const line of lines) {
      const p = line.trim().split(/\s+/);
      if (p.length < 18) continue;
      const lat = parseFloat(p[1]), lon = parseFloat(p[2]);
      if (isNaN(lat)||isNaN(lon)) continue;
      const wspd = p[7]==='MM'?null:parseFloat(p[7]);
      const wvht = p[9]==='MM'?null:parseFloat(p[9]);
      const atmp = p[14]==='MM'?null:parseFloat(p[14]);
      const wtmp = p[15]==='MM'?null:parseFloat(p[15]);
      buoys.push({id:p[0],lat,lon,windSpeed:wspd,waveHeight:wvht,airTemp:atmp,waterTemp:wtmp});
    }
    overlayData.buoys = buoys.slice(0,500);
    overlays[10].count = overlayData.buoys.length;
  } catch(e) { console.warn('Buoy fetch failed:', e.message); }
}

const FETCH_MAP = {aircraft:fetchAircraft, earthquakes:fetchEarthquakes, weather:fetchWeather, iss:fetchISS, wind:fetchWeather, wildfires:fetchWildfires, storms:fetchStorms, volcanoes:fetchVolcanoes, fireballs:fetchFireballs, solarFlares:fetchSolarFlares, buoys:fetchBuoys};

// Overlay data refresh manager
const fetchTimers = {};
function startOverlayFetches() {
  for (const ov of overlays) {
    if (fetchTimers[ov.id]) clearInterval(fetchTimers[ov.id]);
    const fetchFn = FETCH_MAP[ov.id];
    if (!fetchFn) continue;
    if (ov.active) { fetchFn(); fetchTimers[ov.id] = setInterval(fetchFn, ov.interval); }
  }
}

// --- Build overlay panel UI ---
function buildOverlayPanel() {
  const panel = document.getElementById('overlays');
  panel.innerHTML = '<div class="ov-title">DATA OVERLAYS</div>';
  overlays.forEach((ov, i) => {
    const div = document.createElement('div');
    div.className = 'ov-item' + (ov.active ? ' active' : '');
    div.innerHTML = `<div class="ov-toggle"></div><span class="ov-label">${ov.label}</span><span class="ov-count" id="ov-count-${ov.id}"></span>`;
    div.addEventListener('click', () => {
      ov.active = !ov.active;
      div.classList.toggle('active');
      const fetchFn = FETCH_MAP[ov.id];
      if (ov.active && fetchFn) { fetchFn(); fetchTimers[ov.id] = setInterval(fetchFn, ov.interval); }
      else if (fetchTimers[ov.id]) { clearInterval(fetchTimers[ov.id]); fetchTimers[ov.id] = null; }
    });
    panel.appendChild(div);
  });
}

// --- WebGPU init and render ---
async function main() {
  if (!navigator.gpu) { document.getElementById('error').style.display='block'; return; }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { document.getElementById('error').style.display='block'; return; }
  const device = await adapter.requestDevice();
  const gpuCtx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
    gpuCtx.configure({device, format, alphaMode:'premultiplied'});
  }
  resize();
  window.addEventListener('resize', resize);

  // 2D overlay
  const overlay = document.createElement('canvas');
  overlay.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3';
  canvas.parentElement.appendChild(overlay);
  const ctx = overlay.getContext('2d');

  // Build sphere
  const sphere = buildSphere(64, 128);

  // Bake vertex colors from procedural Earth texture
  const vertCount = sphere.verts.length / 8;
  const coloredVerts = new Float32Array(vertCount * 9); // pos(3) normal(3) color(3)
  for (let i = 0; i < vertCount; i++) {
    const u = sphere.verts[i*8+6], v = sphere.verts[i*8+7];
    const [cr,cg,cb] = earthColor(u, v);
    coloredVerts[i*9]   = sphere.verts[i*8];
    coloredVerts[i*9+1] = sphere.verts[i*8+1];
    coloredVerts[i*9+2] = sphere.verts[i*8+2];
    coloredVerts[i*9+3] = sphere.verts[i*8+3];
    coloredVerts[i*9+4] = sphere.verts[i*8+4];
    coloredVerts[i*9+5] = sphere.verts[i*8+5];
    coloredVerts[i*9+6] = cr;
    coloredVerts[i*9+7] = cg;
    coloredVerts[i*9+8] = cb;
  }

  const vertBuf = device.createBuffer({size:coloredVerts.byteLength,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST,mappedAtCreation:true});
  new Float32Array(vertBuf.getMappedRange()).set(coloredVerts);
  vertBuf.unmap();
  const idxBuf = device.createBuffer({size:sphere.indices.byteLength,usage:GPUBufferUsage.INDEX|GPUBufferUsage.COPY_DST,mappedAtCreation:true});
  new Uint32Array(idxBuf.getMappedRange()).set(sphere.indices);
  idxBuf.unmap();

  const depthTex = device.createTexture({size:[canvas.width,canvas.height],format:'depth24plus',usage:GPUTextureUsage.RENDER_ATTACHMENT});

  const shaderSrc = `
struct Uniforms { mvp: mat4x4f, eyePos: vec3f, sunDir: vec3f };
@group(0) @binding(0) var<uniform> u: Uniforms;
struct VSOut { @builtin(position) pos: vec4f, @location(0) normal: vec3f, @location(1) color: vec3f, @location(2) worldPos: vec3f };
@vertex fn vs(@location(0) pos: vec3f, @location(1) normal: vec3f, @location(2) color: vec3f) -> VSOut {
  var o: VSOut;
  o.pos = u.mvp * vec4f(pos, 1.0);
  o.normal = normal;
  o.color = color;
  o.worldPos = pos;
  return o;
}
@fragment fn fs(in: VSOut) -> @location(0) vec4f {
  let N = normalize(in.normal);
  let L = normalize(u.sunDir);
  let diffuse = max(dot(N, L), 0.0);
  let ambient = 0.08;
  let nightGlow = max(-dot(N, L), 0.0) * 0.02;
  let atmo = pow(1.0 - abs(dot(N, normalize(u.eyePos - in.worldPos))), 3.0) * vec3f(0.1, 0.2, 0.5);
  let lit = in.color * (ambient + diffuse * 0.9) + atmo + vec3f(nightGlow * 0.3, nightGlow * 0.3, nightGlow);
  return vec4f(lit, 1.0);
}`;

  const module = device.createShaderModule({code:shaderSrc});
  const pipeline = device.createRenderPipeline({
    layout:'auto',
    vertex:{module,entryPoint:'vs',buffers:[{arrayStride:36,attributes:[
      {shaderLocation:0,offset:0,format:'float32x3'},
      {shaderLocation:1,offset:12,format:'float32x3'},
      {shaderLocation:2,offset:24,format:'float32x3'}]}]},
    fragment:{module,entryPoint:'fs',targets:[{format}]},
    primitive:{topology:'triangle-list',cullMode:'back'},
    depthStencil:{format:'depth24plus',depthWriteEnabled:true,depthCompare:'less'},
  });

  const uniformBuf = device.createBuffer({size:128,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  const bindGroup = device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:uniformBuf}}]});

  // Matrix helpers
  function perspective(fov, aspect, near, far) {
    const f=1/Math.tan(fov*Math.PI/360);
    return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)/(near-far),-1, 0,0,2*far*near/(near-far),0]);
  }
  function lookAt(eye, center, up) {
    const z=[eye[0]-center[0],eye[1]-center[1],eye[2]-center[2]];
    const zl=Math.hypot(...z); z[0]/=zl;z[1]/=zl;z[2]/=zl;
    const x=[up[1]*z[2]-up[2]*z[1],up[2]*z[0]-up[0]*z[2],up[0]*z[1]-up[1]*z[0]];
    const xl=Math.hypot(...x); x[0]/=xl;x[1]/=xl;x[2]/=xl;
    const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
    return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,
      -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),1]);
  }
  function mat4mul(a,b) {
    const o=new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++) o[j*4+i]=a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];
    return o;
  }

  let lastT = performance.now(), frames = 0;

  function project(eye, view, proj, W, H, lat, lon, alt) {
    const [wx,wy,wz] = geoTo3D(lat, lon, alt||0);
    const cx=wx-eye[0],cy=wy-eye[1],cz=wz-eye[2];
    const vx=view[0]*cx+view[4]*cy+view[8]*cz+view[12];
    const vy=view[1]*cx+view[5]*cy+view[9]*cz+view[13];
    const vz=view[2]*cx+view[6]*cy+view[10]*cz+view[14];
    const vw=view[3]*cx+view[7]*cy+view[11]*cz+view[15];
    if (vz > 0) return null;
    const px=proj[0]*vx+proj[4]*vy+proj[8]*vz+proj[12]*vw;
    const py=proj[1]*vx+proj[5]*vy+proj[9]*vz+proj[13]*vw;
    const pw=proj[3]*vx+proj[7]*vy+proj[11]*vz+proj[15]*vw;
    if(Math.abs(pw)<0.001) return null;
    const sx=(px/pw*0.5+0.5)*W, sy=(1-(py/pw*0.5+0.5))*H;
    return (sx>-50&&sx<W+50&&sy>-50&&sy<H+50) ? [sx,sy] : null;
  }

  function frame() {
    if (cam.autoRotate) cam.lon += 0.02;
    if (cam.lon > 180) cam.lon -= 360;

    const W=canvas.width, H=canvas.height;
    overlay.width=W; overlay.height=H;
    overlay.style.width=(W/devicePixelRatio)+'px';
    overlay.style.height=(H/devicePixelRatio)+'px';

    const latR=cam.lat*Math.PI/180, lonR=cam.lon*Math.PI/180;
    const eyeX=cam.dist*Math.cos(latR)*Math.cos(lonR);
    const eyeY=cam.dist*Math.sin(latR);
    const eyeZ=cam.dist*Math.cos(latR)*Math.sin(lonR);
    const eye=[eyeX,eyeY,eyeZ];
    const aspect=W/H||1;
    const proj=perspective(45,aspect,0.1,500);
    const view=lookAt(eye,[0,0,0],[0,1,0]);
    const mvp=mat4mul(view,proj);

    // Sun direction (roughly follows real sun position via time)
    const now = Date.now()/86400000*Math.PI*2;
    const sunDir = [Math.cos(now), 0.3, Math.sin(now)];
    const sl = Math.hypot(...sunDir); sunDir[0]/=sl; sunDir[1]/=sl; sunDir[2]/=sl;

    // Upload uniforms: mvp(64) + eye(12+pad4) + sun(12+pad4) = 96
    const uniforms = new Float32Array(32);
    uniforms.set(mvp, 0);
    uniforms[16]=eyeX; uniforms[17]=eyeY; uniforms[18]=eyeZ; uniforms[19]=0;
    uniforms[20]=sunDir[0]; uniforms[21]=sunDir[1]; uniforms[22]=sunDir[2]; uniforms[23]=0;
    device.queue.writeBuffer(uniformBuf, 0, uniforms);

    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments:[{view:gpuCtx.getCurrentTexture().createView(),clearValue:{r:0.008,g:0.008,b:0.025,a:1},loadOp:'clear',storeOp:'store'}],
      depthStencilAttachment:{view:depthTex.createView(),depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'store'}
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.setVertexBuffer(0, vertBuf);
    pass.setIndexBuffer(idxBuf, 'uint32');
    pass.drawIndexed(sphere.indices.length);
    pass.end();
    device.queue.submit([encoder.finish()]);

    // 2D overlay
    ctx.clearRect(0,0,W,H);
    const dpr = devicePixelRatio;

    // Data overlays
    if (overlays[0].active && overlayData.aircraft.length > 0) {
      ctx.font = `${7*dpr}px ${getComputedStyle(document.body).fontFamily}`;
      for (const a of overlayData.aircraft) {
        const p = project(eye, view, proj, W, H, a.lat, a.lon, a.alt*0.001);
        if (!p) continue;
        ctx.fillStyle = 'rgba(254,188,46,0.8)';
        const hr = (a.heading||0)*Math.PI/180;
        ctx.save(); ctx.translate(p[0],p[1]); ctx.rotate(hr);
        ctx.beginPath(); ctx.moveTo(0,-4*dpr); ctx.lineTo(-2.5*dpr,3*dpr); ctx.lineTo(2.5*dpr,3*dpr); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    if (overlays[1].active && overlayData.earthquakes.length > 0) {
      for (const eq of overlayData.earthquakes) {
        const p = project(eye, view, proj, W, H, eq.lat, eq.lon);
        if (!p) continue;
        const sz = Math.max(2, Math.min(16, eq.mag * 2.5)) * dpr;
        const age = (Date.now() - eq.time) / 3600000;
        const alpha = Math.max(0.2, 1 - age/24);
        ctx.beginPath(); ctx.arc(p[0],p[1],sz,0,Math.PI*2);
        ctx.fillStyle = eq.mag >= 5 ? `rgba(255,95,87,${alpha})` : eq.mag >= 3 ? `rgba(255,180,50,${alpha})` : `rgba(100,200,255,${alpha})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${alpha*0.3})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        if (eq.mag >= 4) {
          ctx.font = `${8*dpr}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = `rgba(255,255,255,${alpha*0.6})`;
          ctx.fillText(`M${eq.mag.toFixed(1)}`, p[0]+sz+2*dpr, p[1]+3*dpr);
        }
      }
    }

    if (overlays[2].active && overlayData.weather.length > 0) {
      ctx.font = `bold ${9*dpr}px ${getComputedStyle(document.body).fontFamily}`;
      for (const w of overlayData.weather) {
        const p = project(eye, view, proj, W, H, w.lat, w.lon);
        if (!p) continue;
        const t = w.temp;
        const col = t < 0 ? '100,180,255' : t < 15 ? '120,220,180' : t < 30 ? '255,220,80' : '255,100,60';
        ctx.fillStyle = `rgba(${col},0.9)`;
        ctx.fillText(`${Math.round(t)}°`, p[0]-6*dpr, p[1]-6*dpr);
        if (showLabels) {
          ctx.font = `${6*dpr}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = 'rgba(200,200,224,0.4)';
          ctx.fillText(w.name, p[0]-6*dpr, p[1]+8*dpr);
          ctx.font = `bold ${9*dpr}px ${getComputedStyle(document.body).fontFamily}`;
        }
      }
    }

    if (overlays[4].active && overlayData.weather.length > 0) {
      for (const w of overlayData.weather) {
        if (!w.windSpeed) continue;
        const p = project(eye, view, proj, W, H, w.lat, w.lon);
        if (!p) continue;
        const len = Math.min(w.windSpeed * 1.5, 40) * dpr;
        const dir = (w.windDir || 0) * Math.PI / 180;
        ctx.strokeStyle = w.windSpeed > 50 ? 'rgba(255,95,87,0.7)' : w.windSpeed > 20 ? 'rgba(254,188,46,0.7)' : 'rgba(123,97,255,0.5)';
        ctx.lineWidth = 1.5*dpr;
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]);
        ctx.lineTo(p[0]+Math.sin(dir)*len, p[1]-Math.cos(dir)*len);
        ctx.stroke();
        // Arrow head
        const ax = p[0]+Math.sin(dir)*len, ay = p[1]-Math.cos(dir)*len;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax-Math.sin(dir-0.4)*5*dpr, ay+Math.cos(dir-0.4)*5*dpr);
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax-Math.sin(dir+0.4)*5*dpr, ay+Math.cos(dir+0.4)*5*dpr);
        ctx.stroke();
      }
    }

    if (overlays[3].active && overlayData.iss) {
      const iss = overlayData.iss;
      const p = project(eye, view, proj, W, H, iss.lat, iss.lon, iss.alt||0.06);
      if (p) {
        // Orbit trail
        ctx.strokeStyle = 'rgba(40,200,64,0.2)';
        ctx.lineWidth = 1*dpr;
        ctx.beginPath();
        for (let i = -30; i <= 30; i++) {
          const tlon = iss.lon + i * 1.5;
          const tp = project(eye, view, proj, W, H, iss.lat + Math.sin(i*0.1)*2, tlon, iss.alt||0.06);
          if (tp) { if (i===-30) ctx.moveTo(tp[0],tp[1]); else ctx.lineTo(tp[0],tp[1]); }
        }
        ctx.stroke();
        // ISS icon
        ctx.fillStyle = '#28c840';
        ctx.beginPath(); ctx.arc(p[0],p[1],5*dpr,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(p[0],p[1],2*dpr,0,Math.PI*2); ctx.fill();
        ctx.font = `bold ${8*dpr}px ${getComputedStyle(document.body).fontFamily}`;
        ctx.fillStyle = '#28c840';
        ctx.fillText('ISS', p[0]+8*dpr, p[1]+3*dpr);
      }
    }

    // Wildfires
    if (overlays[5].active && overlayData.wildfires.length > 0) {
      for (const wf of overlayData.wildfires) {
        const p = project(eye, view, proj, W, H, wf.lat, wf.lon);
        if (!p) continue;
        // Animated flame effect
        const pulse = 1 + 0.3 * Math.sin(Date.now()/200 + wf.lat);
        const sz = 6 * dpr * pulse;
        // Outer glow
        const grad = ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],sz*2);
        grad.addColorStop(0, 'rgba(255,107,43,0.6)');
        grad.addColorStop(0.5, 'rgba(255,60,0,0.2)');
        grad.addColorStop(1, 'rgba(255,30,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p[0],p[1],sz*2,0,Math.PI*2); ctx.fill();
        // Core
        ctx.fillStyle = 'rgba(255,200,50,0.9)';
        ctx.beginPath(); ctx.arc(p[0],p[1],sz*0.4,0,Math.PI*2); ctx.fill();
        // Label
        if (cam.dist < 30) {
          ctx.font = `${7*dpr}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = 'rgba(255,150,80,0.7)';
          ctx.fillText(wf.title.substring(0,30), p[0]+sz+2*dpr, p[1]+3*dpr);
        }
      }
    }

    // Storms
    if (overlays[6].active && overlayData.storms.length > 0) {
      for (const st of overlayData.storms) {
        const p = project(eye, view, proj, W, H, st.lat, st.lon);
        if (!p) continue;
        const spin = Date.now()/500 + st.lon;
        const sz = 10 * dpr;
        ctx.save(); ctx.translate(p[0],p[1]); ctx.rotate(spin);
        ctx.strokeStyle = 'rgba(204,68,255,0.6)';
        ctx.lineWidth = 1.5*dpr;
        ctx.beginPath();
        for (let a = 0; a < Math.PI*4; a += 0.1) {
          const r2 = (a/Math.PI/4)*sz;
          const sx = Math.cos(a)*r2, sy = Math.sin(a)*r2;
          if (a===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
        }
        ctx.stroke();
        ctx.restore();
        if (cam.dist < 40) {
          ctx.font = `${7*dpr}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = 'rgba(204,68,255,0.6)';
          ctx.fillText(st.title.substring(0,25), p[0]+sz+2*dpr, p[1]+3*dpr);
        }
      }
    }

    // Volcanoes
    if (overlays[7].active && overlayData.volcanoes.length > 0) {
      for (const vo of overlayData.volcanoes) {
        const p = project(eye, view, proj, W, H, vo.lat, vo.lon);
        if (!p) continue;
        const sz = 5*dpr;
        // Triangle
        ctx.fillStyle = 'rgba(255,34,34,0.8)';
        ctx.beginPath();
        ctx.moveTo(p[0], p[1]-sz); ctx.lineTo(p[0]-sz*0.7, p[1]+sz*0.5); ctx.lineTo(p[0]+sz*0.7, p[1]+sz*0.5);
        ctx.closePath(); ctx.fill();
        // Smoke puff
        const puff = 2 + Math.sin(Date.now()/300)*1.5;
        ctx.fillStyle = 'rgba(200,200,200,0.15)';
        ctx.beginPath(); ctx.arc(p[0], p[1]-sz-puff*dpr, 3*dpr, 0, Math.PI*2); ctx.fill();
        if (cam.dist < 30) {
          ctx.font = `${7*dpr}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = 'rgba(255,100,100,0.7)';
          ctx.fillText(vo.title.substring(0,25), p[0]+sz+2*dpr, p[1]+3*dpr);
        }
      }
    }

    // Fireballs (meteor impacts)
    if (overlays[8].active && overlayData.fireballs.length > 0) {
      for (const fb of overlayData.fireballs) {
        const p = project(eye, view, proj, W, H, fb.lat, fb.lon);
        if (!p) continue;
        const en = Math.max(2, Math.min(20, Math.sqrt(fb.energy||0.1) * 6));
        const sz = en * dpr;
        // Impact burst
        const grad = ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],sz);
        grad.addColorStop(0, 'rgba(255,255,200,0.9)');
        grad.addColorStop(0.3, 'rgba(255,170,0,0.5)');
        grad.addColorStop(0.7, 'rgba(255,80,0,0.2)');
        grad.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p[0],p[1],sz,0,Math.PI*2); ctx.fill();
        // Cross mark
        ctx.strokeStyle = 'rgba(255,200,50,0.6)';
        ctx.lineWidth = 1*dpr;
        ctx.beginPath(); ctx.moveTo(p[0]-3*dpr,p[1]); ctx.lineTo(p[0]+3*dpr,p[1]); ctx.moveTo(p[0],p[1]-3*dpr); ctx.lineTo(p[0],p[1]+3*dpr); ctx.stroke();
        if (cam.dist < 40) {
          ctx.font = `${6*dpr}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = 'rgba(255,200,100,0.6)';
          const lbl = fb.energy > 0 ? `${fb.energy.toFixed(1)} kT` : fb.date.slice(0,10);
          ctx.fillText(lbl, p[0]+sz+2*dpr, p[1]+3*dpr);
        }
      }
    }

    // Solar flares (shown as a status bar, not geographic)
    if (overlays[9].active && overlayData.solarFlares.length > 0) {
      const barX = 12*dpr, barY = (H - 120*dpr);
      ctx.fillStyle = 'rgba(12,12,34,0.8)';
      ctx.fillRect(barX-4*dpr, barY-14*dpr, 180*dpr, (overlayData.solarFlares.length*12+20)*dpr);
      ctx.font = `bold ${8*dpr}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillStyle = 'rgba(255,221,0,0.8)';
      ctx.fillText('SOLAR FLARES (30d)', barX, barY);
      ctx.font = `${7*dpr}px ${getComputedStyle(document.body).fontFamily}`;
      let fy = barY + 12*dpr;
      for (const sf of overlayData.solarFlares.slice(0,8)) {
        const isX = sf.classType.startsWith('X'), isM = sf.classType.startsWith('M');
        ctx.fillStyle = isX ? 'rgba(255,60,60,0.9)' : isM ? 'rgba(255,180,50,0.8)' : 'rgba(150,150,255,0.6)';
        ctx.fillText(`${sf.classType}  ${sf.peakTime.slice(5,16)}  AR${sf.region}`, barX, fy);
        fy += 11*dpr;
      }
    }

    // Ocean buoys
    if (overlays[10].active && overlayData.buoys.length > 0) {
      for (const b of overlayData.buoys) {
        const p = project(eye, view, proj, W, H, b.lat, b.lon);
        if (!p) continue;
        // Small diamond
        ctx.fillStyle = b.waveHeight && b.waveHeight > 3 ? 'rgba(255,180,50,0.6)' : 'rgba(0,204,170,0.5)';
        ctx.beginPath();
        ctx.moveTo(p[0],p[1]-3*dpr); ctx.lineTo(p[0]+2*dpr,p[1]); ctx.lineTo(p[0],p[1]+3*dpr); ctx.lineTo(p[0]-2*dpr,p[1]);
        ctx.closePath(); ctx.fill();
        if (cam.dist < 18) {
          ctx.font = `${6*dpr}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = 'rgba(0,204,170,0.6)';
          let lbl = b.id;
          if (b.waterTemp !== null) lbl += ` ${b.waterTemp.toFixed(0)}C`;
          if (b.waveHeight !== null) lbl += ` ${b.waveHeight.toFixed(1)}m`;
          ctx.fillText(lbl, p[0]+4*dpr, p[1]+3*dpr);
        }
      }
    }

    // City labels
    if (showLabels && cam.dist < 40) {
      ctx.font = `${7*dpr}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.fillStyle = 'rgba(200,200,224,0.3)';
      const cities = [[35.69,139.69,'Tokyo'],[40.71,-74.01,'New York'],[51.51,-0.13,'London'],
        [-33.87,151.21,'Sydney'],[48.86,2.35,'Paris'],[55.76,37.62,'Moscow'],
        [39.90,116.41,'Beijing'],[19.43,-99.13,'Mexico City'],[30.04,31.24,'Cairo'],
        [-23.55,-46.63,'Sao Paulo'],[28.61,77.21,'Delhi'],[37.57,126.98,'Seoul']];
      for (const [lat,lon,name] of cities) {
        const p = project(eye, view, proj, W, H, lat, lon);
        if (p) { ctx.fillRect(p[0]-1*dpr,p[1]-1*dpr,2*dpr,2*dpr); ctx.fillText(name, p[0]+4*dpr, p[1]+3*dpr); }
      }
    }

    // Update overlay counts
    for (const ov of overlays) {
      const el = document.getElementById('ov-count-'+ov.id);
      if (el) el.textContent = ov.count > 0 ? ov.count.toLocaleString() : '';
    }

    // HUD
    document.getElementById('hud-lat').textContent = 'Lat: '+cam.lat.toFixed(1);
    document.getElementById('hud-lon').textContent = 'Lon: '+(cam.lon>180?cam.lon-360:cam.lon).toFixed(1);
    document.getElementById('hud-alt').textContent = 'Alt: '+Math.round((cam.dist-R)*1000).toLocaleString()+' km';

    // FPS
    frames++;
    const now2 = performance.now();
    if (now2 - lastT > 1000) {
      document.getElementById('fps').textContent = frames+' fps';
      document.getElementById('status').textContent = overlayData.aircraft.length+' aircraft, '+overlayData.earthquakes.length+' quakes';
      frames = 0; lastT = now2;
    }

    requestAnimationFrame(frame);
  }

  buildOverlayPanel();
  startOverlayFetches();
  requestAnimationFrame(frame);

  // Input
  canvas.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; cam.autoRotate=false; document.body.classList.add('dragging'); });
  window.addEventListener('mouseup', () => { dragging=false; document.body.classList.remove('dragging'); });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    cam.lon -= (e.clientX-lastX)*0.3;
    cam.lat = Math.max(-89,Math.min(89, cam.lat+(e.clientY-lastY)*0.3));
    lastX=e.clientX; lastY=e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    cam.dist = Math.max(R+0.1, Math.min(200, cam.dist*(1+e.deltaY*0.001)));
  }, {passive:false});

  // Buttons
  document.getElementById('btn-grid').addEventListener('click', () => { showGrid=!showGrid; document.getElementById('btn-grid').classList.toggle('active'); });
  document.getElementById('btn-labels').addEventListener('click', () => { showLabels=!showLabels; document.getElementById('btn-labels').classList.toggle('active'); });
  document.getElementById('btn-rotate').addEventListener('click', () => { cam.autoRotate=!cam.autoRotate; document.getElementById('btn-rotate').classList.toggle('active'); });
  document.getElementById('zoom-in').addEventListener('click', () => cam.dist=Math.max(R+0.1,cam.dist*0.7));
  document.getElementById('zoom-out').addEventListener('click', () => cam.dist=Math.min(200,cam.dist*1.4));
  document.getElementById('zoom-home').addEventListener('click', () => { cam.lat=30;cam.lon=0;cam.dist=25; });
  document.getElementById('info-close').addEventListener('click', () => document.getElementById('info-popup').style.display='none');

  document.getElementById('btn-goto').addEventListener('click', () => {
    const loc = prompt('Enter city or lat,lon:');
    if (!loc) return;
    const known = {'tokyo':[35.69,139.69],'new york':[40.71,-74.01],'london':[51.51,-0.13],
      'paris':[48.86,2.35],'sydney':[-33.87,151.21],'moscow':[55.76,37.62],
      'beijing':[39.90,116.41],'cairo':[30.04,31.24],'delhi':[28.61,77.21],
      'seoul':[37.57,126.98],'los angeles':[34.05,-118.24],'berlin':[52.52,13.41],
      'rome':[41.90,12.50],'dubai':[25.20,55.27],'singapore':[1.35,103.82],
      'toronto':[43.65,-79.38],'mexico city':[19.43,-99.13],'nairobi':[-1.29,36.82]};
    const k = known[loc.toLowerCase()];
    if (k) { cam.lat=k[0]; cam.lon=k[1]; cam.dist=12; cam.autoRotate=false; return; }
    const parts = loc.split(',').map(s=>parseFloat(s.trim()));
    if (parts.length===2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
      cam.lat=parts[0]; cam.lon=parts[1]; cam.dist=12; cam.autoRotate=false;
    }
  });
}

main().catch(e => { console.error(e); document.getElementById('error').style.display='block'; document.getElementById('error').textContent='Error: '+e.message; });
