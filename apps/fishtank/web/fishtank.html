<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Aquarium</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh}canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block}.hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:linear-gradient(180deg,rgba(0,0,0,0.6),transparent);pointer-events:none;z-index:10;font-size:12px}.hud-left{display:flex;align-items:center;gap:16px}.hud-brand{font-size:16px;font-weight:700;color:#5ac8fa;letter-spacing:2px}.hud-stat{color:rgba(255,255,255,0.5)}.hud-stat span{color:rgba(255,255,255,0.8);font-weight:600}.hud-right{display:flex;gap:12px}.controls{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:linear-gradient(0deg,rgba(0,0,0,0.6),transparent);z-index:10}.ctrl-btn{background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);color:#e0e0e0;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;transition:all 0.2s;display:flex;align-items:center;gap:6px;user-select:none}.ctrl-btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);transform:translateY(-1px)}.ctrl-btn:active{transform:scale(0.97)}.ctrl-btn .icon{font-size:16px}.ctrl-sep{width:1px;height:24px;background:rgba(255,255,255,0.1)}.species-bar{position:fixed;bottom:56px;left:0;right:0;text-align:center;padding:6px;z-index:10;font-size:11px;color:rgba(255,255,255,0.35);pointer-events:none}.add-menu{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(10,15,25,0.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:8px;z-index:20;display:none;min-width:180px}.add-menu.open{display:block}.add-option{padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;color:#ccc;transition:background 0.1s}.add-option:hover{background:rgba(255,255,255,0.1);color:#fff}#status{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,0.3);z-index:5;pointer-events:none}</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="status">Initializing WebGPU...</div>
<div class="hud"><div class="hud-left"><span class="hud-brand">CODEX AQUARIUM</span><span class="hud-stat"><span id="fish-count">0</span></span><span class="hud-stat">Temp <span id="temp">76.5&#xB0;F</span></span><span class="hud-stat"><span id="tod">Day</span></span></div><div class="hud-right"><span class="hud-stat"><span id="fps">--</span></span></div></div>
<div class="species-bar" id="species"></div>
<div class="controls"><button class="ctrl-btn" onclick="feedFish()">Feed</button><button class="ctrl-btn" onclick="tapGlass()">Tap Glass</button><div class="ctrl-sep"></div><button class="ctrl-btn" onclick="toggleLight()">Light</button><div class="ctrl-sep"></div><button class="ctrl-btn" onclick="toggleAddMenu()">Add Fish</button></div>

<div class="add-menu" id="add-menu">
<div class="add-option" onclick="addFishByName('Clownfish');hideAddMenu()">Clownfish</div>
<div class="add-option" onclick="addFishByName('Angelfish');hideAddMenu()">Angelfish</div>
<div class="add-option" onclick="addFishByName('Neon Tetra');hideAddMenu()">Neon Tetra</div>
<div class="add-option" onclick="addFishByName('Blue Tang');hideAddMenu()">Blue Tang</div>
<div class="add-option" onclick="addFishByName('Discus');hideAddMenu()">Discus</div>
<div class="add-option" onclick="addFishByName('Guppy');hideAddMenu()">Guppy</div>
<div class="add-option" onclick="addFishByName('Seahorse');hideAddMenu()">Seahorse</div>
<div class="add-option" onclick="addFishByName('Shrimp');hideAddMenu()">Shrimp</div>
</div>
<script>function toggleAddMenu(){document.getElementById('add-menu').classList.toggle('open');}function hideAddMenu(){document.getElementById('add-menu').classList.remove('open');}document.addEventListener('click',function(e){if(!e.target.closest('.add-menu')&&!e.target.closest('[onclick*="toggleAddMenu"]'))hideAddMenu();});</script>

<script src="fishtank.js"></script>
</body>
</html>
