<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex — Game</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
<style>
  .game-page { max-width: 600px; margin: 0 auto; }
  .result-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; margin-bottom: 16px; text-align: center; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .result-text { font-size: 18px; color: #e6edf3; margin-bottom: 8px; line-height: 1.6; }
  .result-seed { font-size: 12px; color: #484f58; }
  .spinner { color: #58a6ff; font-size: 14px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; justify-content: center; }
  .controls button { background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-family: inherit; font-size: 14px; padding: 8px 24px; cursor: pointer; }
  .controls button:hover { border-color: #58a6ff; color: #58a6ff; }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  .engine-tag { background: #238636; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-left: 12px; }
  .history { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #8b949e; line-height: 1.8; max-height: 200px; overflow-y: auto; }
</style>
</head>
<body>
<nav class="topbar">
  <span class="topbar-logo">&#x2588; CODEX</span>
  <a href="/#games" class="tab-btn">&#x2190; Games</a>
  <span class="tab-btn active" id="game-title">Game</span>
  <span class="engine-tag">Codex VM</span>
</nav>
<div class="content game-page">
  <div class="controls">
    <button id="btn-run" onclick="runGame()">&#x25B6; Run Game</button>
    <button onclick="runGame()">&#x21BB; Again</button>
  </div>
  <div class="result-card" id="result">
    <div class="spinner">Press Run to play a simulated game on the Codex VM.</div>
  </div>
  <div class="history" id="history"></div>
</div>
<script>
var GAME_NAMES = {
  blackjack:'Blackjack',bridge:'Bridge',crazyeights:'Crazy Eights',
  gofish:'Go Fish',pinochle:'Pinochle',poker:'Poker',
  pokervariants:'Poker Variants',war:'War',rps:'Rock Paper Scissors',
  yahtzee:'Yahtzee',liarsdice:"Liar's Dice",mastermind:'Mastermind',
  mahjong:'Mahjong Solitaire',hexwar:'Hex War',battleship:'Battleship',
  monopoly:'Monopoly',risk:'Risk',spider:'Spider Solitaire',
  sudoku:'Sudoku',setgame:'The Set Game',magic:'Magic: The Gathering'
};
var gameId = location.pathname.split('/').pop();
var gameName = GAME_NAMES[gameId] || gameId;
document.title = 'Codex — ' + gameName;
document.getElementById('game-title').textContent = gameName;

async function runGame() {
  var btn = document.getElementById('btn-run');
  btn.disabled = true;
  document.getElementById('result').innerHTML = '<div class="spinner">Running ' + gameName + ' on Codex VM...</div>';
  var seed = Date.now() & 0x7FFFFFFF;
  try {
    var resp = await fetch('/api/run/' + gameId + '?seed=' + seed);
    var data = await resp.json();
    document.getElementById('result').innerHTML =
      '<div class="result-text">' + data.result + '</div>' +
      '<div class="result-seed">seed: ' + data.seed + '</div>';
    var hist = document.getElementById('history');
    hist.innerHTML = data.result + '<br>' + hist.innerHTML;
  } catch (e) {
    document.getElementById('result').innerHTML = '<div class="spinner" style="color:#f85149">Error: ' + e.message + '</div>';
  }
  btn.disabled = false;
}
</script>
</body>
</html>
