<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex — Minesweeper</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
<style>
  body { background: #0a0d0a; }
  .game-page { max-width: 700px; margin: 0 auto; }
  .bg-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('/assets/games/minesweeper/bg-scene.png') center/cover no-repeat;
    filter: brightness(0.25) blur(2px); z-index: 0; }
  .content { position: relative; z-index: 1; }
  .board-wrap { background: #0a0d0a88; border: 2px solid #ff880044; border-radius: 8px; padding: 12px;
    margin-bottom: 12px; display: flex; justify-content: center; backdrop-filter: blur(4px); }
  .ms-grid { display: grid; grid-template-columns: repeat(9, 42px); grid-template-rows: repeat(9, 42px); gap: 2px; }
  .ms-cell { background: #1a2a1a; border: 1px solid #2a3a2a; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: bold; font-family: 'Courier New', monospace; transition: background 0.15s; }
  .ms-cell.hidden { background: #2a3a2a; color: #2a3a2a; }
  .ms-cell.revealed { background: #0a1a0a; }
  .ms-cell.mine { background: #ff220022; color: #ff4444; }
  .ms-cell.n0 { color: #0a1a0a; } .ms-cell.n1 { color: #4488ff; } .ms-cell.n2 { color: #44cc44; }
  .ms-cell.n3 { color: #ff4444; } .ms-cell.n4 { color: #aa44ff; } .ms-cell.n5 { color: #ff8800; }
  .ms-cell.n6 { color: #44cccc; } .ms-cell.n7 { color: #cccccc; } .ms-cell.n8 { color: #888888; }
  .score-bar { display: flex; gap: 16px; justify-content: center; margin-bottom: 10px; font-size: 13px; color: #ff8800; font-family: 'Courier New', monospace; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .controls button { background: linear-gradient(180deg, #2a1a0a, #1a0a00);
    border: 1px solid #ff8800; border-radius: 6px; color: #ff8800;
    font-family: 'Courier New', monospace; font-size: 13px; padding: 6px 16px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; }
  .controls button:hover { color: #ffaa44; box-shadow: 0 0 8px rgba(255,136,0,0.2); }
  .controls button:disabled { opacity: 0.3; }
  #status-line { color: #ff8800; font-size: 13px; margin-bottom: 8px; text-align: center; font-family: 'Courier New', monospace; }
  .speed-label { color: #ff880066; font-size: 12px; }
  .engine-tag { background: #1a0a00; color: #ff8800; font-size: 10px; padding: 2px 8px;
    border-radius: 4px; margin-left: 12px; border: 1px solid #ff880044; }
</style>
</head>
<body>
<div class="bg-scene"></div>
<nav class="topbar" style="background:#0a0d0a;border-color:#ff880022">
  <span class="topbar-logo" style="color:#ff8800">&#x2588; CODEX</span>
  <a href="/#games" class="tab-btn" style="color:#ff880066">&#x2190; Games</a>
  <span class="tab-btn active" style="color:#ff8800;border-color:#ff8800">Minesweeper</span>
  <span class="engine-tag">Codex VM</span>
</nav>
<div class="content game-page">
  <div class="controls">
    <button onclick="startGame()">&#x25B6; SWEEP</button>
    <button id="btn-pause" onclick="togglePause()" disabled>&#x23F8; HOLD</button>
    <button id="btn-step" onclick="stepOnce()" disabled>&#x23ED; PROBE</button>
    <button onclick="resetGame()">&#x21BB; NEW FIELD</button>
    <span class="speed-label">RATE:</span>
    <input type="range" id="speed" min="1" max="10" value="5" style="width:80px;accent-color:#ff8800" oninput="updateSpeed()">
  </div>
  <div id="status-line">MINEFIELD DETECTED. AWAITING ORDERS.</div>
  <div class="score-bar">
    <span>CLEARED: <span id="revealed-count">0</span>/71</span>
    <span>CASUALTIES: <span id="mines-hit">0</span></span>
    <span>OPS: <span id="move-count">0</span></span>
  </div>
  <div class="board-wrap"><div class="ms-grid" id="board"></div></div>
</div>
<script>
var state,running=false,paused=false,timer,delay=250;
function updateSpeed(){var v=parseInt(document.getElementById('speed').value);delay=[2000,1200,800,500,350,250,150,80,30,5][v-1]||250}
async function api(p){try{var r=await fetch(p);return r.json()}catch(e){return null}}
function render(s){var h='';for(var i=0;i<81;i++){var isR=s.revealed[i]===1;var isM=s.mines&&s.mines.length>0&&s.mines[i]===1;if(!isR){if(s.done&&isM)h+='<div class="ms-cell mine">&#x1F4A3;</div>';else h+='<div class="ms-cell hidden">&#x25A0;</div>'}else if(isM)h+='<div class="ms-cell mine">&#x1F4A3;</div>';else{var a=s.adjacent[i];h+='<div class="ms-cell revealed n'+a+'">'+(a||'')+'</div>'}}document.getElementById('board').innerHTML=h;document.getElementById('revealed-count').textContent=s.cellsRevealed;document.getElementById('mines-hit').textContent=s.minesHit;document.getElementById('move-count').textContent=s.moves}
async function resetGame(){clearTimeout(timer);running=false;paused=false;state=await api('/api/minesweeper/new?seed='+(Date.now()&0x7FFFFFFF));if(state)render(state);document.getElementById('status-line').textContent='MINEFIELD DETECTED. AWAITING ORDERS.';document.getElementById('btn-pause').disabled=true;document.getElementById('btn-step').disabled=true}
async function startGame(){await resetGame();running=true;document.getElementById('btn-pause').disabled=false;document.getElementById('btn-step').disabled=false;updateSpeed();document.getElementById('status-line').textContent='SWEEP IN PROGRESS...';scheduleTick()}
function togglePause(){if(!running)return;paused=!paused;document.getElementById('btn-pause').textContent=paused?'▶ GO':'⏸ HOLD';document.getElementById('btn-step').disabled=!paused;if(!paused)scheduleTick()}
function scheduleTick(){if(!paused&&running)timer=setTimeout(tick,delay)}
async function stepOnce(){if(running)await tick()}
async function tick(){if(!running||!state)return;if(state.done){document.getElementById('status-line').textContent=state.won?'FIELD CLEARED. ALL PERSONNEL SAFE.':'MINE DETONATED. CASUALTIES REPORTED.';running=false;document.getElementById('btn-pause').disabled=true;document.getElementById('btn-step').disabled=true;return}state=await api('/api/minesweeper/step');if(!state){running=false;return}render(state);if(state.done){document.getElementById('status-line').textContent=state.won?'FIELD CLEARED. MISSION COMPLETE.':'MINE DETONATED. MAN DOWN.';running=false;return}document.getElementById('status-line').textContent='SWEEP OP '+state.moves+' | '+state.cellsRevealed+'/71 CLEARED';scheduleTick()}
updateSpeed();resetGame();
</script>
</body>
</html>
