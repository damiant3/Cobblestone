<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex — Go!</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
<style>
  body { background: #1a2a1a; }
  .game-page { max-width: 600px; margin: 0 auto; }
  .bg-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('/assets/games/go/bg-scene.png') center/cover no-repeat;
    filter: brightness(0.35) blur(2px); z-index: 0; }
  .content { position: relative; z-index: 1; }
  .arena { background: linear-gradient(135deg, #ffeecc88, #ffe0aa88); border: 4px solid #ffaacc;
    border-radius: 20px; padding: 30px; margin-bottom: 12px; text-align: center;
    backdrop-filter: blur(8px); box-shadow: 0 0 30px rgba(255,170,200,0.2); }
  .zen { font-size: 48px; margin: 16px 0; }
  .result-text { font-size: 20px; font-weight: bold; color: #cc6688; margin-top: 16px; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; justify-content: center; }
  .controls button { background: linear-gradient(180deg, #ffaacc, #ee6699); border: 2px solid #ffccdd;
    border-radius: 20px; color: #fff; font-family: inherit; font-size: 16px; padding: 10px 28px;
    cursor: pointer; font-weight: bold; }
  .controls button:hover { transform: scale(1.05); }
  .controls button:disabled { opacity: 0.3; }
  .engine-tag { background: #2a1a2a; color: #ffaacc; font-size: 10px; padding: 2px 8px;
    border-radius: 10px; margin-left: 12px; border: 1px solid #ffaacc44; }
  .history { background: #1a2a1acc; border: 1px solid #ffaacc22; border-radius: 12px;
    padding: 10px; max-height: 100px; overflow-y: auto; font-size: 12px; color: #ffaacc66; line-height: 1.8; }
</style>
</head>
<body>
<div class="bg-scene"></div>
<nav class="topbar" style="background:#1a2a1a;border-color:#ffaacc22">
  <span class="topbar-logo" style="color:#ffaacc">&#x2588; CODEX</span>
  <a href="/#games" class="tab-btn" style="color:#88aa88">&#x2190; Games</a>
  <span class="tab-btn active" style="color:#ffaacc;border-color:#ffaacc">Go!</span>
  <span class="engine-tag">Codex VM</span>
</nav>
<div class="content game-page">
  <div class="controls"><button onclick="runGame()">&#x1F338; Play!</button></div>
  <div class="arena" id="arena">
    <div class="zen">&#x1F43C; &#x26AB; &#x26AA; &#x1F98A;</div>
    <div style="color:#cc6688">Panda vs Fox on the Go board!</div>
  </div>
  <div class="history" id="history"></div>
</div>
<script>
async function runGame(){var a=document.getElementById('arena');a.innerHTML='<div class="zen">&#x1F43C; &#x1F338; &#x1F98A;</div><div style="color:#ffaacc">Placing stones...</div>';try{var r=await fetch('/api/go/new');var d=await r.json();a.innerHTML='<div class="zen">&#x1F43C; &#x1F3C6; &#x1F98A;</div><div class="result-text">'+d.result+'</div>';document.getElementById('history').innerHTML=d.result+'<br>'+document.getElementById('history').innerHTML}catch(e){a.innerHTML='<div style="color:#ff4444">'+e.message+'</div>'}}
</script>
</body>
</html>
