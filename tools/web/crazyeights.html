<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex — Crazy Eights!</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
<style>
  body { background: #1a0a2a; }
  .game-page { max-width: 600px; margin: 0 auto; }
  .bg-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('/assets/games/crazyeights/bg-scene.png') center/cover no-repeat;
    filter: brightness(0.3) blur(3px); z-index: 0; }
  .content { position: relative; z-index: 1; }
  .arena { background: linear-gradient(135deg, #6622aa88, #4411aa88); border: 4px solid #ffcc00;
    border-radius: 20px; padding: 30px; margin-bottom: 12px; text-align: center;
    backdrop-filter: blur(8px); box-shadow: 0 0 30px rgba(255,200,0,0.2); }
  .magic-cards { font-size: 48px; margin: 16px 0; animation: wobble 2s infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .result-text { font-size: 22px; font-weight: bold; color: #ffcc00; margin-top: 16px; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; justify-content: center; }
  .controls button { background: linear-gradient(180deg, #ffcc00, #ff9900); border: 2px solid #ffdd44;
    border-radius: 20px; color: #2a0a4a; font-family: inherit; font-size: 16px; padding: 10px 28px;
    cursor: pointer; font-weight: bold; }
  .controls button:hover { transform: scale(1.1) rotate(-2deg); }
  .controls button:disabled { opacity: 0.3; }
  .engine-tag { background: #2a1a4a; color: #ffcc00; font-size: 10px; padding: 2px 8px;
    border-radius: 10px; margin-left: 12px; border: 1px solid #ffcc0044; }
  .history { background: #1a0a2acc; border: 1px solid #ffcc0022; border-radius: 12px;
    padding: 10px; max-height: 100px; overflow-y: auto; font-size: 12px; color: #ffcc0066; line-height: 1.8; }
</style>
</head>
<body>
<div class="bg-scene"></div>
<nav class="topbar" style="background:#1a0a2a;border-color:#ffcc0022">
  <span class="topbar-logo" style="color:#ffcc00">&#x2588; CODEX</span>
  <a href="/#games" class="tab-btn" style="color:#aa88cc">&#x2190; Games</a>
  <span class="tab-btn active" style="color:#ffcc00;border-color:#ffcc00">Crazy Eights!</span>
  <span class="engine-tag">Codex VM</span>
</nav>
<div class="content game-page">
  <div class="controls"><button onclick="runGame()">&#x2728; ABRACADABRA!</button></div>
  <div class="arena" id="arena">
    <div class="magic-cards">&#x1F0A8; &#x2728; &#x1F0B8; &#x2728; &#x1F0C8;</div>
    <div style="color:#aa88cc">The crazy eights are WILD!</div>
  </div>
  <div class="history" id="history"></div>
</div>
<script>
async function runGame(){var a=document.getElementById('arena');a.innerHTML='<div class="magic-cards">&#x1F0A0; &#x2728; &#x1F0A0;</div><div style="color:#ffcc00">Magic happening...</div>';try{var r=await fetch('/api/run/crazyeights?seed='+(Date.now()&0x7FFFFFFF));var d=await r.json();a.innerHTML='<div class="magic-cards">&#x1F0A8; &#x1F389; &#x1F0B8;</div><div class="result-text">'+d.result+'</div>';document.getElementById('history').innerHTML=d.result+'<br>'+document.getElementById('history').innerHTML}catch(e){a.innerHTML='<div style="color:#ff4444">'+e.message+'</div>'}}
</script>
</body>
</html>
