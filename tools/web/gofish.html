<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex — Go Fish!</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
<style>
  body { background: #0a1a3a; }
  .game-page { max-width: 600px; margin: 0 auto; }
  .bg-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('/assets/games/gofish/bg-scene.png') center/cover no-repeat;
    filter: brightness(0.4) blur(2px); z-index: 0; }
  .content { position: relative; z-index: 1; }
  .arena { background: linear-gradient(180deg, #0066aa44, #003366aa); border: 4px solid #00ccff;
    border-radius: 20px; padding: 30px; margin-bottom: 12px; text-align: center;
    backdrop-filter: blur(8px); box-shadow: 0 0 30px rgba(0,200,255,0.2); }
  .fish { font-size: 48px; margin: 16px 0; }
  .fish span { display: inline-block; animation: swim 3s ease-in-out infinite; }
  .fish span:nth-child(2) { animation-delay: 0.3s; } .fish span:nth-child(3) { animation-delay: 0.6s; }
  .fish span:nth-child(4) { animation-delay: 0.9s; }
  @keyframes swim { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .result-text { font-size: 20px; font-weight: bold; color: #00ccff; margin-top: 16px; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; justify-content: center; }
  .controls button { background: linear-gradient(180deg, #00aaff, #0066cc); border: 2px solid #44ccff;
    border-radius: 20px; color: #fff; font-family: inherit; font-size: 16px; padding: 10px 28px;
    cursor: pointer; font-weight: bold; }
  .controls button:hover { transform: scale(1.1); }
  .controls button:disabled { opacity: 0.3; }
  .engine-tag { background: #0a1a3a; color: #00ccff; font-size: 10px; padding: 2px 8px;
    border-radius: 10px; margin-left: 12px; border: 1px solid #00ccff44; }
  .history { background: #0a1a3acc; border: 1px solid #00ccff22; border-radius: 12px;
    padding: 10px; max-height: 100px; overflow-y: auto; font-size: 12px; color: #00ccff66; line-height: 1.8; }
</style>
</head>
<body>
<div class="bg-scene"></div>
<nav class="topbar" style="background:#0a1a3a;border-color:#00ccff22">
  <span class="topbar-logo" style="color:#00ccff">&#x2588; CODEX</span>
  <a href="/#games" class="tab-btn" style="color:#4488aa">&#x2190; Games</a>
  <span class="tab-btn active" style="color:#00ccff;border-color:#00ccff">Go Fish!</span>
  <span class="engine-tag">Codex VM</span>
</nav>
<div class="content game-page">
  <div class="controls"><button onclick="runGame()">&#x1F41F; GO FISH!</button></div>
  <div class="arena" id="arena">
    <div class="fish"><span>&#x1F420;</span> <span>&#x1F41F;</span> <span>&#x1F421;</span> <span>&#x1F42C;</span></div>
    <div style="color:#44ccff">Got any... threes?</div>
  </div>
  <div class="history" id="history"></div>
</div>
<script>
async function runGame(){var a=document.getElementById('arena');a.innerHTML='<div class="fish"><span>&#x1F41F;</span> <span>&#x1F30A;</span> <span>&#x1F41F;</span></div><div style="color:#00ccff">Fishing...</div>';try{var r=await fetch('/api/run/gofish?seed='+(Date.now()&0x7FFFFFFF));var d=await r.json();a.innerHTML='<div class="fish"><span>&#x1F420;</span> <span>&#x1F3C6;</span> <span>&#x1F421;</span></div><div class="result-text">'+d.result+'</div>';document.getElementById('history').innerHTML=d.result+'<br>'+document.getElementById('history').innerHTML}catch(e){a.innerHTML='<div style="color:#ff4444">'+e.message+'</div>'}}
</script>
</body>
</html>
