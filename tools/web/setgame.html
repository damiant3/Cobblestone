<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex — The Set Game</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
<style>
  body { background: #f8f8f8; color:#333; }
  .game-page { max-width: 700px; margin: 0 auto; }
  .bg-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('/assets/games/setgame/bg-scene.png') center/cover no-repeat;
    filter: brightness(0.3) blur(2px); z-index: 0; }
  .content { position: relative; z-index: 1; }
  .arena { background: #f8f8f8cc; border: 2px solid #33344; border-radius: 12px;
    padding: 30px; margin-bottom: 16px; text-align: center; min-height: 200px;
    backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .result-text { font-size: 18px; font-weight: bold; color: #111; margin-top: 16px; line-height: 1.6; }
  .flavor { color: #33388; font-size: 13px; font-style: italic; margin-top: 8px; }
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; justify-content: center; }
  .controls button { background: linear-gradient(180deg, #333, #f8f8f8);
    border: 1px solid #333; border-radius: 6px; color: #111;
    font-family: inherit; font-size: 14px; padding: 10px 28px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; }
  .controls button:hover { color: #fff; }
  .controls button:disabled { opacity: 0.3; }
  .engine-tag { background: #f8f8f8; color: #333; font-size: 10px; padding: 2px 8px;
    border-radius: 4px; margin-left: 12px; border: 1px solid #33344; }
  .history { background: #f8f8f8cc; border: 1px solid #33322; border-radius: 6px 6px 0 0;
    padding: 8px 14px; max-height: 80px; overflow-y: auto; font-size: 11px;
    color: #33366; line-height: 1.6; backdrop-filter: blur(4px);
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; }
</style>
</head>
<body>
<div class="bg-scene"></div>
<nav class="topbar" style="background:#f8f8f8;border-color:#33322">
  <span class="topbar-logo" style="color:#111">&#x2588; CODEX</span>
  <a href="/#games" class="tab-btn" style="color:#33366">&#x2190; Games</a>
  <span class="tab-btn active" style="color:#111;border-color:#111">The Set Game</span>
  <span class="engine-tag">Codex VM</span>
</nav>
<div class="content game-page">
  <div class="controls"><button id="btn" onclick="runGame()">&#x1F4A1; Find Sets</button></div>
  <div class="arena" id="arena"><div style="color:#33388">Pattern recognition at its finest.</div></div>
  <div class="history" id="history"></div>
</div>
<script>
async function runGame(){var b=document.getElementById('btn');b.disabled=true;var a=document.getElementById('arena');a.innerHTML='<div style="color:#111">Running on Codex VM...</div>';try{var r=await fetch('/api/run/setgame?seed='+(Date.now()&0x7FFFFFFF));var d=await r.json();a.innerHTML='<div class="result-text">'+d.result+'</div><div class="flavor">ANALYSIS COMPLETE</div>';document.getElementById('history').innerHTML=d.result+'<br>'+document.getElementById('history').innerHTML}catch(e){a.innerHTML='<div style="color:#ff4444">'+e.message+'</div>'}b.disabled=false}
</script>
</body>
</html>
