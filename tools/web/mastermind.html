<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Codex — Mastermind</title>
<link rel="stylesheet" href="/web/style.css?v={{VERSION}}">
<style>
  .game-page { max-width: 400px; margin: 0 auto; }
  .board { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 16px; text-align: center; }
  .secret-row { display: flex; justify-content: center; gap: 8px; margin: 16px 0; }
  .peg { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #484f58; display: flex; align-items: center; justify-content: center; }
  .peg-hidden { background: #21262d; }
  .peg-0 { background: #f85149; } .peg-1 { background: #3fb950; } .peg-2 { background: #58a6ff; }
  .peg-3 { background: #d29922; } .peg-4 { background: #bc8cff; } .peg-5 { background: #e6edf3; }
  .result-text { font-size: 18px; font-weight: bold; margin-top: 16px; }
  .result-win { color: #3fb950; } .result-fail { color: #f85149; }
  .stats { color: #8b949e; font-size: 13px; margin-top: 8px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; justify-content: center; }
  .controls button { background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-family: inherit; font-size: 14px; padding: 8px 24px; cursor: pointer; }
  .controls button:hover { border-color: #58a6ff; color: #58a6ff; }
  .engine-tag { background: #238636; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-left: 12px; }
  .label { color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .history { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #8b949e; line-height: 1.8; max-height: 160px; overflow-y: auto; }
</style>
</head>
<body>
<nav class="topbar"><span class="topbar-logo">&#x2588; CODEX</span><a href="/#games" class="tab-btn">&#x2190; Games</a><span class="tab-btn active">Mastermind</span><span class="engine-tag">Codex VM</span></nav>
<div class="content game-page">
  <div class="controls"><button onclick="runGame()">&#x1F510; Crack Code</button></div>
  <div class="board" id="board">
    <div class="label">Secret Code</div>
    <div class="secret-row"><div class="peg peg-hidden">?</div><div class="peg peg-hidden">?</div><div class="peg peg-hidden">?</div><div class="peg peg-hidden">?</div></div>
    <div style="color:#8b949e;margin-top:12px">Press Crack Code to play</div>
  </div>
  <div class="history" id="history"></div>
</div>
<script>
function pegHtml(code) {
  var digits = [Math.floor(code/1000)%6, Math.floor(code/100)%6, Math.floor(code/10)%6, code%6];
  return digits.map(function(d){return '<div class="peg peg-'+d+'"></div>'}).join('');
}
async function runGame(){
  var b=document.getElementById('board');
  b.innerHTML='<div class="label">Secret Code</div><div class="secret-row"><div class="peg peg-hidden">?</div><div class="peg peg-hidden">?</div><div class="peg peg-hidden">?</div><div class="peg peg-hidden">?</div></div><div style="color:#58a6ff;margin-top:12px">AI cracking code...</div>';
  try{
    var r=await fetch('/api/run/mastermind?seed='+(Date.now()&0x7FFFFFFF));var d=await r.json();
    var m=d.result.match(/secret=(\d+)/);var code=m?parseInt(m[1]):0;
    var cls=d.result.indexOf('Cracked')>=0?'result-win':'result-fail';
    b.innerHTML='<div class="label">Secret Code Revealed</div><div class="secret-row">'+pegHtml(code)+'</div><div class="result-text '+cls+'">'+d.result+'</div>';
    document.getElementById('history').innerHTML=d.result+'<br>'+document.getElementById('history').innerHTML;
  }catch(e){b.innerHTML='<div style="color:#f85149">Error: '+e.message+'</div>'}
}
</script>
</body>
</html>
